name: Deploy AI Gateway

on:
  push:
    branches:
      - main
    paths:
      - "apps/ai-gateway/**"
      - "packages/connect-db/**"
  workflow_dispatch:

env:
  NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"

permissions:
  contents: read

concurrency:
  group: connect-db-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy AI gateway to Cloudflare Workers
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Apply connect-db migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @bb/connect exec wrangler d1 migrations apply DB --remote

      - name: Deploy AI gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is required for the AI gateway."
            exit 1
          fi
          umask 077
          secrets_file="$RUNNER_TEMP/ai-gateway-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'process.stdout.write(JSON.stringify({ OPENROUTER_API_KEY: process.env.OPENROUTER_API_KEY }))' > "$secrets_file"
          pnpm --filter @bb/ai-gateway exec wrangler deploy --secrets-file "$secrets_file"
