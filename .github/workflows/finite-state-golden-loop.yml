name: Finite State Golden Loop

on:
  push:
    branches:
      - main
      - finite-state/integration
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

env:
  PNPM_VERSION: "9.15.0"

concurrency:
  group: finite-state-golden-loop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-golden-loop:
    name: Offline Golden Loop (Node 22.19.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository with worktree seed history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: "22.19.0"
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: finite-state-golden-loop

      - name: Run the offline Golden Loop twice
        # runner.temp is not a valid named-value in job-level `env` (the whole
        # workflow fails to parse with 0 jobs); it is only available in steps.
        env:
          GOLDEN_LOOP_EVIDENCE_DIR: ${{ runner.temp }}/finite-state-golden-loop
        run: pnpm exec turbo run test --filter=bb-plugin-finite-state --force -- test/e2e/golden-loop/harness.test.ts test/e2e/golden-loop/golden-loop.e2e.test.ts test/e2e/golden-loop/seed/seed.test.ts

      - name: Verify the committed Golden Loop seed without writes
        working-directory: plugins/bb-plugin-finite-state
        # tsx resolves @bb/plugin-sdk through its package exports to dist/,
        # which only exists after a build; the turbo test step above resolves
        # sources through vitest aliases and leaves dist/ absent on the runner.
        run: |
          pnpm exec turbo run build --filter=@bb/plugin-sdk
          pnpm exec tsx test/e2e/golden-loop/seed/generate.ts --verify test/e2e/golden-loop/seed

      - name: Upload Golden Loop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-state-golden-loop-${{ github.run_id }}
          path: ${{ runner.temp }}/finite-state-golden-loop
          if-no-files-found: error
          retention-days: 14
