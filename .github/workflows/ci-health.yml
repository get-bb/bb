name: CI Health
on:
  schedule:
    - cron: "19 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-health
  cancel-in-progress: false
jobs:
  report:
    if: github.repository == 'get-bb/bb'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Report speed and same-commit rerun recovery
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/report-ci-health.mjs
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 1
        with:
          name: ci-health-${{ github.run_id }}
          path: .ci-health/
          include-hidden-files: true
          retention-days: 30
