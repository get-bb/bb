name: CI Health
on:
  schedule:
    - cron: "19 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-health
  cancel-in-progress: false
jobs:
  report:
    if: github.repository == 'get-bb/bb'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Report speed and same-commit rerun recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/report-ci-health.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-health-${{ github.run_id }}
          path: .ci-health/
          include-hidden-files: true
          retention-days: 30
