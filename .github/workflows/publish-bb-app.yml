# bb-app and @bb/desktop versions are locked together. See
# apps/desktop/README.md#releasing and use scripts/bump-version.mjs.
name: Publish bb-app

on:
  schedule:
    - cron: "0 3 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag to apply during npm publish.
        required: true
        type: choice
        default: latest
        options:
          - alpha
          - beta
          - nightly
          - latest
      allow_prerelease_latest:
        description: Allow publishing a prerelease version with the latest tag.
        required: true
        type: boolean
        default: false
      dry_run:
        description: Run validation and npm publish --dry-run only.
        required: true
        type: boolean
        default: true

run-name: ${{ github.event_name == 'schedule' && 'Publish bb-app + desktop nightly' || format('Publish bb-app ({0}{1})', inputs.npm_tag, inputs.dry_run && ', dry run' || '') }}

# Only the npm publish job gets id-token: write, for npm trusted publishing.
# The desktop build jobs must not inherit an OIDC token they never use.
# The npm publish jobs run on GitHub-hosted runners. npm rejects provenance
# bundles from self-hosted runners such as Blacksmith (E422).
permissions:
  contents: read

concurrency:
  group: publish-bb-app-${{ (github.event_name == 'schedule' || inputs.npm_tag == 'nightly') && 'nightly' || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_ALLOW_PRERELEASE_LATEST: ${{ github.event_name == 'schedule' && 'false' || inputs.allow_prerelease_latest }}
  RELEASE_DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
  RELEASE_NPM_TAG: ${{ github.event_name == 'schedule' && 'nightly' || inputs.npm_tag }}

jobs:
  publish:
    name: Publish bb-app
    # Scheduled (nightly) runs are restricted to the canonical repository so
    # that forks, on which GitHub happily runs cron workflows, do not execute
    # release jobs that publish to npm, reset the desktop-nightly release and
    # need signing or notarization secrets they will never have. Manual
    # workflow_dispatch runs keep working in forks.
    if: ${{ github.event_name != 'schedule' || github.repository == 'get-bb/bb' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    # Every publish that moves the `nightly` dist-tag shares one group, so the
    # cron and a release run's publish-nightly job cannot move that tag at the
    # same time. A stable release publishes `latest` here instead, so it takes a
    # per-run group and never waits on the cron.
    concurrency:
      group: ${{ (github.event_name == 'schedule' || inputs.npm_tag == 'nightly') && 'publish-nightly-npm' || format('publish-bb-app-npm-{0}', github.run_id) }}
      cancel-in-progress: false

    steps:
      - name: Require main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Publish bb-app must run from the main branch, got ${GITHUB_REF}."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          node - "$npm_version" <<'NODE' || npm install --global npm@latest
          const version = process.argv[2];
          const [major, minor, patch] = version.split(".").map(Number);
          const supported =
            major > 11 ||
            (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
          process.exit(supported ? 0 : 1);
          NODE
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare nightly version
        if: ${{ github.event_name == 'schedule' || inputs.npm_tag == 'nightly' }}
        run: |
          nightly_version="$(node scripts/prepare-nightly-version.mjs)"
          echo "Prepared bb-app and desktop version ${nightly_version}."

      - name: Validate release inputs
        id: release
        env:
          ALLOW_PRERELEASE_LATEST: ${{ env.RELEASE_ALLOW_PRERELEASE_LATEST }}
          NPM_TAG: ${{ env.RELEASE_NPM_TAG }}
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { appendFileSync, readFileSync } = require("node:fs");

          function fail(message) {
            console.error(`::error::${message}`);
            process.exit(1);
          }

          const pkg = JSON.parse(
            readFileSync("packages/bb-app/package.json", "utf8"),
          );
          const version = pkg.version;
          const npmTag = process.env.NPM_TAG;
          const allowPrereleaseLatest =
            process.env.ALLOW_PRERELEASE_LATEST === "true";
          const isPrerelease = version.includes("-");
          const isAlpha = /-alpha\.\d+$/u.test(version);
          const isBeta = /-beta\.\d+$/u.test(version);
          const isNightly = /-nightly\.\d+\.\d+$/u.test(version);
          const versionsRaw = execFileSync(
            "npm",
            ["view", "bb-app", "versions", "--json"],
            { encoding: "utf8" },
          );
          const parsedVersions = JSON.parse(versionsRaw);
          const publishedVersions = Array.isArray(parsedVersions)
            ? parsedVersions
            : [parsedVersions];

          if (publishedVersions.includes(version)) {
            fail(`bb-app@${version} already exists on npm.`);
          }
          if (npmTag === "alpha" && !isAlpha) {
            fail(`npm_tag=alpha requires an alpha prerelease, got ${version}.`);
          }
          if (npmTag === "beta" && !isBeta) {
            fail(`npm_tag=beta requires a beta prerelease, got ${version}.`);
          }
          if (npmTag === "nightly" && !isNightly) {
            fail(
              `npm_tag=nightly requires a generated nightly prerelease, got ${version}.`,
            );
          }
          if (npmTag === "latest" && isPrerelease && !allowPrereleaseLatest) {
            fail(
              `Refusing to publish prerelease ${version} with latest unless allow_prerelease_latest=true.`,
            );
          }

          appendFileSync(process.env.GITHUB_ENV, `PACKAGE_VERSION=${version}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          console.log(`Preparing bb-app@${version} with npm tag ${npmTag}.`);
          NODE

      - name: Build, typecheck, and test focused packages
        run: pnpm exec turbo run typecheck test --filter=@bb/config --filter=@bb/server --filter=bb-app --output-logs=new-only

      - name: Smoke bb-app tarball
        run: pnpm exec turbo run smoke:tarball --filter=bb-app --force --output-logs=new-only

      - name: Check whitespace
        run: git diff --check

      - name: Preview npm package
        working-directory: packages/bb-app
        run: npm pack --dry-run

      - name: npm publish dry run
        if: ${{ env.RELEASE_DRY_RUN == 'true' }}
        working-directory: packages/bb-app
        env:
          NPM_TAG: ${{ env.RELEASE_NPM_TAG }}
        run: npm publish --dry-run --tag "$NPM_TAG"

      - name: Publish to npm
        if: ${{ env.RELEASE_DRY_RUN != 'true' }}
        working-directory: packages/bb-app
        env:
          NPM_TAG: ${{ env.RELEASE_NPM_TAG }}
        run: npm publish --tag "$NPM_TAG"

      - name: Summarize release
        run: |
          {
            echo "## bb-app release"
            echo
            echo "- version: \`$PACKAGE_VERSION\`"
            echo "- npm tag: \`$RELEASE_NPM_TAG\`"
            echo "- dry run: \`$RELEASE_DRY_RUN\`"
            echo "- commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # A stable release moves `latest` past the newest nightly, because a nightly
  # version is the next patch of whatever main held the night before. The
  # nightly channel would then sit behind `latest` until the next 3am cron. This
  # job republishes the nightly channel from the same release commit, at
  # <next patch>-nightly.<run id>.<attempt>, so nightly stays ahead of the
  # release it was cut from. It runs only for a real `latest` publish, and a
  # failure here cannot roll back the stable release that already shipped.
  publish-nightly:
    name: Publish bb-app nightly after the release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_tag == 'latest' && inputs.dry_run == false }}
    needs:
      - publish
      - verify-publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.nightly_version.outputs.version }}
    # Shares the publish job's nightly group. See that job for why.
    concurrency:
      group: publish-nightly-npm
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          node - "$npm_version" <<'NODE' || npm install --global npm@latest
          const version = process.argv[2];
          const [major, minor, patch] = version.split(".").map(Number);
          const supported =
            major > 11 ||
            (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
          process.exit(supported ? 0 : 1);
          NODE
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare nightly version
        id: nightly_version
        run: |
          set -euo pipefail

          # Runs after the release commit is checked out, so the derived
          # version is the next patch above the version just published.
          nightly_version="$(node scripts/prepare-nightly-version.mjs)"
          echo "PACKAGE_VERSION=${nightly_version}" >> "$GITHUB_ENV"
          echo "version=${nightly_version}" >> "$GITHUB_OUTPUT"
          echo "Prepared bb-app and desktop version ${nightly_version}."

      # bb-app's prepack hook prunes stale bb CLI chunks immediately before
      # `npm publish` packs the built output selected by its `files` list.
      # This job runs on a fresh runner, so it must build before it packs.
      # smoke:tarball depends on build and also proves the packed tarball
      # runs at the nightly version.
      - name: Smoke bb-app tarball
        run: pnpm exec turbo run smoke:tarball --filter=bb-app --force --output-logs=new-only

      - name: Preview npm package
        working-directory: packages/bb-app
        run: npm pack --dry-run

      # No typecheck or unit tests here: the publish job ran them on this same
      # commit and only the version string differs.
      - name: Publish to npm
        working-directory: packages/bb-app
        run: npm publish --tag nightly

      - name: Summarize the nightly release
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          {
            echo "## bb-app nightly after the release"
            echo
            echo "- released version: \`$RELEASE_VERSION\`"
            echo "- nightly version: \`$PACKAGE_VERSION\`"
            echo "- npm tag: \`nightly\`"
            echo "- commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-publish:
    name: Verify bb-app on npm
    if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Verify npm release
        env:
          NPM_TAG: ${{ env.RELEASE_NPM_TAG }}
          PACKAGE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          for attempt in $(seq 1 240); do
            package_version="$(npm view "bb-app@$PACKAGE_VERSION" version --json 2>/tmp/bb-app-version.err || true)"
            tag_version="$(npm view "bb-app@$NPM_TAG" version --json 2>/tmp/bb-app-tag.err || true)"

            if [ "$package_version" = "\"$PACKAGE_VERSION\"" ] && [ "$tag_version" = "\"$PACKAGE_VERSION\"" ]; then
              echo "$package_version"
              npm view bb-app version dist-tags --json
              exit 0
            fi

            echo "Registry has not exposed bb-app@$PACKAGE_VERSION on tag $NPM_TAG yet; retrying ($attempt/240)."
            cat /tmp/bb-app-version.err || true
            cat /tmp/bb-app-tag.err || true
            sleep 10
          done

          echo "::error::Timed out waiting for bb-app@$PACKAGE_VERSION to appear on npm tag $NPM_TAG."
          exit 1

  verify-publish-nightly:
    name: Verify bb-app nightly on npm
    needs: publish-nightly
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Verify npm release
        env:
          PACKAGE_VERSION: ${{ needs.publish-nightly.outputs.version }}
        run: |
          for attempt in $(seq 1 240); do
            package_version="$(npm view "bb-app@$PACKAGE_VERSION" version --json 2>/tmp/bb-app-version.err || true)"
            tag_version="$(npm view "bb-app@nightly" version --json 2>/tmp/bb-app-tag.err || true)"

            if [ "$package_version" = "\"$PACKAGE_VERSION\"" ] && [ "$tag_version" = "\"$PACKAGE_VERSION\"" ]; then
              echo "$package_version"
              npm view bb-app version dist-tags --json
              exit 0
            fi

            echo "Registry has not exposed bb-app@$PACKAGE_VERSION on tag nightly yet; retrying ($attempt/240)."
            cat /tmp/bb-app-version.err || true
            cat /tmp/bb-app-tag.err || true
            sleep 10
          done

          echo "::error::Timed out waiting for bb-app@$PACKAGE_VERSION to appear on npm tag nightly."
          exit 1

  # Rides the same release train as bb-app but stays independent of it: the SDK
  # version is settled in the repo (packages/domain/src/plugin-sdk-version.ts,
  # mirrored in packages/plugin-sdk/package.json), never computed here. Every
  # run publishes only when that exact version is missing from npm, so a run
  # where it already exists skips and succeeds. Nothing needs this job and it
  # needs nothing, so a failure here cannot hold back the app or desktop
  # release.
  #
  # BOOTSTRAP: until @get-bb/plugin-sdk has been published once by hand and its
  # npm trusted publisher is configured (this repo, this workflow file, the
  # npm-release environment), the publish step below will fail with a 404/auth
  # error. That is expected and does not affect the bb-app jobs. See
  # docs/bb-release-process.md#publishing-the-plugin-sdk.
  publish-plugin-sdk:
    name: Publish @get-bb/plugin-sdk
    # Same fork guard as the publish job: this job also runs on the schedule
    # trigger, while the nightly desktop, iOS and release-publish jobs stay
    # behind `needs` chains rooted at it.
    if: ${{ github.event_name != 'schedule' || github.repository == 'get-bb/bb' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    # Its own group, separate from the workflow-level one: that group splits
    # nightly from ref, so the cron and a manual dispatch on main land in
    # different groups and can run at the same time. Both would then reach
    # `npm publish` for the same immutable version, and the loser fails red.
    # Serializing this job lets the second run observe the first one's publish
    # and skip. Job-level concurrency does not affect the bb-app jobs.
    concurrency:
      group: publish-plugin-sdk
      cancel-in-progress: false

    steps:
      - name: Require main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Publish @get-bb/plugin-sdk must run from the main branch, got ${GITHUB_REF}."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          node - "$npm_version" <<'NODE' || npm install --global npm@latest
          const version = process.argv[2];
          const [major, minor, patch] = version.split(".").map(Number);
          const supported =
            major > 11 ||
            (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
          process.exit(supported ? 0 : 1);
          NODE
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the SDK
        run: pnpm exec turbo run build --filter=@get-bb/plugin-sdk --output-logs=new-only

      - name: Resolve the settled SDK version
        id: sdk_version
        run: |
          set -euo pipefail

          # The version is whatever the repo already says it is. Never bump or
          # derive one at publish time.
          sdk_version="$(node -p "require('./packages/plugin-sdk/package.json').version")"
          echo "SDK_VERSION=${sdk_version}" >> "$GITHUB_ENV"
          echo "version=${sdk_version}" >> "$GITHUB_OUTPUT"
          echo "Local @get-bb/plugin-sdk version is ${sdk_version}."

      - name: Check whether this version is already on npm
        id: published
        run: |
          set -euo pipefail

          # `npm view` exits non-zero both for "no such version" and for real
          # registry errors, so distinguish them from the captured output
          # rather than from the exit code alone.
          if view_output="$(npm view "@get-bb/plugin-sdk@${SDK_VERSION}" version 2>&1)"; then
            if [[ -n "$view_output" ]]; then
              echo "@get-bb/plugin-sdk@${SDK_VERSION} already published, skipping."
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif ! grep -qiE "E404|no match(ing)? version|is not in this registry" <<<"$view_output"; then
            echo "::error::Could not query npm for @get-bb/plugin-sdk@${SDK_VERSION}: ${view_output}"
            exit 1
          fi

          echo "@get-bb/plugin-sdk@${SDK_VERSION} is not on npm; it will be published."
          echo "already_published=false" >> "$GITHUB_OUTPUT"

      - name: Preview npm package
        if: ${{ steps.published.outputs.already_published == 'false' }}
        working-directory: packages/plugin-sdk
        run: npm pack --dry-run

      - name: npm publish dry run
        if: ${{ steps.published.outputs.already_published == 'false' && env.RELEASE_DRY_RUN == 'true' }}
        working-directory: packages/plugin-sdk
        run: npm publish --dry-run

      - name: Publish to npm
        if: ${{ steps.published.outputs.already_published == 'false' && env.RELEASE_DRY_RUN != 'true' }}
        working-directory: packages/plugin-sdk
        # prepack rebuilds bundled-types and dist; publishConfig.access is
        # already public in the manifest, so no --access flag is needed.
        run: npm publish

      - name: Summarize the SDK release
        env:
          ALREADY_PUBLISHED: ${{ steps.published.outputs.already_published }}
        run: |
          {
            echo "## @get-bb/plugin-sdk"
            echo
            echo "- version: \`$SDK_VERSION\`"
            echo "- already published: \`$ALREADY_PUBLISHED\`"
            echo "- dry run: \`$RELEASE_DRY_RUN\`"
            echo "- commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  stable-desktop:
    name: bb desktop
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_tag == 'latest' && inputs.dry_run == false }}
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/build-desktop.yml
    with:
      release_channel: stable
      publish: true
      version: ${{ needs.publish.outputs.version }}
    secrets: inherit

  nightly-desktop:
    name: bb Nightly desktop
    # `!cancelled()` is required because publish-nightly is skipped on the
    # scheduled and manual nightly paths, and a skipped need would otherwise
    # skip this job too.
    if: >-
      ${{ !cancelled()
      && needs.publish.result == 'success'
      && (github.event_name == 'schedule'
      || (inputs.npm_tag == 'nightly' && inputs.dry_run == false)
      || needs.publish-nightly.result == 'success') }}
    needs:
      - publish
      - publish-nightly
    permissions:
      contents: write
    uses: ./.github/workflows/build-desktop.yml
    with:
      release_channel: nightly
      publish: true
      # publish-nightly holds the version on a release run; publish holds it
      # on the scheduled and manual nightly paths, where publish-nightly is
      # skipped and reports an empty version. Every platform builds this one
      # version, so re-running only a failed platform cannot split a release.
      version: ${{ needs.publish-nightly.outputs.version || needs.publish.outputs.version }}
    secrets: inherit

  nightly-mobile-android:
    name: Build and publish bb Nightly Android APK (EAS)
    if: >-
      ${{ !cancelled()
      && needs.publish.result == 'success'
      && (github.event_name == 'schedule'
      || (inputs.npm_tag == 'nightly' && inputs.dry_run == false)
      || needs.publish-nightly.result == 'success') }}
    needs:
      - publish
      - publish-nightly
    permissions:
      contents: write
    uses: ./.github/workflows/mobile-android-eas.yml
    with:
      profile: preview
      publish: true
      submit: false
      version: ${{ needs.publish-nightly.outputs.version || needs.publish.outputs.version }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  nightly-mobile-ios:
    name: Build bb Nightly iOS (EAS)
    # Same gate as the desktop jobs: only after the npm publish succeeded on
    # the scheduled or manual nightly path. The reusable workflow starts an
    # EAS production build that auto-submits to TestFlight.
    if: >-
      ${{ !cancelled()
      && needs.publish.result == 'success'
      && (github.event_name == 'schedule'
      || (inputs.npm_tag == 'nightly' && inputs.dry_run == false)
      || needs.publish-nightly.result == 'success') }}
    needs:
      - publish
      - publish-nightly
    uses: ./.github/workflows/mobile-ios-eas.yml
    with:
      profile: production
      submit: true
      # An empty version keeps the marketing version committed in
      # apps/mobile/app.json. TestFlight needs a Beta App Review for the
      # first build of each new marketing version, so a nightly that tracked
      # the bb-app version (0.39.0, 0.39.1, ...) blocked external testers
      # every time the base version moved. With a pinned version, the remote
      # EAS build number tells nightly builds apart and later builds skip
      # the review.
      version: ""
      external_group: External testers
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
