name: Version Lockstep

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check bb-app and desktop versions
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Check version lockstep
        run: node .github/workflows/check-version-lockstep.mjs

  plugin-sdk:
    name: Check plugin SDK version bump
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          filter: blob:none

      - name: Resolve pull request comparison base
        if: github.event_name == 'pull_request'
        run: git update-ref "refs/remotes/origin/$GITHUB_BASE_REF" "$(git rev-parse HEAD^1)"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Check plugin SDK version bump
        run: node .github/workflows/check-plugin-sdk-version.mjs
