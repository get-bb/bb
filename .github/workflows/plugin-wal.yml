name: Compare plugin test database modes
on:
  push:
    branches: [bb/probe-windows-plugin-wal]
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        lane: [storage]
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
        timeout-minutes: 1
        continue-on-error: true
      - name: Install dependencies
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Compare DELETE and WAL
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          PROBE_LANE: ${{ matrix.lane }}
        run: node .github/scripts/plugin-wal.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: plugin-wal-${{ matrix.lane }}
          path: ${{ runner.temp }}/plugin-wal/
