name: CI
on:
  workflow_dispatch:
env:
  PRIMARY_NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"
jobs:
  windows-app-smoke:
    name: Windows app smoke (Node 22.x)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts

      - name: Restore Windows dependency disk
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/windows-dependency-cache

      - name: Profile archive readers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'bb-dependencies.vhdx'
          if (!(Test-Path $source)) { throw 'Required warm dependency image is absent' }
          & ./.github/actions/windows-dependency-cache/disk.ps1 -Operation detach
          $gnu = 'C:\Program Files\Git\usr\bin\tar.exe'
          $native = 'C:\Windows\System32\tar.exe'
          & $gnu --version
          & $native --version
          $archive = Join-Path $env:RUNNER_TEMP 'probe.tzst'
          Push-Location $env:RUNNER_TEMP
          & $gnu -cf $archive --force-local --use-compress-program 'zstd -T0' bb-dependencies.vhdx
          if ($LASTEXITCODE -ne 0) { throw 'archive failed' }
          $hash = (Get-FileHash $source).Hash
          foreach ($sample in @('gnu-a', 'native-b', 'native-c', 'gnu-d')) {
            $target = Join-Path $env:RUNNER_TEMP $sample
            New-Item -ItemType Directory -Path $target | Out-Null
            $clock = [Diagnostics.Stopwatch]::StartNew()
            if ($sample.StartsWith('gnu')) {
              & $gnu -xf $archive --force-local --use-compress-program zstd -C ($target.Replace('\', '/'))
            } else {
              & $native -xf $archive -C $target
            }
            if ($LASTEXITCODE -ne 0) { throw "extract failed $sample" }
            $seconds = $clock.Elapsed.TotalSeconds
            if ((Get-FileHash (Join-Path $target 'bb-dependencies.vhdx')).Hash -ne $hash) { throw 'Image bytes differ' }
            Write-Output "$sample $seconds" | Tee-Object -FilePath (Join-Path $env:GITHUB_WORKSPACE 'disk-reader-timings.txt') -Append
            Remove-Item -Recurse -Force $target
          }
          Pop-Location
      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disk-reader-timings
          path: disk-reader-timings.txt
