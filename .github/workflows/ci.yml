name: CI

on:
  push:
    branches:
      - main
      - finite-state/integration
  pull_request:
  workflow_dispatch:

env:
  PRIMARY_NODE_VERSION: "22.19.0"
  PNPM_VERSION: "9.15.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify CI change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_heavy: ${{ steps.scope.outputs.run_heavy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List changed files
        id: changed
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          # Pull requests ignore this input and use their PR base. Pushes use
          # the preceding commit on the branch that received the push.
          base: ${{ github.ref }}
          list-files: json
          filters: |
            all:
              - '**'

      - name: Classify CI scope
        id: scope
        env:
          CI_CHANGED_FILES_JSON: ${{ steps.changed.outputs.all_files || '[]' }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/classify-finite-state-ci.mjs

  checks:
    name: Checks (ubuntu-latest, Node 22.19.0)
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: checks

      - name: Build, typecheck, and lint
        run: pnpm exec turbo run build typecheck lint --cache-dir=.turbo/cache --output-logs=new-only

      # Guards the JavaScript that blocks first paint in the web app. Heavy
      # editor, diff and math code reaches that path through barrel re-exports,
      # which typecheck and lint cannot see.
      - name: Check app boot-payload budget
        run: node apps/app/scripts/check-bundle-budget.mjs

  finite-state-guards:
    # FS-91 will require this stable check name. Always run the real plugin
    # lifecycle so transitive infrastructure changes cannot produce a no-op.
    name: Finite State guard gates (ubuntu-latest, Node 22.19.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: "22.19.0"
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: finite-state-guards

      - name: Check formatting of changed Finite State files
        if: github.event_name == 'pull_request'
        env:
          FINITE_STATE_PR_BASE_REF: origin/${{ github.base_ref }}
        run: node plugins/bb-plugin-finite-state/scripts/check-changed-formatting.mjs "$FINITE_STATE_PR_BASE_REF"

      - name: Check Finite State frozen and dependency baselines
        run: |
          frozen_output="$(node plugins/bb-plugin-finite-state/scripts/check-frozen-artifacts.mjs)"
          printf '%s\n' "$frozen_output"
          test "$frozen_output" = "Frozen artifact baseline is intact."
          node plugins/bb-plugin-finite-state/scripts/check-dependency-freeze.mjs

      - name: Validate Finite State scheduling policy
        run: |
          node plugins/bb-plugin-finite-state/docs/Implementation/scheduling/validate-wp-coupling.mjs
          node --test plugins/bb-plugin-finite-state/docs/Implementation/scheduling/validate-wp-coupling.test.mjs
          node --test plugins/bb-plugin-finite-state/docs/Implementation/scheduling/ready-queue-watchdog.test.mjs

      - name: Run Finite State plugin gate
        run: pnpm exec turbo run typecheck test lint build --filter=bb-plugin-finite-state --cache-dir=.turbo/cache --output-logs=new-only

  # Tests run on their own runners instead of inside the checks job: the big
  # suites are CPU-bound and previously fought each other (and the builds) for
  # the same 4 vCPUs, which made tests the critical path of every run.
  tests:
    name: Tests (${{ matrix.shard }}, ubuntu-latest, Node 22.19.0)
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: server
            filter: --filter=@bb/server
          - shard: app
            filter: --filter=@bb/app
          - shard: integration
            filter: --filter=@bb/integration-tests
          - shard: packages
            filter: --filter='!@bb/server' --filter='!@bb/app' --filter='!@bb/integration-tests' --filter='!bb-plugin-finite-state'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: test-${{ matrix.shard }}

      - name: Test
        run: pnpm exec turbo run test ${{ matrix.filter }} --cache-dir=.turbo/cache --output-logs=new-only

  package-smoke:
    name: Package Smoke (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "22.19.0"
          - os: macos-latest
            node-version: "22.19.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node-version }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: package-smoke

      - name: Smoke bb-app tarball
        run: pnpm exec turbo run smoke:tarball --filter=bb-app --cache-dir=.turbo/cache --output-logs=new-only

  node-compat-smoke:
    name: Node Compatibility Smoke (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: changes
    if: ${{ needs.changes.outputs.run_heavy == 'true' && github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "24.x"
          - os: ubuntu-latest
            node-version: "26.x"
          - os: macos-latest
            node-version: "24.x"
          - os: macos-latest
            node-version: "26.x"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: compat-smoke

      - name: Build bb-app with the repository runtime
        run: pnpm exec turbo run build --filter=bb-app --cache-dir=.turbo/cache --output-logs=new-only

      - name: Set up compatibility runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Smoke bb-app tarball with the compatibility runtime
        run: node packages/bb-app/scripts/smoke-tarball.mjs
