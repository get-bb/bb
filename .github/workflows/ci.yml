name: CI
on:
  workflow_dispatch:
jobs:
  fuse-probe:
    strategy:
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-ubuntu-2204]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - name: Inspect existing FUSE and package metadata
        run: |
          lsb_release -cs
          dpkg-query -W libfuse2 libfuse2t64 fuse3 || true
          ls -l /dev/fuse
          ldconfig -p | grep libfuse || true
          du -sh /var/lib/apt/lists
          apt-cache policy libfuse2 libfuse2t64
          apt-get --print-uris --yes --no-install-recommends install libfuse2t64 || apt-get --print-uris --yes --no-install-recommends install libfuse2
