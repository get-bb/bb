name: CI
on:
  workflow_dispatch:
env:
  PRIMARY_NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"
jobs:
  windows-app-smoke:
    name: Windows app smoke (Node 22.x)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts

      - name: Restore Windows dependency disk
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/windows-dependency-cache

      - name: Restore React Compiler cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-react-compiler

      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: windows-app-smoke
          turbo-cache: "true"
          turbo-cache-max-size-mb: "256"

      - name: Restore pnpm cache
        if: runner.os == 'macOS'
        id: pnpm-cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-pnpm

      - name: Install dependencies
        timeout-minutes: 5
        shell: bash
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          PNPM_CACHE_RESTORE_OUTCOME: ${{ steps.pnpm-cache.outcome }}
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'

      - name: Restore npm package downloads
        id: npm-downloads
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-npm-downloads

      - name: Compare serial and concurrent smoke tasks
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec turbo run build --filter=bb-app --output-logs=new-only
          for sample in baseline-a candidate-b candidate-c baseline-d; do
            started=$SECONDS
            if [[ "$sample" == baseline* ]]; then
              pnpm exec turbo run smoke:boot --filter=bb-app --output-logs=full > "$sample-boot.log" 2>&1
              pnpm exec turbo run smoke:tarball --filter=bb-app --output-logs=full > "$sample-tarball.log" 2>&1
            else
              pnpm exec turbo run smoke:boot smoke:tarball --filter=bb-app --output-logs=full --continue=dependencies-successful > "$sample.log" 2>&1
            fi
            echo "$sample $((SECONDS-started))" | tee -a timings.txt
          done
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-abba
          path: |
            *.log
            timings.txt
