name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-image-probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: baseline
            budget: 1
          - mode: candidate
            budget: 2
          - mode: hang
            budget: 2
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Restore and mount with controlled late mount
        id: dependencies
        continue-on-error: true
        timeout-minutes: ${{ matrix.budget }}
        env:
          PROBE_MODE: ${{ matrix.mode }}
        uses: ./.github/actions/ci-dependency-probe
      - name: Verify restore outcome and fallback selection
        shell: pwsh
        env:
          PROBE_MODE: ${{ matrix.mode }}
          PROBE_ACTIVE: ${{ steps.dependencies.outputs.active }}
          PROBE_OUTCOME: ${{ steps.dependencies.outcome }}
        run: |
          Write-Host "Mode=$env:PROBE_MODE outcome=$env:PROBE_OUTCOME active=$env:PROBE_ACTIVE"
          $elapsed = ([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() - [long]$env:PROBE_STARTED) / 1000
          Write-Host "Elapsed=$elapsed"
          if ($env:PROBE_MODE -eq 'candidate') {
            if ($env:PROBE_ACTIVE -ne 'true' -or $env:PROBE_OUTCOME -ne 'success') { throw 'Candidate did not mount' }
            if (!(Test-Path 'P:\store') -or !(Test-Path 'P:\virtual-store')) { throw 'Missing stores' }
          } else {
            if ($env:PROBE_OUTCOME -ne 'failure') { throw 'Expected bounded cancellation' }
            if ($env:PROBE_ACTIVE -eq 'true' -or $env:npm_config_store_dir) { throw 'Unexpected disk selection' }
            if ($elapsed -gt (${{ matrix.budget }} * 60 + 30)) { throw 'Fallback exceeded bounded cancellation allowance' }
          }
      - name: Install real workspace dependencies
        timeout-minutes: 5
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
