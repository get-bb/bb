name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-profile:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
        id: dependencies
      - name: Profile and compact detached disk
        if: steps.dependencies.outputs.active == 'true'
        shell: pwsh
        run: |
          $disk = Join-Path $env:RUNNER_TEMP 'bb-dependencies.vhdx'
          Get-Item $disk | Select-Object Length,Name
          Get-Volume -DriveLetter P | Select-Object Size,SizeRemaining
          ./.github/actions/windows-dependency-cache/disk.ps1 detach
          Copy-Item $disk (Join-Path $env:RUNNER_TEMP 'baseline.vhdx')
          $commands = Join-Path $env:RUNNER_TEMP 'compact.txt'
          @("select vdisk file=`"$disk`"", 'attach vdisk readonly', 'compact vdisk', 'detach vdisk') | Set-Content $commands
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          diskpart /s $commands
          if ($LASTEXITCODE -ne 0) { throw 'Compaction failed' }
          Write-Host "COMPACT_SECONDS $($timer.Elapsed.TotalSeconds)"
          Get-Item $disk | Select-Object Length,Name
          Copy-Item $disk (Join-Path $env:RUNNER_TEMP 'compact.vhdx')
      - name: Compare archive extraction
        if: steps.dependencies.outputs.active == 'true'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          for variant in baseline compact; do
            echo "COMPRESS $variant"
            time tar -cf "$variant.tar.zst" --use-compress-program 'zstd -T0' "$variant.vhdx"
            ls -l "$variant.vhdx" "$variant.tar.zst"
          done
          echo "COMPRESS sparse baseline"
          time tar --sparse --hole-detection=raw -cf sparse.tar.zst --use-compress-program 'zstd -T0' baseline.vhdx
          ls -l sparse.tar.zst
          mkdir image-extract
          for variant in baseline compact sparse sparse compact baseline; do
            echo "EXTRACT $variant"
            time tar -xf "$variant.tar.zst" -C image-extract --use-compress-program 'zstd -d --long=31'
            sha256sum image-extract/*.vhdx
            rm image-extract/*.vhdx
          done
      - name: Remount and validate frozen installation
        if: steps.dependencies.outputs.active == 'true'
        shell: pwsh
        run: ./.github/actions/windows-dependency-cache/disk.ps1 mount
      - name: Verify dependency installation
        if: steps.dependencies.outputs.active == 'true'
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
