name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    name: Full Windows app shard ${{ matrix.shard }} ABBA
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
      - name: Fetch compared source
        shell: bash
        run: |
          git fetch --no-tags origin 7e83fb7ef07838783af6958365997aa52fb51b82 e880beb00c4ce8f504edc4a5d63a3a7b58bcbb0e
          git show 7e83fb7ef07838783af6958365997aa52fb51b82:.github/workflows/ci.yml > .github/workflows/ci.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Setup pnpm
        run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Restore Windows dependency disk
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/windows-dependency-cache
      - name: Install dependencies
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter bb --filter '@bb/app...' --filter '@bb/db...'
      - name: Compare complete app shards
        env:
          VITEST_MAX_WORKERS: '8'
          BB_CI_TEST_SHARD: ${{ matrix.shard }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node .github/diagnostics/app-split.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: app-${{ strategy.job-index }}
          path: app-benchmark/
