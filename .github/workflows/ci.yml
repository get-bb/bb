name: Windows native scheduling diagnosis
on:
  workflow_dispatch:
jobs:
  native-profile:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ['2/3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.x'
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
        continue-on-error: true
      - name: Install dependencies
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter bb --filter '@bb/server...' --filter '@bb/host-daemon...' --filter '@bb/app...' --filter 'bb-plugin-*...'
      - name: Profile full shard with controlled native scheduling
        shell: pwsh
        env:
          BB_CI_TEST_SHARD: ${{ matrix.shard }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          Copy-Item apps/server/vitest.config.ts "$env:RUNNER_TEMP/native-config.ts"
          $env:VITEST_MAX_WORKERS = "3"
          $failed = $false
          @("baseline", "serial", "serial", "baseline") | ForEach-Object {
            if ($_ -eq "baseline") {
              git show 769d4442dd:apps/server/vitest.config.ts | Set-Content apps/server/vitest.config.ts
            } else {
              Copy-Item "$env:RUNNER_TEMP/native-config.ts" apps/server/vitest.config.ts
            }
            Write-Host "PROFILE scheduling=$_ shard=$env:BB_CI_TEST_SHARD"
            pnpm exec turbo run test --filter=@bb/server --force --concurrency=4 --summarize
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
