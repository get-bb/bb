name: CI
on:
  workflow_dispatch:
env:
  PRIMARY_NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"
jobs:
  windows-app-smoke:
    name: Windows app smoke (Node 22.x)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts

      - name: Restore Windows dependency disk
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/windows-dependency-cache

      - name: Restore React Compiler cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-react-compiler

      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: windows-app-smoke
          turbo-cache: "true"
          turbo-cache-max-size-mb: "256"

      - name: Restore pnpm cache
        if: runner.os == 'macOS'
        id: pnpm-cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-pnpm

      - name: Install dependencies
        timeout-minutes: 5
        shell: bash
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          PNPM_CACHE_RESTORE_OUTCOME: ${{ steps.pnpm-cache.outcome }}
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'

      - name: Build bb-app and boot it
        shell: bash
        run: pnpm exec turbo run smoke:boot --filter=bb-app --cache-dir="${TURBO_CACHE_DIR:-.turbo/cache}" --output-logs=new-only

      - name: Compare Windows TypeScript pre-emission
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-evidence"
          cp packages/bb-app/scripts/build-public-sdk-dts.mjs packages/bb-app/scripts/build-public-sdk-dts-source-probe.mjs
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'packages/bb-app/scripts/build-public-sdk-dts.mjs';
          let text = readFileSync(file, 'utf8');
          text = text.replace('new URL("./bin/tsrs", import.meta.resolve("tsrs/package.json"))', 'new URL("./bin/tsc6", import.meta.resolve("typescript/package.json"))');
          text = text.replace('const supportsNativeCompiler =', 'const supportsNativeCompiler = process.platform === "win32" ||');
          writeFileSync(file, text);
          NODE
          trial=0
          for variant in source tsc tsc source source tsc tsc source; do
            trial=$((trial + 1))
            echo "SDK comparison $trial $variant"
            if [ "$variant" = source ]; then
              time node packages/bb-app/scripts/build-public-sdk-dts-source-probe.mjs
            else
              time node packages/bb-app/scripts/build-public-sdk-dts.mjs
            fi
            cp packages/bb-app/dist/index.d.ts "$RUNNER_TEMP/sdk-evidence/$trial-$variant.d.ts"
          done
          rm packages/bb-app/scripts/build-public-sdk-dts-source-probe.mjs
      - name: Build and validate installed TS6 tarball
        shell: bash
        run: |
          git show b3ccd831b7b76041f0286daf5b29425c7ea0a6d3:packages/bb-app/scripts/build.mjs > packages/bb-app/scripts/build.mjs
          pnpm exec turbo run smoke:tarball --filter=bb-app --cache-dir="${TURBO_CACHE_DIR:-.turbo/cache}" --output-logs=new-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-compiler-profile
          path: ${{ runner.temp }}/sdk-evidence
