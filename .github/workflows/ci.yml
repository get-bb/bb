name: CI
on:
  workflow_dispatch:
jobs:
  mac-smoke:
    strategy:
      fail-fast: false
      matrix:
        order: ['baseline,candidate,candidate,baseline', 'candidate,baseline,baseline,candidate']
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: '22.x'
          pnpm-version: '9.15.0'
          cache-prefix: package-smoke
      - run: pnpm exec turbo run build --filter=bb-app --output-logs=new-only
      - run: node scripts/ci-mac-smoke-probe.mjs
        env:
          PROBE_ORDER: ${{ matrix.order }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: smoke-${{ matrix.order }}
          path: ${{ runner.temp }}/mac-smoke-results
