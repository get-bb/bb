name: CI
on:
  workflow_dispatch:
jobs:
  ssh-fetch:
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter bb --filter 'bb-environment-provider-host...' --filter '@bb/db...'
      - name: Baseline prerequisites and package
        run: pnpm exec turbo run test --filter=bb-environment-provider-host --force
      - name: Repeat real fetch with failure diagnostics
        if: always()
        shell: pwsh
        run: |
          for ($i=0; $i -lt 15; $i++) {
            pnpm --filter bb-environment-provider-host exec vitest run --config vitest.config.ts test/workspace-git-fetch.test.ts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
