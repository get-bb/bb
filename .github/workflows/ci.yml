name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-plugin-benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - replica: 1
            order: A B B A
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
        timeout-minutes: 2
        continue-on-error: true
      - shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter bb --filter '@bb/server...' --filter '@bb/host-daemon...' --filter '@bb/app...' --filter 'bb-plugin-*...'
      - name: Warm owner prerequisites
        shell: cmd
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: pnpm exec turbo run test --filter=@bb/server --concurrency=2 -- test/services/plugins/plugin-native-server-loading.test.ts
      - name: Compare full affected Windows server shard
        shell: cmd
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node native-probe.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-plugin-perf-${{ matrix.replica }}
          path: perf
