name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  git-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
        timeout-minutes: 2
        continue-on-error: true
      - shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - shell: bash
        run: pnpm exec turbo run build --filter=@get-bb/plugin-sdk --concurrency=2
      - name: Repeat full plugin shard with failure metadata
        shell: bash
        run: |
          mkdir -p git-probe
          failures=0
          for repetition in 1 2 3 4 5; do
            pnpm exec turbo run test --filter='bb-plugin-*' --filter='!bb-plugin-provider-*' --filter='!bb-plugin-tasks' --filter='!bb-plugin-connect' --filter='!bb-plugin-thread-list' --cache-dir=".turbo/probe-$repetition" --continue --output-logs=new-only --concurrency=2 > "git-probe/$repetition.log" 2>&1 || failures=$((failures + 1))
          done
          echo "Failed repetitions: $failures"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: git-probe-${{ matrix.replica }}
          path: git-probe
