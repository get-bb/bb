name: CI
on:
  workflow_dispatch:
env:
  PRIMARY_NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"
jobs:
  windows-app-smoke:
    name: Windows app smoke (Node 22.x)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts

      - name: Restore Windows dependency disk
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/windows-dependency-cache

      - name: Install dependencies
        timeout-minutes: 5
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'

      - name: Measure transparent NTFS compression
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path 'P:\store')) { throw 'Expected dependency cache hit' }
          $disk = Join-Path $env:RUNNER_TEMP 'bb-dependencies.vhdx'
          $archive = Join-Path $env:RUNNER_TEMP 'baseline.tar.zst'
          $tar = 'C:\Program Files\Git\usr\bin\tar.exe'
          & .github/actions/windows-dependency-cache/disk.ps1 -Operation detach
          $before = (Get-Item $disk).Length
          & $tar --force-local --use-compress-program zstd -cf $archive -C $env:RUNNER_TEMP bb-dependencies.vhdx
          if ($LASTEXITCODE -ne 0) { throw 'Archive failed' }
          & .github/actions/windows-dependency-cache/disk.ps1 -Operation mount
          $watch = [Diagnostics.Stopwatch]::StartNew()
          & compact.exe /C /S:P:\store /I /Q
          Write-Host "NTFS compression seconds: $($watch.Elapsed.TotalSeconds)"
          & .github/actions/windows-dependency-cache/disk.ps1 -Operation detach
          @("select vdisk file=`"$disk`"", 'attach vdisk readonly', 'compact vdisk', 'detach vdisk') | Set-Content (Join-Path $env:RUNNER_TEMP 'compact.txt')
          diskpart /s (Join-Path $env:RUNNER_TEMP 'compact.txt')
          $after = (Get-Item $disk).Length
          $candidate = Join-Path $env:RUNNER_TEMP 'compressed.tar.zst'
          & $tar --force-local --use-compress-program zstd -cf $candidate -C $env:RUNNER_TEMP bb-dependencies.vhdx
          if ($LASTEXITCODE -ne 0) { throw 'Archive failed' }
          Write-Host "IMAGE_BYTES before=$before after=$after baseline_archive=$((Get-Item $archive).Length) compressed_archive=$((Get-Item $candidate).Length)"
          foreach ($name in @('baseline', 'compressed', 'compressed', 'baseline')) {
            $inputArchive = Join-Path $env:RUNNER_TEMP "$name.tar.zst"
            Remove-Item $disk
            $watch = [Diagnostics.Stopwatch]::StartNew()
            & $tar --force-local --use-compress-program zstd -xf $inputArchive -C $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw 'Extract failed' }
            Write-Host "EXTRACTION $name $($watch.Elapsed.TotalSeconds)"
          }
          Remove-Item $disk
          & $tar --force-local --use-compress-program zstd -xf $candidate -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Extract failed' }
          & .github/actions/windows-dependency-cache/disk.ps1 -Operation mount
      - name: Verify compressed dependency install
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Build and smoke app from compressed dependency image
        shell: bash
        run: pnpm exec turbo run smoke:boot smoke:tarball --filter=bb-app --output-logs=new-only
