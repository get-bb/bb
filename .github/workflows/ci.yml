name: CI
on:
  workflow_dispatch:
jobs:
  windows-lock:
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter bb --filter '@bb/config...' --filter '@bb/db...'
      - env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        name: Reproduce unreachable lock owner during garbage collection
        run: node --import tsx .file-lock-probe.mjs
      - env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        name: Verify retained owner withstands garbage collection
        run: node --import tsx .file-lock-probe.mjs --retained
      - env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        name: Full config tests, typecheck and lint
        run: pnpm exec turbo run test typecheck lint --filter=@bb/config --force
