name: CI
on:
  push:
    branches: [ci/nov9-server-fixture-speed]
  workflow_dispatch:
env:
  PRIMARY_NODE_VERSION: 22.x
  PNPM_VERSION: 9.15.0
jobs:
  windows-tests:
    name: Windows tests (${{ matrix.shard }}, Node 22.x)
    runs-on: ${{ (startsWith(matrix.shard, 'app-') || matrix.shard == 'plugins-2' || matrix.shard == 'packages-other') && 'blacksmith-8vcpu-windows-2025' || 'blacksmith-4vcpu-windows-2025' }}
    timeout-minutes: 30
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: server-1
            filter: --filter=@bb/server
            vitestShard: ""
            concurrency: 2
            mobile: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts

      - name: Restore Windows dependency disk
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/windows-dependency-cache

      - name: Restore React Compiler cache
        if: ${{ contains(matrix.filter, '--filter=@bb/demo-server') }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-react-compiler

      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: windows-test-${{ matrix.shard }}
          turbo-cache: "true"
          turbo-cache-max-size-mb: "256"

      - name: Restore pnpm cache
        if: runner.os == 'macOS'
        id: pnpm-cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-pnpm

      - name: Install dependencies
        timeout-minutes: 5
        shell: bash
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          PNPM_CACHE_RESTORE_OUTCOME: ${{ steps.pnpm-cache.outcome }}
          APP_SHARD: ${{ startsWith(matrix.shard, 'app-') }}
          SERVER_SHARD: ${{ startsWith(matrix.shard, 'server-') }}
          PLUGIN_SHARD: ${{ matrix.shard == 'plugins-2' }}
          OTHER_PACKAGES_SHARD: ${{ matrix.shard == 'packages-other' }}
          TEST_FILTERS: ${{ matrix.filter }}
          MOBILE_TESTS: ${{ matrix.mobile }}
        run: |
          filters=()
          if [[ "$APP_SHARD" == "true" ]]; then
            filters=(--filter bb --filter '@bb/app...' --filter '@bb/db...')
          elif [[ "$SERVER_SHARD" == "true" ]]; then
            filters=(--filter bb --filter '@bb/server...' --filter '@bb/host-daemon...' --filter '@bb/app...' --filter 'bb-plugin-*...')
          elif [[ "$PLUGIN_SHARD" == "true" || "$OTHER_PACKAGES_SHARD" == "true" ]]; then
            read -r -a selected_filters <<< "$TEST_FILTERS"
            selection=$(pnpm list "${selected_filters[@]}" --depth -1 --json)
            packages=$(node -e '
              const fs = require("node:fs");
              for (const pkg of JSON.parse(process.argv[1])) {
                if (process.env.OTHER_PACKAGES_SHARD === "true" && !JSON.parse(fs.readFileSync(`${pkg.path}/package.json`, "utf8")).scripts?.test) continue;
                console.log(pkg.name);
              }
            ' "$selection")
            filters=(--filter bb --filter '@bb/app...' --filter '@bb/db...')
            if [[ "$OTHER_PACKAGES_SHARD" == "true" ]]; then
              filters+=(--filter '@bb/server...' --filter '@bb/cli...' --filter 'bb-plugin-provider-*...')
            fi
            while IFS= read -r package; do
              [[ -z "$package" ]] && continue
              filters+=(--filter "$package...")
            done <<< "$packages"
          elif [[ "$MOBILE_TESTS" != "true" ]]; then
            filters=(--filter '!@bb/mobile')
          fi
          bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts "${filters[@]}"

      - name: Setup Bun
        if: ${{ matrix.shard == 'plugins-1' }}
        timeout-minutes: 4
        uses: ./.github/actions/setup-bun
        with:
          version: "1.3.14"

      - name: Prepare plugin SDK runtime
        if: ${{ matrix.shard == 'plugins-2' && contains(matrix.filter, '--filter=bb-plugin-*') }}
        shell: cmd
        run: |
          if not defined TURBO_CACHE_DIR set TURBO_CACHE_DIR=.turbo/cache
          pnpm exec turbo run build --filter=@get-bb/plugin-sdk --cache-dir="%TURBO_CACHE_DIR%" --output-logs=new-only --summarize --concurrency=2

      - name: Compare guard overhead
        shell: bash
        run: |
          cp packages/db/src/query-plan-test-guard.ts "$RUNNER_TEMP/guard-original.ts"
          for variant in baseline candidate candidate baseline; do
            cp "$RUNNER_TEMP/guard-original.ts" packages/db/src/query-plan-test-guard.ts
            if [ "$variant" = candidate ]; then
              node --input-type=module - <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const file='packages/db/src/query-plan-test-guard.ts';
          writeFileSync(file,readFileSync(file,'utf8').replace('  const BetterSqlite = Database as GuardedDatabaseConstructor;', '  if (process.platform === "win32") return {takeViolations: () => []};\n  const BetterSqlite = Database as GuardedDatabaseConstructor;'));
          NODE
            fi
            echo "GUARD COMPARISON $variant"
            pnpm exec turbo run test --filter=@bb/server --force -- test/services/threads/timeline-selection-memo.test.ts test/services/threads/timeline-in-turn-window.test.ts test/services/plugins/plugin-update.test.ts test/services/plugins/plugin-install.test.ts
          done
