name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin-update-benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - replica: 1
            order: A B B A
          - replica: 2
            order: B A A B
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
        timeout-minutes: 2
        continue-on-error: true
      - shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Warm owner prerequisites
        shell: cmd
        run: pnpm exec turbo run test --filter=@bb/server --concurrency=2 -- test/services/plugins/plugin-update.test.ts
      - name: Compare full affected Windows server shard
        shell: cmd
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          setlocal EnableDelayedExpansion
          mkdir perf
          git show 3b93a156695f38ea15874737977fc5e1b5f90afe:apps/server/test/services/plugins/plugin-update.test.ts > perf\baseline.ts
          copy /Y apps\server\test\services\plugins\plugin-update.test.ts perf\candidate.ts > nul
          set matches=0
          for /L %%S in (1,1,3) do (
            call pnpm --filter @bb/server exec vitest list --filesOnly --shard=%%S/3 > perf\files-%%S.log 2>&1
            findstr /c:"plugin-update.test.ts" perf\files-%%S.log > nul
            if not errorlevel 1 (
              set "UPDATE_SHARD=%%S/3"
              set /a matches+=1
            )
          )
          if not !matches!==1 exit /b 1
          echo Affected shard: !UPDATE_SHARD!
          set "BB_CI_TEST_SHARD=!UPDATE_SHARD!"
          set sample=0
          set failures=0
          for %%V in (${{ matrix.order }}) do (
            set /a sample+=1
            if %%V==A (copy /Y perf\baseline.ts apps\server\test\services\plugins\plugin-update.test.ts > nul) else (copy /Y perf\candidate.ts apps\server\test\services\plugins\plugin-update.test.ts > nul)
            call pnpm exec turbo run test --filter=@bb/server --only --force --concurrency=2 --output-logs=new-only --summarize > perf\sample-!sample!-%%V.log 2>&1
            if errorlevel 1 set /a failures+=1
          )
          copy /Y perf\candidate.ts apps\server\test\services\plugins\plugin-update.test.ts > nul
          echo Failed trials: !failures!
          exit /b !failures!
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: plugin-update-perf-${{ matrix.replica }}
          path: perf
