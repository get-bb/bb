name: CI
on:
  workflow_dispatch:
env:
  PRIMARY_NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"
jobs:
  windows-app-smoke:
    name: Windows app smoke (Node 22.x)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts

      - name: Restore Windows dependency disk
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/windows-dependency-cache

      - name: Restore React Compiler cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-react-compiler

      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: windows-app-smoke
          turbo-cache: "true"
          turbo-cache-max-size-mb: "256"

      - name: Restore pnpm cache
        if: runner.os == 'macOS'
        id: pnpm-cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-pnpm

      - name: Install dependencies
        timeout-minutes: 5
        shell: bash
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          PNPM_CACHE_RESTORE_OUTCOME: ${{ steps.pnpm-cache.outcome }}
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'

      - name: Build bb-app and boot it
        shell: bash
        run: pnpm exec turbo run smoke:boot --filter=bb-app --cache-dir="${TURBO_CACHE_DIR:-.turbo/cache}" --output-logs=new-only

      - name: Compare declaration workspace paths
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const p='packages/bb-app/scripts/build-public-sdk-dts.mjs';
          const baseline=readFileSync(p,'utf8');
          const pathBuilder = `async function workspaceCompilerPaths() {
            const paths = {};
            for (const entry of await readdir(packagesRoot, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const manifestPath = path.join(packagesRoot, entry.name, "package.json");
              if (!existsSync(manifestPath)) continue;
              const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
              for (const key of Object.keys(manifest.exports ?? {})) {
                if ((key !== "." && !key.startsWith("./")) || key.includes("*")) continue;
                const id = "@bb/" + entry.name + (key === "." ? "" : key.slice(1));
                const source = resolveWorkspaceSource(id);
                if (source !== null) paths[id] = [source];
              }
            }
            return paths;
          }
          `;
          const candidate=baseline.replace('const supportsNativeCompiler =',pathBuilder+'const supportsNativeCompiler =').replace('paths: {\n            "@bb/hono-typed-routes": ["hono-typed-routes/src/index.ts"],\n          },','paths: await workspaceCompilerPaths(),');
          if(candidate===baseline || !candidate.includes('paths: await workspaceCompilerPaths()')) throw new Error('injection failed');
          let expected;
          let round = 0;
          for (const variant of ['baseline','paths','paths','baseline']) {
            writeFileSync(p,variant==='baseline' ? baseline : candidate);
            const started=performance.now();
            const result=spawnSync(process.execPath,[p],{stdio:'inherit'});
            if(result.status!==0) throw new Error('declaration build failed: '+variant);
            const data=readFileSync('packages/bb-app/dist/index.d.ts');
            expected ??= data;
            writeFileSync('declaration-'+(++round)+'-'+variant+'.d.ts',data);
            console.log('DTS_COMPARE',JSON.stringify({variant,seconds:(performance.now()-started)/1000,bytes:data.length,sha256:createHash('sha256').update(data).digest('hex'),byteIdentical:expected.equals(data)}));

          }
          writeFileSync(p,baseline);
          NODE

      - name: Upload compared declarations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compared-declarations
          path: declaration-*.d.ts
