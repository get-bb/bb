name: CI
on:
  workflow_dispatch:
env:
  PRIMARY_NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"
jobs:
  windows-app-smoke:
    name: Windows tarball comparison (${{ matrix.order }})
    strategy:
      fail-fast: false
      matrix:
        order: [ABBA, BAAB]
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts

      - name: Restore Windows dependency disk
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/windows-dependency-cache

      - name: Restore React Compiler cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-react-compiler

      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: windows-app-smoke
          turbo-cache: "true"
          turbo-cache-max-size-mb: "256"

      - name: Restore pnpm cache
        if: runner.os == 'macOS'
        id: pnpm-cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-pnpm

      - name: Install dependencies
        timeout-minutes: 5
        shell: bash
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          PNPM_CACHE_RESTORE_OUTCOME: ${{ steps.pnpm-cache.outcome }}
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'

      - name: Build bb-app and boot it
        shell: bash
        run: pnpm exec turbo run smoke:boot --filter=bb-app --cache-dir="${TURBO_CACHE_DIR:-.turbo/cache}" --output-logs=new-only

      - name: Restore npm package downloads
        id: npm-downloads
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-npm-downloads

      - name: Compare full tarball smoke scheduling
        shell: bash
        env:
          ORDER: ${{ matrix.order }}
          npm_config_timing: "true"
        run: |
          mkdir -p "$RUNNER_TEMP/tarball-evidence"
          cp packages/bb-app/scripts/smoke-tarball.mjs "$RUNNER_TEMP/tarball-evidence/baseline.mjs"
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'packages/bb-app/scripts/smoke-tarball.mjs';
          const baseline = readFileSync(file, 'utf8');
          const candidate = baseline.replace('if (process.platform === "linux" || process.platform === "darwin") {', 'if (["linux", "darwin", "win32"].includes(process.platform)) {');
          if (candidate === baseline) throw new Error('Candidate not applied');
          writeFileSync(`${process.env.RUNNER_TEMP}/tarball-evidence/candidate.mjs`, candidate);
          NODE
          node packages/bb-app/scripts/smoke-tarball.mjs > "$RUNNER_TEMP/tarball-evidence/warmup.log" 2>&1
          mv "$npm_config_cache" "$RUNNER_TEMP/npm-snapshot"
          for i in 0 1 2 3; do
            variant=${ORDER:i:1}
            if [ "$variant" = A ]; then source=baseline; else source=candidate; fi
            cp "$RUNNER_TEMP/tarball-evidence/$source.mjs" packages/bb-app/scripts/smoke-tarball.mjs
            cp -R "$RUNNER_TEMP/npm-snapshot" "$npm_config_cache"
            echo "Trial $i $source"
            node packages/bb-app/scripts/smoke-tarball.mjs > "$RUNNER_TEMP/tarball-evidence/trial-$i-$source.log" 2>&1
            cp -R "$npm_config_cache/_logs" "$RUNNER_TEMP/tarball-evidence/npm-$i-$source"
            rm -rf "$npm_config_cache"
            tail -16 "$RUNNER_TEMP/tarball-evidence/trial-$i-$source.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-tarball-${{ matrix.order }}
          path: ${{ runner.temp }}/tarball-evidence
