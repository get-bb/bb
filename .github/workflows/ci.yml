name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-comparison:
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: bb-plugin-bb--git
            directory: plugins/git
            file: plugins/git/host/workspace-status-cache.test.ts
            branch: bb/ci-nov3-git-cost
            commit: e0abd4f84d2a10e851098ce3f30932ec042ea327
          - package: bb-plugin-environment-git-worktree
            directory: plugins/environment-git-worktree
            file: plugins/environment-git-worktree/host.test.ts
            branch: bb/ci-nov3-worktree-cost
            commit: a79ab713400ae5677944863c1a86690b225d5cb4
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
        timeout-minutes: 2
        continue-on-error: true
      - name: Install dependencies
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Fetch committed candidate
        run: git fetch origin ${{ matrix.branch }}
      - name: Build prerequisites and run baseline through Turbo
        shell: bash
        run: pnpm exec turbo run test --filter=${{ matrix.package }} --concurrency=1
      - name: Compare complete uncached test packages in alternating order
        env:
          CANDIDATE: ${{ matrix.commit }}
          TEST_FILE: ${{ matrix.file }}
          PACKAGE_NAME: ${{ matrix.package }}
          PACKAGE_DIR: ${{ matrix.directory }}
        run: node .github/diagnostics/compare-git-fixtures.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fixture-timings-${{ matrix.package }}
          path: fixture-timings
