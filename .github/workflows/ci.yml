name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin-shard-comparison:
    strategy:
      fail-fast: false
      matrix:
        order: ['baseline,candidate', 'candidate,baseline']
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
        timeout-minutes: 2
        continue-on-error: true
      - name: Install dependencies
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Fetch committed candidates
        shell: bash
        run: |
          git fetch --depth=1 origin d0bf4528508b46beafe5f7ef526e506cde5e0313
          git fetch --depth=1 origin bb/ci-nov3-git-cost
          git fetch --depth=1 origin bb/ci-nov3-worktree-cost
      - name: Compare full cold Windows plugins-2 shard
        env:
          ORDER: ${{ matrix.order }}
          VITEST_MAX_WORKERS: ''
          BB_CI_TEST_SHARD: ''
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node .github/diagnostics/compare-plugin-shard.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: shard-timings-${{ strategy.job-index }}
          path: shard-timings
