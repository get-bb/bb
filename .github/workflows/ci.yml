name: CI
on:
  workflow_dispatch:
jobs:
  web-profile:
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
      - shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - shell: bash
        run: |
          pnpm exec turbo run test --filter=@bb/web --force=true -- src/server/account.test.ts
          git fetch --depth=1 origin b3ccd831b7b76041f0286daf5b29425c7ea0a6d3
          git show b3ccd831b7b76041f0286daf5b29425c7ea0a6d3:apps/web/src/server/account.test.ts > "$RUNNER_TEMP/baseline.ts"
          cp apps/web/src/server/account.test.ts "$RUNNER_TEMP/candidate.ts"
          for variant in baseline candidate candidate baseline; do
            cp "$RUNNER_TEMP/$variant.ts" apps/web/src/server/account.test.ts
            echo "PROFILE $variant"
            pnpm --filter @bb/web exec vitest run --config vitest.config.ts src/server/account.test.ts --reporter=verbose
          done
