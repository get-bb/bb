name: CI
on:
  workflow_dispatch: {}
env:
  PRIMARY_NODE_VERSION: 22.x
  PNPM_VERSION: 9.15.0
permissions:
  contents: read
jobs:
  seed:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: 22.x
          pnpm-version: 9.15.0
      - name: Restore store archive
        uses: ./.github/actions/cache-pnpm
      - name: Install dependencies
        run: bash .github/actions/setup-workspace/install-dependencies.sh
          --ignore-scripts --filter '!@bb/mobile'
  consume:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: 22.x
          pnpm-version: 9.15.0
      - name: Restore store archive
        uses: ./.github/actions/cache-pnpm
        if: matrix.mode == 'cached'
      - name: Install dependencies
        run: bash .github/actions/setup-workspace/install-dependencies.sh
          --ignore-scripts --filter '!@bb/mobile'
      - name: Offline verify
        if: matrix.mode == 'cached'
        run: pnpm install --frozen-lockfile --offline --ignore-scripts --force --filter
          '!@bb/mobile'
    needs: seed
    strategy:
      fail-fast: false
      matrix:
        mode:
          - fresh
          - cached
        replica:
          - 1
          - 2
    name: Archive store ${{ matrix.mode }} replica ${{ matrix.replica }}
