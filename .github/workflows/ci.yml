name: CI
on:
  workflow_dispatch:
env:
  PRIMARY_NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"
jobs:
  windows-app-smoke:
    name: Windows app smoke (Node 22.x)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts

      - name: Restore Windows dependency disk
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/windows-dependency-cache

      - name: Restore React Compiler cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-react-compiler

      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: windows-app-smoke
          turbo-cache: "true"
          turbo-cache-max-size-mb: "256"

      - name: Restore pnpm cache
        if: runner.os == 'macOS'
        id: pnpm-cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-pnpm

      - name: Install dependencies
        timeout-minutes: 5
        shell: bash
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          PNPM_CACHE_RESTORE_OUTCOME: ${{ steps.pnpm-cache.outcome }}
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'

      - name: Build bb-app and boot it
        shell: bash
        run: pnpm exec turbo run smoke:boot --filter=bb-app --cache-dir="${TURBO_CACHE_DIR:-.turbo/cache}" --output-logs=new-only

      - name: Restore npm package downloads
        id: npm-downloads
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-npm-downloads

      - name: Smoke test the bb-app tarball
        run: pnpm exec turbo run smoke:tarball --filter=bb-app --output-logs=new-only

      - name: Read npm phase timings
        if: always()
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const dir=join(process.env.RUNNER_TEMP, 'bb-npm-profile');
          for(const name of await readdir(dir).catch(()=>[])) {
            if(!name.endsWith('timing.json')) continue;
            const data=JSON.parse(await readFile(join(dir,name),'utf8'));
            console.log('NPM_TIMING',name,JSON.stringify(data.timers));
          }
          NODE
      - name: Inspect storage volumes
        shell: pwsh
        run: |
          Get-Volume | Select-Object DriveLetter, FileSystem, Size, SizeRemaining
          Get-PhysicalDisk | Select-Object FriendlyName, MediaType, BusType, Size
