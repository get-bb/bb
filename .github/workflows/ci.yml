name: CI
on:
  workflow_dispatch:
jobs:
  hook-observation:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.x"
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
        continue-on-error: true
      - shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - shell: bash
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          failures=0
          for repeat in $(seq 1 10); do
            echo "HOOK_PACKAGE_REPEAT $repeat"
            pnpm exec turbo run test --filter=@bb/host-daemon --force --output-logs=full || failures=$((failures+1))
          done
          exit "$failures"
