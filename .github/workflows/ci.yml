name: CI
on:
  workflow_dispatch:
env:
  PRIMARY_NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"
jobs:
  windows-app-smoke:
    name: Windows app smoke (Node 22.x)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts

      - name: Restore Windows dependency disk
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/windows-dependency-cache

      - name: Preserve baseline and create compressed volume
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path 'P:\store')) { throw 'Expected cache hit' }
          $diskScript = Join-Path $env:GITHUB_WORKSPACE '.github/actions/windows-dependency-cache/disk.ps1'
          & $diskScript -Operation detach
          Set-Location $env:RUNNER_TEMP
          $tar = 'C:\Program Files\Git\usr\bin\tar.exe'
          & $tar --use-compress-program zstd -cf baseline.tar.zst bb-dependencies.vhdx
          if ($LASTEXITCODE -ne 0) { throw 'Archive failed' }
          Write-Host "BASELINE_IMAGE $((Get-Item bb-dependencies.vhdx).Length) $((Get-Item baseline.tar.zst).Length)"
          Remove-Item bb-dependencies.vhdx
          $candidateScript = Join-Path $env:RUNNER_TEMP 'compressed-disk.ps1'
          (Get-Content $diskScript -Raw).Replace('format fs=ntfs quick label=bb-dependencies', 'format fs=ntfs quick compress label=bb-dependencies') | Set-Content $candidateScript
          & $candidateScript -Operation create
          if (!(Test-Path 'P:\')) { throw 'Expected compressed volume' }
      - name: Populate fresh compressed dependency image
        timeout-minutes: 5
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Compare exact image extraction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diskScript = Join-Path $env:GITHUB_WORKSPACE '.github/actions/windows-dependency-cache/disk.ps1'
          & $diskScript -Operation detach
          Set-Location $env:RUNNER_TEMP
          $tar = 'C:\Program Files\Git\usr\bin\tar.exe'
          & $tar --use-compress-program zstd -cf compressed.tar.zst bb-dependencies.vhdx
          if ($LASTEXITCODE -ne 0) { throw 'Archive failed' }
          Write-Host "COMPRESSED_IMAGE $((Get-Item bb-dependencies.vhdx).Length) $((Get-Item compressed.tar.zst).Length)"
          foreach ($name in @('baseline', 'compressed', 'compressed', 'baseline')) {
            Remove-Item bb-dependencies.vhdx
            $watch = [Diagnostics.Stopwatch]::StartNew()
            & $tar --use-compress-program zstd -xf "$name.tar.zst"
            if ($LASTEXITCODE -ne 0) { throw 'Extract failed' }
            Write-Host "EXTRACTION $name $($watch.Elapsed.TotalSeconds)"
          }
          Remove-Item bb-dependencies.vhdx
          & $tar --use-compress-program zstd -xf compressed.tar.zst
          if ($LASTEXITCODE -ne 0) { throw 'Extract failed' }
          & $diskScript -Operation mount
      - name: Verify compressed dependency install
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Build and smoke app from compressed dependency image
        shell: bash
        run: pnpm exec turbo run smoke:boot smoke:tarball --filter=bb-app --output-logs=new-only
