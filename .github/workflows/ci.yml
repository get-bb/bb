name: CI
on:
  workflow_dispatch:
env:
  PRIMARY_NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"
jobs:
  windows-app-smoke:
    name: Windows app smoke (Node 22.x)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts

      - name: Restore Windows dependency disk
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/windows-dependency-cache

      - name: Restore React Compiler cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-react-compiler

      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: windows-app-smoke
          turbo-cache: "true"
          turbo-cache-max-size-mb: "256"

      - name: Restore pnpm cache
        if: runner.os == 'macOS'
        id: pnpm-cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-pnpm

      - name: Install dependencies
        timeout-minutes: 5
        shell: bash
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          PNPM_CACHE_RESTORE_OUTCOME: ${{ steps.pnpm-cache.outcome }}
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'

      - name: Build bb-app and boot it
        shell: bash
        run: pnpm exec turbo run smoke:boot --filter=bb-app --cache-dir="${TURBO_CACHE_DIR:-.turbo/cache}" --output-logs=new-only

      - name: Profile SDK declaration stages
        shell: bash
        run: |
          mkdir -p dts-profile
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const p='packages/bb-app/scripts/build-public-sdk-dts.mjs';
          let s=readFileSync(p,'utf8');
          s=s.replace('const here =', `const totals = {};
          function timedDts(options) {
            const plugin=dts(options);
            for(const key of Object.keys(plugin)) {
              const entry=plugin[key];
              const handler=typeof entry==='function' ? entry : entry?.handler;
              if(typeof handler !== 'function') continue;
              const wrapped=function(...args) {
                const start=performance.now();
                const finish=()=>{const x=totals[key]??={calls:0,ms:0}; x.calls++; x.ms+=performance.now()-start;};
                try {
                  const result=handler.apply(this,args);
                  if(result && typeof result.then==='function') return result.finally(finish);
                  finish(); return result;
                } catch(error) { finish(); throw error; }
              };
              plugin[key]=typeof entry==='function' ? wrapped : {...entry,handler:wrapped};
            }
            return plugin;
          }
          console.log('DTS_START',performance.now());
          const here =`);
          s=s.replace('      dts({','      timedDts({');
          s=s.replace('  const build = await rollup({', "  console.log('DTS_ROLLUP_START',performance.now());\n  const build = await rollup({");
          s=s.replace('    await build.write({', "    console.log('DTS_WRITE_START',performance.now());\n    await build.write({");
          s=s.replace('    await build.close();', "    console.log('DTS_CLOSE_START',performance.now());\n    await build.close();");
          s+="\nconsole.log('DTS_DONE',performance.now(),JSON.stringify(totals));\n";
          writeFileSync(p,s);
          NODE
          node --cpu-prof --cpu-prof-dir=dts-profile packages/bb-app/scripts/build-public-sdk-dts.mjs

      - name: Upload SDK CPU profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-dts-profile
          path: dts-profile
