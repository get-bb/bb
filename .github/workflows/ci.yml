name: CI
on:
  push:
    branches: [ci/nov9-fork-critical]
permissions:
  contents: read
env:
  PRIMARY_NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"
jobs:
  plugin-forks:
    name: Fork profile (${{ matrix.shard }}/${{ matrix.count }}, concurrency ${{ matrix.concurrency }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: 1, count: 3, runner: blacksmith-4vcpu-ubuntu-2404, concurrency: 4}
          - {shard: 2, count: 3, runner: blacksmith-4vcpu-ubuntu-2404, concurrency: 4}
          - {shard: 3, count: 3, runner: blacksmith-4vcpu-ubuntu-2404, concurrency: 4}
          - {shard: 1, count: 3, runner: blacksmith-4vcpu-ubuntu-2404, concurrency: 8}
          - {shard: 2, count: 3, runner: blacksmith-4vcpu-ubuntu-2404, concurrency: 8}
          - {shard: 3, count: 3, runner: blacksmith-4vcpu-ubuntu-2404, concurrency: 8}
          - {shard: 1, count: 2, runner: blacksmith-4vcpu-ubuntu-2404, concurrency: 8}
          - {shard: 2, count: 2, runner: blacksmith-4vcpu-ubuntu-2404, concurrency: 8}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select forkable plugins
        id: selection
        continue-on-error: true
        timeout-minutes: 2
        env:
          BASE_SHA: ''
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
          fi
          selection=$(node scripts/check-plugin-forks.mjs --changed-from="$BASE_SHA" --shard=${{ matrix.shard }}/${{ matrix.count }} --list)
          echo "count=$(node -e 'console.log(JSON.parse(process.argv[1]).length)' "$selection")" >> "$GITHUB_OUTPUT"
          echo "Forkable plugins: $selection" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup workspace tools
        if: steps.selection.outputs.count != '0'
        uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Restore workspace caches
        if: steps.selection.outputs.count != '0'
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: plugin-forks-${{ matrix.shard }}
          turbo-cache: "true"

      - name: Restore pnpm cache
        if: runner.os != 'Windows'
        id: pnpm-cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-pnpm

      - name: Install dependencies
        if: steps.selection.outputs.count != '0'
        timeout-minutes: 5
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          PNPM_CACHE_RESTORE_OUTCOME: ${{ steps.pnpm-cache.outcome }}
        run: bash .github/actions/setup-workspace/install-dependencies.sh

      - name: Setup Bun
        if: steps.selection.outputs.count != '0'
        timeout-minutes: 4
        uses: ./.github/actions/setup-bun
        with:
          version: "1.3.14"

      - name: Build, typecheck, and test forkable plugins outside the workspace
        if: steps.selection.outputs.count != '0'
        env:
          VITEST_MAX_WORKERS: "2"
          PROFILE_LONG_FIRST: ${{ matrix.concurrency == 8 && 'true' || 'false' }}
          BASE_SHA: ''
        run: |
          for trial in 1; do
            echo "TRIAL $trial"
            time node scripts/check-plugin-forks.mjs --shard=${{ matrix.shard }}/${{ matrix.count }} --concurrency=${{ matrix.concurrency }}
          done

      - name: Upload fork dependency evidence
        if: ${{ !cancelled() && steps.selection.outputs.count != '0' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: plugin-fork-evidence-${{ matrix.shard }}-${{ matrix.count }}-${{ matrix.concurrency }}
          path: ${{ runner.temp }}/plugin-fork-evidence
          retention-days: 7
          if-no-files-found: ignore

      - name: Bound saved Turbo cache
        if: steps.selection.outputs.count != '0'
        run: node scripts/prune-turbo-cache.mjs --dir .turbo/cache --max-size-mb 1024

