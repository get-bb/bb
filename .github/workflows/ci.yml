name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  identity:
    name: Windows identity shell ${{ matrix.shell }}
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, pwsh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - shell: ${{ matrix.shell }}
        run: node .github/diagnostics/process-identity.mjs
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shell-${{ matrix.shell }}
          path: process-identity.json
