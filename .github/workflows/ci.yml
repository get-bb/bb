name: CI
on:
  push:
    branches: [ci/nov9-query-audit-cost]
  workflow_dispatch:
permissions:
  contents: read
env:
  PRIMARY_NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"
jobs:
  profile:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace tools
        uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: query-plans
          turbo-cache: "true"

      - name: Restore pnpm cache
        id: pnpm-cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-pnpm

      - name: Install dependencies
        timeout-minutes: 5
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          PNPM_CACHE_RESTORE_OUTCOME: ${{ steps.pnpm-cache.outcome }}
        run: bash .github/actions/setup-workspace/install-dependencies.sh --filter '!@bb/mobile'

      - name: Prepare comparison variants
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cp packages/db/src/query-plan-guard.ts "$RUNNER_TEMP/candidate.ts"
          git fetch --depth=1 origin 0509f46aae61a5b30afac23551b084b0f28b6d4f
          git show FETCH_HEAD:packages/db/src/query-plan-guard.ts > "$RUNNER_TEMP/baseline.ts"
      - name: Bootstrap test prerequisites
        run: pnpm exec turbo run test --filter=@bb/db --filter=@bb/server --output-logs=new-only -- --passWithNoTests test/nonexistent-profile-bootstrap.test.ts
      - name: Compare pruning and timeline tests
        env:
          VITEST_MAX_WORKERS: "2"
        run: |
          trial=0
          for variant in baseline candidate candidate baseline; do
            trial=$((trial+1))
            cp "$RUNNER_TEMP/$variant.ts" packages/db/src/query-plan-guard.ts
            export BB_QUERY_PLAN_EXECUTED="$RUNNER_TEMP/evidence/functions-$trial.jsonl"
            echo "QUERY PROFILE $trial $variant"
            pnpm --filter @bb/db exec vitest run --config vitest.config.ts test/data/resolved-item-pruning-resume.test.ts | tee "$RUNNER_TEMP/evidence/db-$trial.log"
            pnpm --filter @bb/server exec vitest run --config vitest.config.ts test/services/threads/timeline-selection-memo.test.ts test/services/threads/timeline-in-turn-window.test.ts | tee "$RUNNER_TEMP/evidence/server-$trial.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: query-profile
          path: ${{ runner.temp }}/evidence
  reports:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace tools
        uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: query-plans
          turbo-cache: "true"

      - name: Restore pnpm cache
        id: pnpm-cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-pnpm

      - name: Install dependencies
        timeout-minutes: 5
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          PNPM_CACHE_RESTORE_OUTCOME: ${{ steps.pnpm-cache.outcome }}
        run: bash .github/actions/setup-workspace/install-dependencies.sh --filter '!@bb/mobile'

      - name: Prepare comparison variants
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cp packages/db/src/query-plan-guard.ts "$RUNNER_TEMP/candidate.ts"
          git fetch --depth=1 origin 0509f46aae61a5b30afac23551b084b0f28b6d4f
          git show FETCH_HEAD:packages/db/src/query-plan-guard.ts > "$RUNNER_TEMP/baseline.ts"
      - name: Compare full query reports
        env:
          VITEST_MAX_WORKERS: "4"
        run: |
          for variant in baseline candidate; do
            cp "$RUNNER_TEMP/$variant.ts" packages/db/src/query-plan-guard.ts
            export BB_QUERY_PLAN_REPORT="$RUNNER_TEMP/evidence/$variant.jsonl"
            echo "FULL QUERY REPORT $variant"
            pnpm exec turbo run test --filter=@bb/db --filter=@bb/server --output-logs=new-only --concurrency=1 | tee "$RUNNER_TEMP/evidence/$variant.log"
            pnpm --filter @bb/db check:query-plan-report "$BB_QUERY_PLAN_REPORT" | tee "$RUNNER_TEMP/evidence/$variant-check.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-query-reports
          path: ${{ runner.temp }}/evidence
