name: CI
on:
  workflow_dispatch:
jobs:
  hook-observation:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.x"
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
        continue-on-error: true
      - shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - shell: bash
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          pnpm exec turbo run test --filter=@bb/host-daemon -- src/environment-lifecycle-script.test.ts
          target=apps/host-daemon/src/environment-lifecycle-script.test.ts
          cp "$target" "$RUNNER_TEMP/hook-original.ts"
          node -e 'const fs=require("fs"); const p=process.argv[1]; fs.writeFileSync(p,fs.readFileSync(p,"utf8").replace("      if (alive.length > 0)","      alive.push(process.pid);\n      if (alive.length > 0)"))' "$target"
          if pnpm exec turbo run test --filter=@bb/host-daemon -- src/environment-lifecycle-script.test.ts > "$RUNNER_TEMP/hook-live.log" 2>&1; then exit 1; fi
          cat "$RUNNER_TEMP/hook-live.log"
          grep -q 'Windows hook cancellation left live PIDs' "$RUNNER_TEMP/hook-live.log"
          grep -q 'CreationDate' "$RUNNER_TEMP/hook-live.log"
          grep -q 'AssertionError: expected' "$RUNNER_TEMP/hook-live.log"
          node -e 'const fs=require("fs"); const p=process.argv[1]; fs.writeFileSync(p,fs.readFileSync(p,"utf8").replace("Get-CimInstance Win32_Process","Start-Sleep 5; Get-CimInstance Win32_Process"))' "$target"
          if pnpm exec turbo run test --filter=@bb/host-daemon -- src/environment-lifecycle-script.test.ts > "$RUNNER_TEMP/hook-timeout.log" 2>&1; then exit 1; fi
          cat "$RUNNER_TEMP/hook-timeout.log"
          grep -q 'ETIMEDOUT' "$RUNNER_TEMP/hook-timeout.log"
          grep -q 'AssertionError: expected' "$RUNNER_TEMP/hook-timeout.log"
          cp "$RUNNER_TEMP/hook-original.ts" "$target"
