name: CI
on:
  workflow_dispatch:
env:
  PRIMARY_NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"
jobs:
  tests:
    name: Tests (${{ matrix.shard }}, ubuntu-latest, Node 22.x)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: server-2
            filter: --filter=@bb/server
            vitestShard: 2/2
            mobile: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace tools
        uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Restore React Compiler cache
        if: ${{ contains(matrix.filter, '--filter=@bb/demo-server') }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-react-compiler

      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: test-${{ matrix.shard }}
          turbo-cache: "true"

      - name: Restore pnpm cache
        if: runner.os != 'Windows'
        id: pnpm-cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-pnpm

      - name: Install dependencies
        timeout-minutes: 5
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          PNPM_CACHE_RESTORE_OUTCOME: ${{ steps.pnpm-cache.outcome }}
          APP_SHARD: ${{ startsWith(matrix.shard, 'app-') }}
          DEMO_ONLY: ${{ matrix.filter == '--filter=@bb/demo-server' }}
          MOBILE_TESTS: ${{ matrix.mobile }}
        run: |
          filters=()
          if [[ "$APP_SHARD" == "true" ]]; then
            filters=(--ignore-scripts --filter bb --filter '@bb/app...' --filter '@bb/db...')
          elif [[ "$DEMO_ONLY" == "true" ]]; then
            filters=(--ignore-scripts --filter bb --filter '@bb/demo-server...' --filter '@bb/db...')
          elif [[ "$MOBILE_TESTS" != "true" ]]; then
            filters=(--filter '!@bb/mobile')
          fi
          bash .github/actions/setup-workspace/install-dependencies.sh "${filters[@]}"

      - name: Setup Bun
        if: ${{ startsWith(matrix.shard, 'packages-') || startsWith(matrix.shard, 'plugins-') }}
        timeout-minutes: 4
        uses: ./.github/actions/setup-bun
        with:
          version: "1.3.14"

      - name: Install Electron runtime libraries
        if: ${{ contains(matrix.filter, '--filter=@bb/desktop') }}
        run: |
          bash .github/actions/setup-workspace/install-electron-libraries.sh
          ELECTRON_RUN_AS_NODE=1 pnpm --filter @bb/desktop exec electron --version

      - name: Test
        continue-on-error: true
        env:
          BB_CI_TEST_SHARD: ${{ matrix.vitestShard }}
          BB_QUERY_PLAN_EXECUTED: .query-plan/executed.jsonl
          VITEST_MAX_WORKERS: ${{ (startsWith(matrix.shard, 'server-') || matrix.shard == 'integration') && '4' || '2' }}
        run: ${{ contains(matrix.filter, '--filter=@bb/desktop') && 'xvfb-run -a' || '' }} pnpm exec turbo run test ${{ matrix.filter }} --cache-dir="${TURBO_CACHE_DIR:-.turbo/cache}" --output-logs=new-only --summarize --concurrency=4

      - name: Compare Linux server shard
        env:
          BB_CI_TEST_SHARD: "2/2"
          BB_QUERY_PLAN_EXECUTED: .query-plan/executed.jsonl
          VITEST_MAX_WORKERS: "4"
        run: |
          cp apps/server/test/services/plugins/plugin-host-rpc.test.ts "$RUNNER_TEMP/candidate.ts"
          index=0
          failed=0
          for variant in baseline candidate candidate baseline; do
            index=$((index + 1))
            if [ "$variant" = baseline ]; then
              cp .github/diagnostics/plugin-hostrpc-baseline.txt apps/server/test/services/plugins/plugin-host-rpc.test.ts
            else
              cp "$RUNNER_TEMP/candidate.ts" apps/server/test/services/plugins/plugin-host-rpc.test.ts
            fi
            echo "LINUX_SHARD_COMPARISON $index $variant"
            pnpm --filter @bb/server exec vitest run --config vitest.config.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/$index-$variant.json" || failed=1
          done
          cp "$RUNNER_TEMP/candidate.ts" apps/server/test/services/plugins/plugin-host-rpc.test.ts
          exit "$failed"
      - name: Upload comparison
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-server2-abba
          path: ${{ runner.temp }}/*.json
