name: Native plugin Windows diagnosis
on:
  workflow_dispatch:
jobs:
  native-profile:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workers: [2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.x'
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
        continue-on-error: true
      - name: Install dependencies
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter bb --filter '@bb/server...' --filter '@bb/host-daemon...' --filter '@bb/app...' --filter 'bb-plugin-*...'
      - name: Profile full shard with controlled concurrency
        shell: pwsh
        env:
          BB_CI_TEST_SHARD: '2/3'
          VITEST_MAX_WORKERS: ${{ matrix.workers }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          1..2 | ForEach-Object {
            Write-Host "PROFILE workers=$env:VITEST_MAX_WORKERS iteration=$_"
            pnpm exec turbo run test --filter=@bb/server --force --concurrency=4
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
