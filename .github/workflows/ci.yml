name: CI
on:
  workflow_dispatch:
env:
  PRIMARY_NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"
jobs:
  windows-app-smoke:
    name: Windows app smoke (Node 22.x)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts

      - name: Restore Windows dependency disk
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/windows-dependency-cache

      - name: Restore React Compiler cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-react-compiler

      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: windows-app-smoke
          turbo-cache: "true"
          turbo-cache-max-size-mb: "256"

      - name: Restore pnpm cache
        if: runner.os == 'macOS'
        id: pnpm-cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-pnpm

      - name: Install dependencies
        timeout-minutes: 5
        shell: bash
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          PNPM_CACHE_RESTORE_OUTCOME: ${{ steps.pnpm-cache.outcome }}
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'

      - name: Build bb-app and boot it
        shell: bash
        run: pnpm exec turbo run smoke:boot --filter=bb-app --cache-dir="${TURBO_CACHE_DIR:-.turbo/cache}" --output-logs=new-only

      - name: Profile repeated assembly
        shell: bash
        run: |
          for trial in 1 2 3; do
            node packages/bb-app/scripts/build.mjs
          done
      - name: Compare native Windows SDK compiler
        shell: bash
        env:
          SDK_PROFILE_COMPILER: ${{ runner.temp }}/sdk-compiler/node_modules/@typescript/native-preview/bin/tsgo
        run: |
          npm install --prefix "$RUNNER_TEMP/sdk-compiler" --no-audit --no-fund --ignore-scripts --package-lock=false @typescript/native-preview@7.0.0-dev.20260707.2
          mkdir -p "$RUNNER_TEMP/sdk-evidence"
          cp packages/bb-app/scripts/build-public-sdk-dts.mjs "$RUNNER_TEMP/sdk-evidence/baseline.mjs"
          cp packages/bb-app/dist/index.d.ts "$RUNNER_TEMP/sdk-evidence/baseline.d.ts"
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'packages/bb-app/scripts/build-public-sdk-dts.mjs';
          let text = readFileSync(file, 'utf8');
          text = text.replace('const compiler = fileURLToPath(', 'const compiler = process.env.SDK_PROFILE_COMPILER || fileURLToPath(');
          text = text.replace('const supportsNativeCompiler =', 'const supportsNativeCompiler = process.platform === "win32" ||');
          writeFileSync(file, text);
          NODE
          node packages/bb-app/scripts/build-public-sdk-dts.mjs
          cp packages/bb-app/dist/index.d.ts "$RUNNER_TEMP/sdk-evidence/candidate.d.ts"
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const baseline = readFileSync(join(process.env.RUNNER_TEMP, 'sdk-evidence/baseline.d.ts'));
          const candidate = readFileSync(join(process.env.RUNNER_TEMP, 'sdk-evidence/candidate.d.ts'));
          console.log('Declarations byte identical:', baseline.equals(candidate), 'bytes:', baseline.length, candidate.length);
          NODE
      - name: Compare existing TypeScript pre-emission
        shell: bash
        run: |
          cp "$RUNNER_TEMP/sdk-evidence/baseline.mjs" packages/bb-app/scripts/build-public-sdk-dts.mjs
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'packages/bb-app/scripts/build-public-sdk-dts.mjs';
          let text = readFileSync(file, 'utf8');
          text = text.replace('new URL("./bin/tsrs", import.meta.resolve("tsrs/package.json"))', 'new URL("./bin/tsc", import.meta.resolve("typescript/package.json"))');
          text = text.replace('const supportsNativeCompiler =', 'const supportsNativeCompiler = process.platform === "win32" ||');
          writeFileSync(file, text);
          NODE
          for trial in 1 2 3; do
            time node packages/bb-app/scripts/build-public-sdk-dts.mjs
            cp packages/bb-app/dist/index.d.ts "$RUNNER_TEMP/sdk-evidence/tsc-$trial.d.ts"
          done
          cp "$RUNNER_TEMP/sdk-evidence/baseline.mjs" packages/bb-app/scripts/build-public-sdk-dts.mjs
          for trial in 1 2 3; do
            time node packages/bb-app/scripts/build-public-sdk-dts.mjs
            cp packages/bb-app/dist/index.d.ts "$RUNNER_TEMP/sdk-evidence/source-$trial.d.ts"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-compiler-profile
          path: ${{ runner.temp }}/sdk-evidence
