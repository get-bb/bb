name: Verify dependency disk recovery
on:
  push:
    branches: [bb/ci-dependency-disk-recovery]
permissions:
  contents: read
jobs:
  disk:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, candidate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Prove disk recovery on real Windows storage
        shell: pwsh
        run: ./.github/benchmarks/dependency-disk-proof.ps1 -Mode ${{ matrix.mode }}
