name: Release Android beta
run-name: Android beta · ${{ inputs.track }} · ${{ inputs.action }}

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play testing destination
        required: true
        type: choice
        default: open
        options: [open, internal]
      action:
        description: Save a draft or request rollout to this testing track after review
        required: true
        type: choice
        default: draft
        options: [draft, review]

permissions:
  contents: read

concurrency:
  group: mobile-android-eas
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build AAB and submit to the selected testing track
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ inputs.track }}
          PLAY_ACTION: ${{ inputs.action }}
        run: node scripts/android-beta-release.mjs
      - name: Preserve build and submission details
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-beta-release
          path: |
            apps/mobile/eas-build.json
            apps/mobile/android-beta-release.json
          if-no-files-found: ignore
          retention-days: 90
