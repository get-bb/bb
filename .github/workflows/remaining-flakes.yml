name: Diagnose remaining Windows flakes
on:
  push:
    branches: [bb/ci-windows-identity-probe]
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        lane: [identity, crash, freshness]
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
        timeout-minutes: 1
        continue-on-error: true
      - name: Install dependencies
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Prepare open-handle diagnostics
        if: matrix.lane == 'crash'
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/Handle.zip -OutFile "$env:RUNNER_TEMP/Handle.zip"
          Expand-Archive "$env:RUNNER_TEMP/Handle.zip" "$env:RUNNER_TEMP/handles"
          & "$env:RUNNER_TEMP/handles/handle64.exe" -accepteula -nobanner nonexistent-bb-probe
          exit 0
      - name: Run instrumented baseline
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          PROBE_LANE: ${{ matrix.lane }}
        run: node .github/scripts/remaining-flakes.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: remaining-flakes-${{ matrix.lane }}
          path: ${{ runner.temp }}/remaining-flakes/
