name: Build Desktop

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_channel:
        description: "stable publishes desktop-v<version> and moves desktop-latest; nightly moves desktop-nightly."
        required: true
        type: string
      version:
        description: "Version to build. Empty builds the version committed in apps/desktop/package.json."
        required: false
        type: string
        default: ""
      publish:
        description: "Publish the release channel's GitHub release."
        required: true
        type: boolean

env:
  BB_DESKTOP_RELEASE_CHANNEL: ${{ inputs.release_channel == 'nightly' && 'nightly' || 'latest' }}
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"
  RELEASE_CHANNEL: ${{ inputs.release_channel || 'qa' }}
  REQUESTED_VERSION: ${{ inputs.version }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow == 'Build Desktop' && format('build-desktop-{0}', github.ref) || format('build-desktop-{0}-{1}', github.run_id, inputs.release_channel) }}
  cancel-in-progress: ${{ github.workflow == 'Build Desktop' }}

jobs:
  macos:
    name: macOS arm64 desktop artifacts
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 45
    outputs:
      has_signing_secrets: ${{ steps.signing.outputs.has_signing_secrets }}
      version: ${{ steps.release_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify arm64 runner
        run: test "$(uname -m)" = "arm64"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Apply the release version
        id: release_version
        run: |
          set -euo pipefail

          if [[ "$RELEASE_CHANNEL" == "nightly" && -z "$REQUESTED_VERSION" ]]; then
            echo "::error::A nightly desktop build needs the version the npm publish job reported."
            exit 1
          fi

          if [[ -n "$REQUESTED_VERSION" ]]; then
            node scripts/bump-version.mjs "$REQUESTED_VERSION"
          fi

          version="$(node -p "require('./apps/desktop/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${RELEASE_CHANNEL} desktop ${version}."

      - name: Typecheck desktop and launcher
        run: pnpm exec turbo run typecheck --filter=@bb/desktop --filter=bb-app --output-logs=new-only

      - name: Build desktop
        run: pnpm exec turbo run build --filter=@bb/desktop --output-logs=new-only

      - name: Install Electron before parallel tests
        run: ELECTRON_RUN_AS_NODE=1 pnpm --filter @bb/desktop exec electron --version

      - name: Test desktop and launcher
        run: pnpm exec turbo run test --filter=@bb/desktop --filter=bb-app --force --output-logs=new-only

      - name: Validate macOS signing secrets
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          REQUIRED_SECRET_NAMES=(
            "MACOS_CERTIFICATE_P12"
            "MACOS_CERTIFICATE_PASSWORD"
            "APPLE_ID"
            "APPLE_APP_PASSWORD"
            "APPLE_TEAM_ID"
          )
          PRESENT_SECRET_NAMES=()
          MISSING_SECRET_NAMES=()

          for secret_name in "${REQUIRED_SECRET_NAMES[@]}"; do
            if [[ -n "${!secret_name:-}" ]]; then
              PRESENT_SECRET_NAMES+=("$secret_name")
            else
              MISSING_SECRET_NAMES+=("$secret_name")
            fi
          done

          HAS_SIGNING_SECRETS="false"
          if [[ "${#PRESENT_SECRET_NAMES[@]}" -eq 0 && "$RELEASE_CHANNEL" == "nightly" ]]; then
            echo "::error::Nightly desktop auto-updates require signed and notarized artifacts. Missing: ${MISSING_SECRET_NAMES[*]}."
            exit 1
          elif [[ "${#PRESENT_SECRET_NAMES[@]}" -eq 0 ]]; then
            echo "::warning::macOS signing/notarization secrets are not configured; building unsigned macOS workflow artifacts that a publish run will withhold. Both version feeds and the Linux AppImage still publish."
          elif [[ "${#MISSING_SECRET_NAMES[@]}" -eq 0 ]]; then
            echo "macOS signing/notarization secrets are complete; signed and notarized artifacts will be produced."
            HAS_SIGNING_SECRETS="true"
          else
            echo "::error::Incomplete macOS signing/notarization secret set. Present: ${PRESENT_SECRET_NAMES[*]}. Missing: ${MISSING_SECRET_NAMES[*]}."
            exit 1
          fi

          echo "has_signing_secrets=$HAS_SIGNING_SECRETS" >> "$GITHUB_OUTPUT"

      - name: Package arm64 desktop artifacts
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec turbo run desktop:build --filter=@bb/desktop --force --output-logs=new-only

      - name: Smoke test packaged desktop app
        run: pnpm exec turbo run smoke:packaged --filter=@bb/desktop --force --output-logs=new-only

      - name: Generate desktop version feed
        run: pnpm --dir apps/desktop run desktop:version-feed

      - name: Upload desktop workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bb-desktop-${{ env.RELEASE_CHANNEL }}-macos-arm64
          retention-days: ${{ inputs.release_channel == 'nightly' && 14 || 0 }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/${{ inputs.release_channel == 'nightly' && 'nightly' || 'latest' }}-mac.yml
            apps/desktop/release/desktop-version.json
          if-no-files-found: error

  linux:
    name: Linux x64 desktop artifacts
    # Pinned rather than ubuntu-latest so the glibc the AppImage links against
    # changes only when we choose it: the build machine's glibc sets the
    # minimum distro version users need.
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 45
    outputs:
      version: ${{ steps.release_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Apply the release version
        id: release_version
        run: |
          set -euo pipefail

          if [[ "$RELEASE_CHANNEL" == "nightly" && -z "$REQUESTED_VERSION" ]]; then
            echo "::error::A nightly desktop build needs the version the npm publish job reported."
            exit 1
          fi

          if [[ -n "$REQUESTED_VERSION" ]]; then
            node scripts/bump-version.mjs "$REQUESTED_VERSION"
          fi

          version="$(node -p "require('./apps/desktop/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${RELEASE_CHANNEL} desktop ${version}."

      - name: Typecheck desktop and launcher
        run: pnpm exec turbo run typecheck --filter=@bb/desktop --filter=bb-app --output-logs=new-only

      - name: Build desktop
        run: pnpm exec turbo run build --filter=@bb/desktop --output-logs=new-only

      - name: Install Electron before parallel tests
        run: ELECTRON_RUN_AS_NODE=1 pnpm --filter @bb/desktop exec electron --version

      - name: Test desktop and launcher
        run: pnpm exec turbo run test --filter=@bb/desktop --filter=bb-app --force --output-logs=new-only

      - name: Package x64 AppImage
        # No --force: the packaging task is already cache: false, and forcing also
        # rebuilds its cached bb-app/@bb/desktop dependencies a second time.
        run: pnpm exec turbo run desktop:build:linux --filter=@bb/desktop --output-logs=new-only

      - name: Smoke test packaged desktop app
        # The packaged app opens a real BrowserWindow, so the headless runner
        # needs a virtual display.
        run: xvfb-run -a pnpm exec turbo run smoke:packaged --filter=@bb/desktop --force --output-logs=new-only

      - name: Smoke test AppImage mount lifecycle
        # Launches the generated AppImage itself, tears down only its GUI mount,
        # and verifies the separately mounted owned runtime remains healthy.
        run: xvfb-run -a pnpm exec turbo run smoke:appimage-lifecycle --filter=@bb/desktop --force --output-logs=new-only

      - name: Generate desktop version feed
        run: pnpm --dir apps/desktop run desktop:version-feed

      - name: Upload desktop workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bb-desktop-${{ env.RELEASE_CHANNEL }}-linux-x64
          retention-days: ${{ inputs.release_channel == 'nightly' && 14 || 0 }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/${{ inputs.release_channel == 'nightly' && 'nightly' || 'latest' }}-linux.yml
            apps/desktop/release/desktop-version-linux.json
          if-no-files-found: error

  windows:
    name: Windows x64 desktop artifacts
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 45
    outputs:
      has_signing_secrets: ${{ steps.signing_secrets.outputs.has_signing_secrets }}
      version: ${{ steps.release_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} --ignore-scripts

      - name: Install dependencies
        # Native modules ship prebuilt binaries; skipping install scripts keeps
        # the job independent of a C++ toolchain on the runner.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply the release version
        id: release_version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RELEASE_CHANNEL" == "nightly" && -z "$REQUESTED_VERSION" ]]; then
            echo "::error::A nightly desktop build needs the version the npm publish job reported."
            exit 1
          fi

          if [[ -n "$REQUESTED_VERSION" ]]; then
            node scripts/bump-version.mjs "$REQUESTED_VERSION"
          fi

          version="$(node -p "require('./apps/desktop/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${RELEASE_CHANNEL} desktop ${version}."

      - name: Validate Windows signing secrets
        id: signing_secrets
        shell: bash
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          present=0
          missing=()
          for key in WINDOWS_CERTIFICATE_PFX WINDOWS_CERTIFICATE_PASSWORD; do
            if [[ -n "${!key:-}" ]]; then
              present=$((present + 1))
            else
              missing+=("$key")
            fi
          done

          if [[ "$present" -eq 0 ]]; then
            echo "::warning::Windows signing secrets are not configured; building an unsigned installer. Windows SmartScreen warns before running it."
            echo "has_signing_secrets=false" >> "$GITHUB_OUTPUT"
          elif [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::error::Incomplete Windows signing secrets. Missing: ${missing[*]}"
            exit 1
          else
            echo "has_signing_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package x64 installer
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pnpm exec turbo run desktop:build:win --filter=@bb/desktop --output-logs=new-only

      - name: Smoke test packaged desktop app
        run: pnpm exec turbo run smoke:packaged --filter=@bb/desktop --force --output-logs=new-only

      - name: Generate desktop version feed
        run: pnpm --dir apps/desktop run desktop:version-feed

      - name: Upload desktop workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bb-desktop-${{ env.RELEASE_CHANNEL }}-windows-x64
          retention-days: ${{ inputs.release_channel == 'nightly' && 14 || 0 }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/${{ inputs.release_channel == 'nightly' && 'nightly' || 'latest' }}.yml
            apps/desktop/release/desktop-version-windows.json
          if-no-files-found: error

  publish:
    name: Publish desktop release
    needs:
      - macos
      - linux
      - windows
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: write
    # A release run and the nightly cron can both reach the nightly publish at
    # once. Both delete every asset on the moving release and upload their own,
    # so a race can leave one platform's binaries missing. Serialize the reset.
    concurrency:
      group: ${{ inputs.release_channel == 'nightly' && 'publish-nightly-desktop' || format('publish-desktop-{0}-{1}', github.run_id, inputs.release_channel || 'qa') }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The plan runs before the downloads: a qa or publish=false run has no use
      # for several hundred MB of binaries it will never upload.
      - name: Plan release publication
        id: release_plan
        env:
          HAS_SIGNING_SECRETS: ${{ needs.macos.outputs.has_signing_secrets }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          LINUX_VERSION: ${{ needs.linux.outputs.version }}
          MACOS_VERSION: ${{ needs.macos.outputs.version }}
          WINDOWS_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -z "$MACOS_VERSION" || "$MACOS_VERSION" != "$LINUX_VERSION" || "$MACOS_VERSION" != "$WINDOWS_VERSION" ]]; then
            echo "::error::Platform versions disagree. macOS: '${MACOS_VERSION}'. Linux: '${LINUX_VERSION}'. Windows: '${WINDOWS_VERSION}'."
            exit 1
          fi

          VERSION="$MACOS_VERSION"
          IS_PRERELEASE="false"
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          SHOULD_PUBLISH="false"
          if [[ "$INPUT_PUBLISH" == "true" && "$RELEASE_CHANNEL" == "nightly" ]]; then
            SHOULD_PUBLISH="true"
          elif [[ "$INPUT_PUBLISH" == "true" && "$RELEASE_CHANNEL" == "stable" && "$IS_PRERELEASE" == "false" ]]; then
            SHOULD_PUBLISH="true"
          elif [[ "$INPUT_PUBLISH" == "true" && "$RELEASE_CHANNEL" == "stable" ]]; then
            echo "::warning::${VERSION} is a prerelease; desktop-latest only takes stable versions, so nothing is published."
          fi

          # Linux AppImages have no notarization equivalent and an unsigned
          # Windows installer still runs, so both publish on their own. Only
          # the macOS binaries wait on the Apple secrets.
          PUBLISH_MACOS_BINARIES="false"
          if [[ "$HAS_SIGNING_SECRETS" == "true" ]]; then
            PUBLISH_MACOS_BINARIES="true"
          elif [[ "$SHOULD_PUBLISH" == "true" ]]; then
            echo "::warning::macOS signing/notarization secrets are missing; publishing the version feeds, the Linux AppImage, and the Windows installer, and withholding unsigned .dmg/.zip artifacts."
          fi

          {
            echo "version=$VERSION"
            echo "is_prerelease=$IS_PRERELEASE"
            echo "should_publish=$SHOULD_PUBLISH"
            echo "publish_macos_binaries=$PUBLISH_MACOS_BINARIES"
          } >> "$GITHUB_OUTPUT"

      - name: Download macOS desktop artifacts
        if: steps.release_plan.outputs.should_publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bb-desktop-${{ env.RELEASE_CHANNEL }}-macos-arm64
          path: release/macos

      - name: Download Linux desktop artifacts
        if: steps.release_plan.outputs.should_publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bb-desktop-${{ env.RELEASE_CHANNEL }}-linux-x64
          path: release/linux

      - name: Download Windows desktop artifacts
        if: steps.release_plan.outputs.should_publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bb-desktop-${{ env.RELEASE_CHANNEL }}-windows-x64
          path: release/windows

      - name: Publish desktop release
        if: steps.release_plan.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_plan.outputs.version }}
          PUBLISH_MACOS_BINARIES: ${{ steps.release_plan.outputs.publish_macos_binaries }}
        run: |
          set -euo pipefail

          MACOS_DIR="release/macos"
          LINUX_DIR="release/linux"
          WINDOWS_DIR="release/windows"
          METADATA_PREFIX="latest"
          if [[ "$RELEASE_CHANNEL" == "nightly" ]]; then
            METADATA_PREFIX="nightly"
          fi

          RELEASE_ASSETS=()

          # An unmatched glob would otherwise reach gh as a literal pattern and
          # fail the upload, so each expansion states whether it is required.
          add_required_glob() {
            local matches=("$@")
            if [[ ! -e "${matches[0]}" ]]; then
              echo "::error::No release artifact matched ${matches[0]}."
              exit 1
            fi
            RELEASE_ASSETS+=("${matches[@]}")
          }

          add_optional_glob() {
            local matches=("$@")
            if [[ -e "${matches[0]}" ]]; then
              RELEASE_ASSETS+=("${matches[@]}")
            fi
          }

          # Every platform resets the same moving release, so a single job
          # assembles every asset. Splitting the reset across platform jobs
          # would let whichever finished last delete the others' binaries.
          add_required_glob "$MACOS_DIR/desktop-version.json"
          add_required_glob "$LINUX_DIR/desktop-version-linux.json"
          add_required_glob "$LINUX_DIR/${METADATA_PREFIX}-linux.yml"
          add_required_glob "$LINUX_DIR"/*.AppImage
          # AppImage embeds its block map, so a sidecar file is not guaranteed.
          add_optional_glob "$LINUX_DIR"/*.blockmap
          # The Windows installer runs unsigned behind a SmartScreen warning,
          # so it publishes whether or not signing secrets are configured.
          add_required_glob "$WINDOWS_DIR/desktop-version-windows.json"
          add_required_glob "$WINDOWS_DIR/${METADATA_PREFIX}.yml"
          add_required_glob "$WINDOWS_DIR"/*.exe
          add_required_glob "$WINDOWS_DIR"/*.blockmap

          if [[ "$PUBLISH_MACOS_BINARIES" == "true" ]]; then
            add_required_glob "$MACOS_DIR/${METADATA_PREFIX}-mac.yml"
            add_required_glob "$MACOS_DIR"/*.dmg
            add_required_glob "$MACOS_DIR"/*.zip
            add_required_glob "$MACOS_DIR"/*.blockmap
          else
            echo "Signing/notarization gate is closed; publishing the macOS version feed without macOS binaries."
          fi

          if [[ "$RELEASE_CHANNEL" == "nightly" ]]; then
            MOVING_TAG="desktop-nightly"
            MOVING_TITLE="bb Nightly"
            MOVING_NOTES="Latest automated bb Nightly build from main. Nightly builds may be unstable."
            MOVING_FLAGS=(--prerelease --latest=false)
          else
            VERSION_TAG="desktop-v${VERSION}"
            MOVING_TAG="desktop-latest"
            MOVING_TITLE="bb desktop latest"
            MOVING_NOTES="Latest stable bb desktop release metadata."
            MOVING_FLAGS=(--latest=false)

            if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
              echo "Release $VERSION_TAG already exists; refusing to mutate immutable desktop release."
              exit 1
            fi

            gh release create "$VERSION_TAG" "${RELEASE_ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "bb desktop ${VERSION}" \
              --notes "bb desktop ${VERSION}" \
              --latest
          fi

          git tag -f "$MOVING_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/${MOVING_TAG}"

          if gh release view "$MOVING_TAG" >/dev/null 2>&1; then
            gh release edit "$MOVING_TAG" \
              --target "$GITHUB_SHA" \
              --title "$MOVING_TITLE" \
              --notes "$MOVING_NOTES" \
              "${MOVING_FLAGS[@]}"

            # The moving release keeps its page, but --clobber only replaces
            # assets with matching names. Reset assets in place so versioned
            # binaries cannot accumulate and JSON-only publishes cannot leave
            # stale binaries from an older signed release.
            gh release view "$MOVING_TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset_name; do
              if [[ -n "$asset_name" ]]; then
                gh release delete-asset "$MOVING_TAG" "$asset_name" --yes
              fi
            done

            gh release upload "$MOVING_TAG" "${RELEASE_ASSETS[@]}"
          else
            gh release create "$MOVING_TAG" "${RELEASE_ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "$MOVING_TITLE" \
              --notes "$MOVING_NOTES" \
              "${MOVING_FLAGS[@]}"
          fi

      - name: Summarize
        env:
          HAS_WINDOWS_SIGNING_SECRETS: ${{ needs.windows.outputs.has_signing_secrets }}
          IS_PRERELEASE: ${{ steps.release_plan.outputs.is_prerelease }}
          PUBLISH_MACOS_BINARIES: ${{ steps.release_plan.outputs.publish_macos_binaries }}
          SHOULD_PUBLISH: ${{ steps.release_plan.outputs.should_publish }}
          VERSION: ${{ steps.release_plan.outputs.version }}
        run: |
          release_tag="desktop-latest"
          if [[ "$RELEASE_CHANNEL" == "nightly" ]]; then
            release_tag="desktop-nightly"
          fi

          {
            echo "## bb desktop (${RELEASE_CHANNEL})"
            echo
            echo "- version: ${VERSION}"
            echo "- prerelease version: ${IS_PRERELEASE}"
            echo "- release publication requested and allowed: ${SHOULD_PUBLISH}"
            echo "- macOS release binary upload enabled: ${PUBLISH_MACOS_BINARIES}"
            echo "- Windows installer signed: ${HAS_WINDOWS_SIGNING_SECRETS}"
            echo "- macOS feed URL: https://github.com/get-bb/bb/releases/download/${release_tag}/desktop-version.json"
            echo "- Linux feed URL: https://github.com/get-bb/bb/releases/download/${release_tag}/desktop-version-linux.json"
            echo "- Windows feed URL: https://github.com/get-bb/bb/releases/download/${release_tag}/desktop-version-windows.json"
          } >> "$GITHUB_STEP_SUMMARY"
