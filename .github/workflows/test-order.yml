name: Shuffled test order

on:
  schedule:
    - cron: "41 8 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Vitest shuffle seed; defaults to the run number
        required: false
        type: string

env:
  PRIMARY_NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"

permissions:
  contents: read

concurrency:
  group: test-order
  cancel-in-progress: false

jobs:
  plan:
    name: Select shuffled shards
    if: github.repository == 'get-bb/bb'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      seed: ${{ steps.plan.outputs.seed }}
      tests: ${{ steps.plan.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Choose seed and shards
        id: plan
        env:
          SEED_INPUT: ${{ inputs.seed }}
        run: |
          seed="${SEED_INPUT:-$GITHUB_RUN_NUMBER}"
          if [[ ! "$seed" =~ ^[0-9]+$ ]]; then
            echo "::error::Seed must be a non-negative integer, got '$seed'."
            exit 1
          fi
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "tests=$(node scripts/plan-ci.mjs --full | node -e 'process.stdout.write(JSON.stringify(JSON.parse(require("node:fs").readFileSync(0, "utf8")).tests))')" >> "$GITHUB_OUTPUT"
          echo "Shuffle seed: $seed (commit $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Shuffled tests (${{ matrix.shard }}, seed ${{ needs.plan.outputs.seed }})
    needs: plan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.tests) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace tools
        uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Restore React Compiler cache
        if: ${{ contains(matrix.filter, '--filter=@bb/demo-server') }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-react-compiler

      - name: Restore CI Turbo cache
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-test-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-test-${{ matrix.shard }}-
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Restore pnpm cache
        id: pnpm-cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-pnpm

      - name: Install dependencies
        timeout-minutes: 5
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          PNPM_CACHE_RESTORE_OUTCOME: ${{ steps.pnpm-cache.outcome }}
          APP_SHARD: ${{ startsWith(matrix.shard, 'app-') }}
          DEMO_ONLY: ${{ matrix.filter == '--filter=@bb/demo-server' }}
          MOBILE_TESTS: ${{ matrix.mobile }}
        run: |
          filters=()
          if [[ "$APP_SHARD" == "true" ]]; then
            filters=(--ignore-scripts --filter bb --filter '@bb/app...' --filter '@bb/db...')
          elif [[ "$DEMO_ONLY" == "true" ]]; then
            filters=(--ignore-scripts --filter bb --filter '@bb/demo-server...' --filter '@bb/db...')
          elif [[ "$MOBILE_TESTS" != "true" ]]; then
            filters=(--filter '!@bb/mobile')
          fi
          bash .github/actions/setup-workspace/install-dependencies.sh "${filters[@]}"

      - name: Setup Bun
        if: ${{ startsWith(matrix.shard, 'packages-') || startsWith(matrix.shard, 'plugins-') }}
        timeout-minutes: 4
        uses: ./.github/actions/setup-bun
        with:
          version: "1.3.14"

      - name: Install Electron runtime libraries
        if: ${{ contains(matrix.filter, '--filter=@bb/desktop') }}
        run: |
          bash .github/actions/setup-workspace/install-electron-libraries.sh
          ELECTRON_RUN_AS_NODE=1 pnpm --filter @bb/desktop exec electron --version

      - name: Test in shuffled order
        env:
          BB_CI_TEST_SHARD: ${{ matrix.vitestShard }}
          VITEST_MAX_WORKERS: ${{ (startsWith(matrix.shard, 'server-') || matrix.shard == 'integration') && '4' || '2' }}
        run: ${{ contains(matrix.filter, '--filter=@bb/desktop') && 'xvfb-run -a' || '' }} pnpm exec turbo run test ${{ matrix.filter }} --cache-dir="${TURBO_CACHE_DIR:-.turbo/cache}" --output-logs=new-only --summarize --continue --concurrency=4 -- --sequence.shuffle --sequence.seed=${{ needs.plan.outputs.seed }}

      - name: Describe reproduction
        if: ${{ failure() }}
        env:
          SEED: ${{ needs.plan.outputs.seed }}
          FILTER: ${{ matrix.filter }}
          SHARD: ${{ matrix.vitestShard }}
        run: |
          {
            echo "### Order-dependent failure in ${{ matrix.shard }}"
            echo
            echo "Reproduce at $GITHUB_SHA:"
            echo
            echo '```bash'
            if [[ -n "$SHARD" ]]; then
              echo "BB_CI_TEST_SHARD=$SHARD pnpm exec turbo run test $FILTER -- --sequence.shuffle --sequence.seed=$SEED"
            else
              echo "pnpm exec turbo run test $FILTER -- --sequence.shuffle --sequence.seed=$SEED"
            fi
            echo '```'
            echo
            echo "Failing packages print their Vitest failures above; rerun one package with its own --filter to iterate."
          } >> "$GITHUB_STEP_SUMMARY"
