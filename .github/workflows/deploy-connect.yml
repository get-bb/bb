name: Deploy Connect (upload only)

on:
  push:
    branches:
      - main
    paths:
      - "apps/connect/**"
      - "packages/connect-db/**"
      - "packages/tunnel-contract/**"
  workflow_dispatch:

env:
  NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"

permissions:
  contents: read

# Shared group with deploy-web so the two never run `wrangler d1 migrations
# apply` concurrently against the same prod D1: a parallel double-apply would
# fail on already-applied SQL (e.g. 0005's CREATE TRIGGER). Serializing the
# two workflows makes the second run's migrate step a tracked no-op.
# cancel-in-progress:false so a queued deploy waits rather than being dropped.
concurrency:
  group: connect-db-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload tunnel gate version to Cloudflare Workers
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # Apply any pending connect-db migrations BEFORE the new worker ships so
      # it never queries columns prod D1 doesn't have yet. The d1_migrations
      # tracking table (seeded 2026-07-08 with the previously hand-applied
      # chain) makes this a no-op when nothing is pending.
      - name: Apply connect-db migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @bb/connect exec wrangler d1 migrations apply DB --remote

      # No build step: the gate is a single worker entry (src/worker.ts) and
      # wrangler's esbuild bundles its workspace deps (@bb/connect-db,
      # @bb/tunnel-contract) straight from source. Plain wrangler uses the
      # top-level (production) config -> the bb-connect worker on *.getbb.app.
      # This only uploads a version; it serves no traffic until someone deploys
      # it by hand with `wrangler versions deploy` (docs/connect-gate-rollout.md).
      # BETTER_AUTH_SECRET is set once by hand (it must equal bb-web's) and
      # is intentionally NOT synced from CI.
      - name: Upload tunnel gate version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          subject=$(git log -1 --format=%s | cut -c1-80)
          pnpm --filter @bb/connect exec wrangler versions upload \
            --tag "${GITHUB_SHA::10}" \
            --message "${GITHUB_SHA::10} ${subject}" | tee "$RUNNER_TEMP/upload.log"
          version_id=$(sed -n 's/.*Worker Version ID: \([0-9a-f-]\{36\}\).*/\1/p' "$RUNNER_TEMP/upload.log" | tail -1)
          if [ -z "$version_id" ]; then
            echo "::error::wrangler versions upload did not print a Worker Version ID"
            exit 1
          fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Summarize
        env:
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          {
            echo "### Gate version uploaded, not deployed"
            echo
            echo "Version \`$VERSION_ID\` serves no traffic yet. Deploy it by hand from \`apps/connect\` (docs/connect-gate-rollout.md):"
            echo
            echo "- \`pnpm exec wrangler deployments status\` shows the version serving traffic (\`<old>\`)."
            echo "- \`pnpm exec wrangler versions deploy $VERSION_ID@100% --yes --message \"<what changed>\"\`. Every connected tunnel reconnects once."
            echo "- Roll back with \`pnpm exec wrangler rollback <old> -m \"<reason>\"\`."
          } >> "$GITHUB_STEP_SUMMARY"
