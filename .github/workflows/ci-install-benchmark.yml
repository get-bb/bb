name: CI Install Benchmark
on:
  workflow_dispatch:
  push:
    branches: [bb/ci-two-minutes-thr_3wndicfwc9]
permissions:
  contents: read
jobs:
  windows-install:
    name: Windows install (${{ matrix.install }}, ${{ matrix.copy }})
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        install: [full, app]
        copy: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Install dependencies
        shell: bash
        env:
          INSTALL_MODE: ${{ matrix.install }}
        run: |
          filters=()
          if [[ "$INSTALL_MODE" == "app" ]]; then
            filters=(--filter bb --filter '@bb/app...' --filter '@bb/db...')
          fi
          bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts "${filters[@]}"
      - name: Test app shard
        shell: cmd
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: pnpm exec turbo run test --filter=@bb/app --force --summarize --output-logs=new-only -- --shard=1/4
