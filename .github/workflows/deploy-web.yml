name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/connect-db/**"
  workflow_dispatch:

env:
  NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"

permissions:
  contents: read

# Shared group with deploy-connect so the two never run `wrangler d1 migrations
# apply` concurrently against the same prod D1: a parallel double-apply would
# fail on already-applied SQL (e.g. 0005's CREATE TRIGGER). Serializing the
# two workflows makes the second run's migrate step a tracked no-op.
# cancel-in-progress:false so a queued deploy waits rather than being dropped.
concurrency:
  group: connect-db-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy getbb.app site to Cloudflare Workers
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Turbo task outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-web-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-web-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-web-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # CLOUDFLARE_ENV selects the wrangler env at BUILD time (the
      # @cloudflare/vite-plugin writes the resolved production config to
      # dist/server/wrangler.json; plain `wrangler deploy` follows it).
      - name: Build web (production)
        env:
          CLOUDFLARE_ENV: production
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
        run: pnpm exec turbo run build --filter=@bb/web --cache-dir=.turbo/cache --output-logs=new-only

      - name: Sync marketing analytics secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LANDING_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
        run: |
          if [ -z "$LANDING_POSTHOG_KEY" ]; then
            echo "VITE_POSTHOG_KEY is required for download tracking."
            exit 1
          fi
          printf '%s' "$LANDING_POSTHOG_KEY" | pnpm --filter @bb/web exec wrangler secret put LANDING_POSTHOG_KEY --name bb-web

      - name: Sync email signup secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY is required for the email signup."
            exit 1
          fi
          printf '%s' "$RESEND_API_KEY" | pnpm --filter @bb/web exec wrangler secret put RESEND_API_KEY --name bb-web

      # Apply any pending connect-db migrations BEFORE the new worker ships so
      # it never queries columns prod D1 doesn't have yet. Runs off the gate's
      # wrangler config (which declares migrations_dir); the d1_migrations
      # tracking table makes this a no-op when nothing is pending. If
      # deploy-connect runs concurrently its apply races this one — the loser
      # fails on already-applied SQL and a re-run goes green; prod is fine
      # because the winner applied everything.
      - name: Apply connect-db migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @bb/connect exec wrangler d1 migrations apply DB --remote

      # GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET / BETTER_AUTH_SECRET are set
      # once by hand and intentionally NOT synced from CI.
      - name: Deploy web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @bb/web exec wrangler deploy
