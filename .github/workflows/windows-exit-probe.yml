name: Observe Windows crash cleanup
on:
  push:
    branches: [bb/ci-windows-exit-probe-20261029]
permissions:
  contents: read
jobs:
  observe:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - uses: ./.github/actions/windows-dependency-cache
        timeout-minutes: 1
        continue-on-error: true
      - name: Install dependencies
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts --filter '!@bb/mobile'
      - name: Observe focused and normal-concurrency recovery
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/exit-probe" | Out-Null
          for ($iteration = 1; $iteration -le 20; $iteration++) {
            pnpm exec turbo run test --filter=@bb/integration-tests --concurrency=1 --force -- fake/recovery/active-crash-recovery.test.ts --maxWorkers=1 --silent=false *> "$env:RUNNER_TEMP/exit-probe/focused-$iteration.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          for ($iteration = 1; $iteration -le 5; $iteration++) {
            pnpm exec turbo run test --filter=@bb/integration-tests --concurrency=1 --force -- --maxWorkers=4 --silent=false *> "$env:RUNNER_TEMP/exit-probe/package-$iteration.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-exit-probe
          path: ${{ runner.temp }}/exit-probe/
