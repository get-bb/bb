name: Setup workspace
description: Set up Bun + Node, restore the Turbo cache, and install dependencies.

inputs:
  node-version:
    description: Node version to install
    required: true
  bun-version:
    description: Bun version to install
    required: true
  cache-prefix:
    description: Distinguishes Turbo cache entries per job type (e.g. checks, test-server)
    required: true

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache Turbo task outputs
      uses: actions/cache@v4
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-node-${{ inputs.node-version }}-${{ inputs.cache-prefix }}-turbo-${{ hashFiles('bun.lock') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-node-${{ inputs.node-version }}-${{ inputs.cache-prefix }}-turbo-${{ hashFiles('bun.lock') }}-
          ${{ runner.os }}-node-${{ inputs.node-version }}-${{ inputs.cache-prefix }}-turbo-

    - name: Install dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if bun install --frozen-lockfile; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          echo "::warning::bun install failed on attempt $attempt; retrying"
          sleep $((attempt * 5))
        done
