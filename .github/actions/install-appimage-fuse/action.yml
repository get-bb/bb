name: Install AppImage FUSE runtime
description: Install FUSE from Ubuntu mirrors over HTTPS with bounded network waits and mirror fallback.
inputs:
  package:
    description: FUSE package for the runner's Ubuntu version.
    default: libfuse2
runs:
  using: composite
  steps:
    - shell: bash
      env:
        FUSE_PACKAGE: ${{ inputs.package }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
