name: Setup workspace tools
description: Install pinned pnpm and Node without waiting for optional caches.
inputs:
  node-version:
    required: true
    description: Node version to install
  pnpm-version:
    required: true
    description: Pinned pnpm version
runs:
  using: composite
  steps:
    - name: Set up pnpm
      shell: bash
      env:
        PNPM_VERSION: ${{ inputs.pnpm-version }}
      run: bash .github/actions/setup-workspace/install-pnpm.sh
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
