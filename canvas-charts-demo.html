<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Тестовый канвас · два графика и таблица со случайными данными</title>
<style>
  :root {
    --canvas: #0f1116;
    --card: #171a21;
    --line: #2a2f3a;
    --ink: #e7ecf3;
    --muted: #8b95a7;
    --series-b: #ffb84d;
    --series-c: #57d9a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 18px;
    background: var(--canvas);
    color: var(--ink);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .hint { color: var(--muted); font-size: 12px; }
  button {
    margin-left: auto;
    background: #222735;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 13px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #2b3242; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 12px 6px;
  }
  .card h2 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .plot { position: relative; width: 100%; aspect-ratio: 4 / 3; }
  canvas { display: block; width: 100%; height: 100%; }
  .card.wide { grid-column: 1 / -1; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    padding: 7px 8px;
    text-align: right;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  th:first-child, td:first-child { text-align: left; }
  thead th {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .03em;
    text-transform: uppercase;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #1d2130; }
  .num { font-variant-numeric: tabular-nums; }
  .delta.up { color: var(--series-c); }
  .delta.down { color: #ff8b8b; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border: 1px solid currentColor;
    border-radius: 999px;
    font-size: 11px;
  }
</style>
</head>
<body>
<header>
  <h1>Тестовый канвас</h1>
  <span class="hint">два графика и таблица со случайными данными, Canvas 2D без библиотек</span>
  <button id="regen">Сгенерировать заново</button>
</header>

<div class="grid">
  <section class="card">
    <h2>Столбцы · значения по категориям</h2>
    <div class="plot"><canvas id="bars"></canvas></div>
  </section>
  <section class="card">
    <h2>Точки · корреляция с трендом</h2>
    <div class="plot"><canvas id="scatter"></canvas></div>
  <section class="card wide">
    <h2>Таблица · случайные метрики по категориям</h2>
    <table id="metrics">
      <thead>
        <tr>
          <th scope="col">Категория</th>
          <th scope="col">Значение</th>
          <th scope="col">Δ к прошлому</th>
          <th scope="col">Статус</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</div>

<script>
const COLORS = { ink: "#e7ecf3", muted: "#8b95a7", line: "#2a2f3a", b: "#ffb84d", c: "#57d9a3" };
const PAD = { top: 14, right: 12, bottom: 26, left: 38 };
const FONT = "11px ui-sans-serif, system-ui, sans-serif";

function rand(min, max) { return min + Math.random() * (max - min); }

function gauss() {
  let u = 0;
  let v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function fit(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(1, Math.round(rect.width));
  const h = Math.max(1, Math.round(rect.height));
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}

function frame(ctx, w, h, xTicks, yTicks) {
  const plot = { x: PAD.left, y: PAD.top, w: w - PAD.left - PAD.right, h: h - PAD.top - PAD.bottom };
  ctx.save();
  ctx.font = FONT;
  ctx.lineWidth = 1;
  ctx.strokeStyle = COLORS.line;
  ctx.fillStyle = COLORS.muted;
  ctx.textBaseline = "middle";

  for (let i = 0; i < yTicks.length; i++) {
    const y = Math.round(plot.y + (plot.h * i) / (yTicks.length - 1)) + 0.5;
    ctx.beginPath();
    ctx.moveTo(plot.x, y);
    ctx.lineTo(plot.x + plot.w, y);
    ctx.stroke();
    ctx.textAlign = "right";
    ctx.fillText(yTicks[i], plot.x - 8, y);
  }

  ctx.textBaseline = "top";
  ctx.textAlign = "center";
  const step = plot.w / (xTicks.length - 1);
  for (let i = 0; i < xTicks.length; i++) {
    ctx.fillText(xTicks[i], plot.x + step * i, plot.y + plot.h + 8);
  }
  ctx.restore();
  return plot;
}

function drawBars(canvas) {
  const { ctx, w, h } = fit(canvas);
  const labels = "АБВГДЕЖЗ".split("");
  const values = labels.map(() => rand(10, 100));
  const plot = frame(ctx, w, h, labels, ["100", "50", "0"]);
  const slot = plot.w / labels.length;
  const barW = slot * 0.55;

  for (let i = 0; i < values.length; i++) {
    const barH = (values[i] / 100) * plot.h;
    const x = Math.round(plot.x + slot * i + (slot - barW) / 2) + 0.5;
    const y = plot.y + plot.h - barH;
    const radius = Math.min(5, barW / 2, barH / 2);

    const grad = ctx.createLinearGradient(0, y, 0, plot.y + plot.h);
    grad.addColorStop(0, COLORS.b);
    grad.addColorStop(1, "rgba(255,184,77,.35)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x, y + barH);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.lineTo(x + barW - radius, y);
    ctx.quadraticCurveTo(x + barW, y, x + barW, y + radius);
    ctx.lineTo(x + barW, y + barH);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = COLORS.ink;
    ctx.font = FONT;
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText(Math.round(values[i]), x + barW / 2, y - 4);
  }
}

function drawScatter(canvas) {
  const { ctx, w, h } = fit(canvas);
  const n = 140;
  const plot = frame(ctx, w, h, ["0.0", "0.5", "1.0"], ["1.0", "0.5", "0.0"]);
  const px = (value) => plot.x + plot.w * value;
  const py = (value) => plot.y + plot.h * (1 - value);

  const xs = [];
  const ys = [];
  for (let i = 0; i < n; i++) {
    const x = Math.random();
    const y = Math.min(1, Math.max(0, x * 0.55 + 0.2 + gauss() * 0.1));
    xs.push(x);
    ys.push(y);
    ctx.beginPath();
    ctx.arc(px(x), py(y), 3, 0, Math.PI * 2);
    ctx.fillStyle = i % 5 === 0 ? "rgba(87,217,163,.9)" : "rgba(87,217,163,.45)";
    ctx.fill();
  }

  const mean = (list) => list.reduce((sum, value) => sum + value, 0) / list.length;
  const mx = mean(xs);
  const my = mean(ys);
  const cov = xs.reduce((sum, x, i) => sum + (x - mx) * (ys[i] - my), 0);
  const varX = xs.reduce((sum, x) => sum + (x - mx) ** 2, 0);
  const slope = cov / varX;
  const intercept = my - slope * mx;
  const clamp = (value) => Math.min(1, Math.max(0, value));

  ctx.save();
  ctx.setLineDash([6, 4]);
  ctx.strokeStyle = COLORS.c;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(px(0), py(clamp(intercept)));
  ctx.lineTo(px(1), py(clamp(slope + intercept)));
  ctx.stroke();
  ctx.restore();
}

const CHARTS = [
  ["bars", drawBars],
  ["scatter", drawScatter],
];

const TABLE_ROWS = ["Поиск", "Каталог", "Корзина", "Оплата", "Доставка", "Профиль"];
const STATUSES = [
  { label: "норма", color: "#57d9a3" },
  { label: "внимание", color: "#ffb84d" },
  { label: "риск", color: "#ff8b8b" },
];

function cell(text, className) {
  const td = document.createElement("td");
  td.textContent = text;
  if (className) td.className = className;
  return td;
}

function renderTable() {
  const rows = TABLE_ROWS.map((name) => {
    const tr = document.createElement("tr");
    const value = Math.round(rand(120, 9800));
    const delta = rand(-12, 12);
    const status = STATUSES[Math.floor(Math.random() * STATUSES.length)];

    const deltaText = (delta >= 0 ? "+" : "−") + Math.abs(delta).toFixed(1) + "%";
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.style.color = status.color;
    badge.textContent = status.label;
    const statusCell = document.createElement("td");
    statusCell.appendChild(badge);

    tr.append(
      cell(name),
      cell(value.toLocaleString("ru-RU"), "num"),
      cell(deltaText, "num delta " + (delta >= 0 ? "up" : "down")),
      statusCell,
    );
    return tr;
  });

  document.querySelector("#metrics tbody").replaceChildren(...rows);
}

function renderAll() {
  for (const [id, draw] of CHARTS) draw(document.getElementById(id));
  renderTable();
}

let raf = 0;
function schedule() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(renderAll);
}

document.getElementById("regen").addEventListener("click", renderAll);
new ResizeObserver(schedule).observe(document.querySelector(".grid"));
window.addEventListener("resize", schedule);
renderAll();
</script>
</body>
</html>
