        "200": { description: "Hardening-scored systemd units + histogram (relayed verbatim from STP).", content: { application/json: { schema: { $ref: "#/components/schemas/SecAssessSystemdUnitsResponse" } } } }
        "404": { description: "`code`: PROJECT_VERSION_NOT_FOUND / SCAN_NOT_FOUND / NO_FILESYSTEM_SCAN.", content: { application/json: { schema: { $ref: "#/components/schemas/StpRelayErrorResponse" } } } }
        "400": { description: "`code`: INVALID_PROJECT_VERSION_ID / INVALID_SCAN_ID.", content: { application/json: { schema: { $ref: "#/components/schemas/StpRelayErrorResponse" } } } }
        "502": { description: "`code`: STP_UPSTREAM_ERROR.", content: { application/json: { schema: { $ref: "#/components/schemas/StpRelayErrorResponse" } } } }
  /public/v0/projects/versions/{projectVersionId}/security-assessment/architecture:
    get:
      description: |
        CPU architecture profile for the version's firmware: a count per architecture across the
        analyzed binaries (ELF/PE machine types) plus, where STP detects them, firmware blobs
        (e.g. bare-metal ARM Cortex-M). Requires findings-read (non-sensitive device-context
        metadata); fsan/org resolved server-side. Relayed verbatim from STP.
      tags: [ securityAssessment ]
      operationId: getSecurityAssessmentArchitecture
      parameters:
        - { name: projectVersionId, in: path, required: true, schema: { type: string } }
        - { name: scanId, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "Per-architecture counts (relayed verbatim from STP).", content: { application/json: { schema: { $ref: "#/components/schemas/SecAssessArchitectureResponse" } } } }
        "404": { description: "`code`: PROJECT_VERSION_NOT_FOUND / SCAN_NOT_FOUND / NO_FILESYSTEM_SCAN.", content: { application/json: { schema: { $ref: "#/components/schemas/StpRelayErrorResponse" } } } }
        "400": { description: "`code`: INVALID_PROJECT_VERSION_ID / INVALID_SCAN_ID.", content: { application/json: { schema: { $ref: "#/components/schemas/StpRelayErrorResponse" } } } }
        "502": { description: "`code`: STP_UPSTREAM_ERROR.", content: { application/json: { schema: { $ref: "#/components/schemas/StpRelayErrorResponse" } } } }
  /public/v0/projects/versions/{projectVersionId}/security-assessment/architecture-breakdown:
    get:
      description: |
        Per-architecture breakdown for the version's firmware: one row per detected architecture with
        decoder/ISA detail (header/EM codes, instruction set + variant, word size, instruction bits,
        endianness) plus the source and count. Requires findings-read (non-sensitive device-context
        metadata); fsan/org resolved server-side. Relayed verbatim from STP.
      tags: [ securityAssessment ]
      operationId: getSecurityAssessmentArchitectureBreakdown
      parameters:
        - { name: projectVersionId, in: path, required: true, schema: { type: string } }
        - { name: scanId, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "Per-architecture breakdown rows (relayed verbatim from STP).", content: { application/json: { schema: { $ref: "#/components/schemas/SecAssessArchitectureBreakdownResponse" } } } }
        "404": { description: "`code`: PROJECT_VERSION_NOT_FOUND / SCAN_NOT_FOUND / NO_FILESYSTEM_SCAN.", content: { application/json: { schema: { $ref: "#/components/schemas/StpRelayErrorResponse" } } } }
        "400": { description: "`code`: INVALID_PROJECT_VERSION_ID / INVALID_SCAN_ID.", content: { application/json: { schema: { $ref: "#/components/schemas/StpRelayErrorResponse" } } } }
        "502": { description: "`code`: STP_UPSTREAM_ERROR.", content: { application/json: { schema: { $ref: "#/components/schemas/StpRelayErrorResponse" } } } }
  /public/v0/sboms/cyclonedx/{projectVersionId}:
    get:
      description: |
        Get an SBOM for a version in a CycloneDX format, including all project dependencies in the dependency tree.
        This endpoint enforces strict access control, requiring VIEW_PROJECT permission for all projects in the dependency tree.
      tags: [ sboms ]
      operationId: getSbomCdx
      parameters:
        - name: projectVersionId
          description: Get the SBOM for the version specified by the projectVersionId.
          in: path
          required: true
          schema:
            type: string
        - name: includeVex
          description: Whether to include VEX (Vulnerability Exploitability Exchange) data in the SBOM export
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: includeFiles
          description: >-
            Whether to include file components in the CycloneDX output. File-type components
            appear as regular components with type "file". When omitted, the project-level
            default setting is used (disabled by default).
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: The SBOM was successfully created and returned in the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbomCdx"
        '403':
          description: Access denied - user lacks VIEW_PROJECT permission for one or more projects in the dependency tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        '404':
          description: The version specified by the projectVersionId could not be found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "400":
          description: Invalid projectVersionId format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "503":
          description: SBOM export queue is full. Please try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/sboms/spdx/{projectVersionId}:
    get:
      description: Get an SBOM for a version in a SPDX format.
      tags: [ sboms ]
      operationId: getSbomSpdx
      parameters:
        - name: projectVersionId
          description: Get the SBOM for the version specified by the projectVersionId.
          in: path
          required: true
          schema:
            type: string
        - name: includeVex
          description: Whether to include VEX (Vulnerability Exploitability Exchange) data in the SBOM export
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: includeFiles
          description: >-
            Whether to include file components in the SPDX output. When true, file-type
            components are emitted in the SPDX files array with cryptographic hashes and
            CONTAINS relationships to their parent packages. When omitted, the project-level
            default setting is used (disabled by default).
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: The SBOM was successfully created and returned in the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbomSpdx"
        "404":
          description: The version specified by the projectVersionId could not be found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "400":
          description: Invalid projectVersionId format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "503":
          description: SBOM export queue is full. Please try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/scans:
    get:
      summary: Get scan status information
      tags: [ scans ]
      operationId: getScansV0
      description: |
        Retrieves the status and details of scans for the authenticated user.
        This endpoint provides information about all scans associated with the user's account,
        including scan types, status, and timestamps.

      parameters:
        - name: filter
          description: |
            Filter applied to the scans to be returned.
            The supported filter attributes are:
            - `project` - the unique ID of the project to which the scan belongs, e.g. 2345678901234567891
            - `projectVersion` - the unique ID of the project version to which the scan belongs, e.g. 3456789012345678912
            - `type` - the type of scan, e.g. SCA, SAST, CONFIG, SOURCE_SCA, SBOM_IMPORT, VULNERABILITY_ANALYSIS, etc.
            - `status` - the status of the scan, e.g. INITIAL, COMPLETED, ERROR, STARTED, NOT_APPLICABLE
            - See the Filtering section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: string
        - name: sort
          description: |
            Sort ordering applied to the scans to be returned.
            The allowed sort values are specified in this parameter's enumeration.
            See the Sorting section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: string
            enum: [
              "created:asc",
              "created:desc",
              "completed:asc",
              "completed:desc"
            ]
        - name: offset
          in: query
          description: The number of items to skip before starting to collect the result set
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          description: The number of items to return
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            maximum: 100
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScanV0'
        '400':
          description: This request failed to validate against this specification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        '404':
          description: The request's path is not valid
    post:
      description: Upload and scan a binary file to a specified branch version.
      tags: [ scans ]
      operationId: uploadBinaryScan
      parameters:
        - name: type
          description: |
            Specifies the type/s of binary scan to perform on the binary file.
            - sca: Binary SCA scans are responsible for generating an SBOM as a CycloneDX JSON document.
            - sast: Binary SAST scans detect previously-unknown issues in binary files, such as potential buffer overflows or binary-specific configuration issues.
            - config: Configuration Analysis scans generate findings based on configuration issues like hardcoded passwords or cryptographic materials.
            - python: Python SAST scans use Bandit to detect security issues in any Python source files found within the uploaded binary.
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
              enum: [ "sca", "sast", "config", "python", "vulnerability_analysis" ]
        - name: filename
          description: The name of the uploaded file
          in: query
          required: true
          schema:
            type: string
            pattern: "^[a-zA-Z0-9. -_()]{1,60}$"
        - name: projectVersionId
          description: |
            Uploads and performs a binary scan for the version specified by the projectVersionId.
          in: query
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: |
            The scan was successfully uploaded and is being processed.
            Check back later for scan results.
        "400":
          description: This request has invalid parameters or data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        '404':
          description: The resources specified by this request's projectId, branchId, or projectVersionId could not be found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
