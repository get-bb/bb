          nullable: true
          description: Information about the component that was replaced by this component. Only present when this component has replacementStatus of REPLACING.
        tracker:
          $ref: "#/components/schemas/TrackerInfo"
          nullable: true
          description: Tracker integration information for this component. Only present when tracker workspace is enabled.
        softwareIdentifiers:
          nullable: true
          description: Canonical software identifiers (PURL, CPEs) for this component. Null when no identifiers are available.
          allOf:
            - $ref: "#/components/schemas/SoftwareIdentifiersV0"
