  /public/v0/versions/{projectVersionId}/findings:
    get:
      summary: Get findings for a project version
      description: Returns a paginated list of findings for the specified version.
      operationId: "getFindingsForVersion"
      tags: [ versions ]
      parameters:
        - name: projectVersionId
          in: path
          required: true
          schema:
            type: string
        - name: type
          description: |
            Restrict results to a specific finding type.
            - `cve`: Only CVE findings (NTIA compliant)
            - `sast`: Binary/SAST findings (non-NTIA, non-third-party)
            - If omitted, returns all finding types.
          in: query
          required: false
          schema:
            type: string
        - name: filter
          in: query
          required: false
          schema:
            type: string
          description: |
            RSQL filter expression applied to findings. Supported attributes:
            - `findingId` - the CVE or finding identifier (supports `ilike` and `nilike` for pattern matching)
            - `title` - case-insensitive text match against the rendered finding title for SAST findings and against the finding ID for CVE findings, e.g. `title=ilike=*calloc*`
            - `severity` - severity level: `critical`, `high`, `medium`, `low`, `none`
            - `status` - VEX state: `NO_STATUS`, `NOT_AFFECTED`, `FALSE_POSITIVE`, `IN_TRIAGE`, `RESOLVED_WITH_PEDIGREE`, `RESOLVED`, `EXPLOITABLE`
            - `category` - finding category: `CVE`, `CREDENTIALS`, `CONFIG_ISSUES`, `CRYPTO_MATERIAL`, `SAST_ANALYSIS`
            - `policy` - policy type: `warnings`, `violations`
            - `exploit` - exploit facets (e.g., `exploit==weaponized`). Special value `exploit==NO_KNOWN_EXPLOITS` filters for findings without any exploit information.
            - `affected` - version component ID to filter by affected component
            - `reachabilityScore` - numeric reachability score (supports `>`, `<`, `==` operators)
            - `detected` - detection date (supports `ge`, `le`, `<`, `>` operators)
        - name: sort
          in: query
          required: false
          description: |
            Sort ordering for findings. Format: `field:direction` where direction is `asc` or `desc`.
            Supported sort fields: `cveId`, `severity`, `policy`, `risk`, `componentId`, `reachabilityScore`, `created`, `status`.
          schema:
            type: string
            default: risk:desc
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of findings
          headers:
            X-Total-Count:
              description: Total number of findings matching the filter criteria
              schema:
                type: integer
            X-Per-Page:
              description: Number of findings per page
              schema:
                type: integer
            X-Page:
              description: Current page number (1-based)
              schema:
                type: integer
            X-Total-Pages:
              description: Total number of pages
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VersionFindingListEntry"
        "400":
          description: Invalid projectVersionId format
        "404":
          description: Version not found
  /public/v0/versions/{projectVersionId}/findings/export:
    get:
      summary: Export CVE findings of a project version as CSV
      description: |
        Streams a CSV file containing the CVE findings of the specified project version,
        one row per finding. The export uses keyset pagination internally so peak memory
        and connection time are bounded regardless of the total number of findings,
        replacing the prior client-side CSV assembly that could hang for large versions.

        Output integrity: the body ends with a footer line of the form
        `# rows_written=N rows_skipped=M\r\n`. Clients SHOULD verify that this line is
        present before treating the file as complete — the HTTP status is already 200
        by the time the response body starts streaming, so a mid-stream failure cannot
        be expressed via status code, only by an absent footer.

        Concurrency: the server caps simultaneous findings exports. When the cap is
        reached the response is `503 Service Unavailable` and the client should retry
        after a backoff, mirroring the existing SBOM export behavior.
      operationId: "exportFindingsForVersion"
      tags: [ versions ]
      parameters:
        - name: projectVersionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CSV body containing one row per finding.
          headers:
            Content-Disposition:
              description: Filename hint for the browser download.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid projectVersionId format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "403":
          description: The user does not have permission to view findings for this project version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "404":
          description: Version not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "503":
          description: Findings export queue is full. Retry after a short backoff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/versions/{projectVersionId}/product-findings:
    get:
      summary: Get findings across a product version's transitive dependency tree
      description: |
        Returns a paginated list of findings aggregated across the full transitive
        dependency tree of the specified product version. For non-product versions
        (versions without dependencies), behaves identically to the single-version
        findings endpoint.

        The response contract is the same as `/public/v0/versions/{projectVersionId}/findings`.
        The `X-Total-Count` header reflects the rollup finding count weighted by
        dependency path multiplicity (diamond-graph dependencies are counted once per path).
      operationId: "getProductFindings"
      tags: [ versions ]
      parameters:
        - name: projectVersionId
          in: path
          required: true
          schema:
            type: string
        - name: type
          description: |
            Restrict results to a specific finding type.
            - `cve`: Only CVE findings (NTIA compliant)
            - `sast`: Binary/SAST findings (non-NTIA, non-third-party)
            - If omitted, returns all finding types.
          in: query
          required: false
          schema:
            type: string
        - name: filter
          in: query
          required: false
          schema:
            type: string
          description: |
            RSQL filter expression applied to findings. Supported attributes:
            - `findingId` - the CVE or finding identifier (supports `ilike` and `nilike` for pattern matching)
            - `severity` - severity level: `critical`, `high`, `medium`, `low`, `none`
            - `status` - VEX state: `NO_STATUS`, `NOT_AFFECTED`, `FALSE_POSITIVE`, `IN_TRIAGE`, `RESOLVED_WITH_PEDIGREE`, `RESOLVED`, `EXPLOITABLE`
            - `category` - finding category: `CVE`, `CREDENTIALS`, `CONFIG_ISSUES`, `CRYPTO_MATERIAL`, `SAST_ANALYSIS`
            - `policy` - policy type: `warnings`, `violations`
            - `exploit` - exploit facets (e.g., `exploit==weaponized`). Special value `exploit==NO_KNOWN_EXPLOITS` filters for findings without any exploit information.
            - `affected` - version component ID to filter by affected component
            - `reachabilityScore` - numeric reachability score (supports `>`, `<`, `==` operators)
            - `detected` - detection date (supports `ge`, `le`, `<`, `>` operators)
            - `dependencyPath` - human-readable dependency path string (supports `==`, `!=`, `=ilike=`, `=nilike=`, `=like=`, `=nlike=`)
        - name: sort
          in: query
          required: false
          description: |
            Sort ordering for findings. Format: `field:direction` where direction is `asc` or `desc`.
            Supported sort fields: `cveId`, `severity`, `policy`, `risk`, `componentId`, `reachabilityScore`, `created`, `status`, `dependencyPath`.
          schema:
            type: string
            default: risk:desc
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of findings across the product's dependency tree
          headers:
            X-Total-Count:
              description: Total number of findings (weighted by dependency path multiplicity)
              schema:
                type: integer
            X-Per-Page:
              description: Number of findings per page
              schema:
                type: integer
            X-Page:
              description: Current page number (1-based)
              schema:
                type: integer
            X-Total-Pages:
              description: Total number of pages
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VersionFindingListEntry"
        "400":
          description: Invalid projectVersionId format
        "404":
          description: Version not found
  /public/v0/versions/{projectVersionId}/product-components:
    get:
      summary: Get product component view for a project version
      description: |
        Returns a paginated mixed-type list of components and project dependency rows
        across a Product's transitive dependency tree. Only available for Product versions.
        Each row includes a `dependencyPath` showing the traversal path from the root Product,
        a `relation` indicating Direct or Indirect, and an `objectType` discriminator.
        Component rows carry the full set of fields from `/public/v0/components`; Project rows
        leave component-specific fields null.

        **Filtering:**
        The supported filter attributes are:
        - `objectType` - filter by row type: `Component` or `Project`
        - `relation` - filter by relation: `Direct` or `Indirect`
        - `dependencyPath` - partial match filter on the dependency path string
        - `name` - the component name, e.g. `name==log4j`
        - `version` - the component version, e.g. `version==1.2.17`. Use `version==null` to return components without a version and `version!=null` to return only components with a version value.
        - `created` - the UTC formatted time the component was created, e.g. `2025-02-25T14:23:00`
        - `type` - the component's type, e.g. library, application, firmware, etc.
        - `warnings` - number of policy warnings associated with the component
        - `violations` - number of policy violations associated with the component
        - `status` - the component's status, e.g. NEEDS_REVIEW, IN_REVIEW, CONFIRMED, FALSE_POSITIVE, UNKNOWN
        - `severity` - filter by vulnerability severity derived from highest risk score; allowed values: CRITICAL, HIGH, MEDIUM, LOW (e.g., `severity=in=(CRITICAL,HIGH)`)
        - `source` - filter by component origin source membership (e.g., `source==cyclonedx`)
        - `license` - filter by license expression or `NO_LICENSE` (e.g., `license==NO_LICENSE`, `license==MIT`)
        - `componentPolicy` - filter by component age policy, values: WARNING, VIOLATION (company policy thresholds)
        - `licensePolicy` - filter by license policy state, values: WARNING, VIOLATION
        - `ntia` - filter by NTIA compliance (boolean); true for NTIA-compliant components
        - `isEol` - filter by end-of-life status based on global component EOL date (e.g., `isEol==true`)
        - `edited` - filter components with user overrides; `edited==true` returns edited components, `edited==false` returns unedited

        **Sorting:**
        Supported sort fields include all `/public/v0/components` sort fields plus `dependencyPath`, `relation`, `objectType`.
      operationId: "getProductComponents"
      tags: [ versions ]
      parameters:
        - name: projectVersionId
          in: path
          required: true
          schema:
            type: string
        - name: filter
          description: |
            Filter applied to the product components to be returned.
            The supported filter attributes are listed in the endpoint description.
          in: query
          required: false
          schema:
            type: string
        - name: excluded
          description: |
            If true, returns excluded components. If false, returns non-excluded components.
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: sort
          description: |
            Sort ordering applied to the results.
            The allowed sort values are specified in this parameter's enumeration.
          in: query
          required: false
          schema:
            type: string
            default: "dependencyPath:asc"
            enum: [
              "dependencyPath:asc",
              "dependencyPath:desc",
              "relation:asc",
              "relation:desc",
              "objectType:asc",
              "objectType:desc",
              "name:asc",
              "name:desc",
              "version:asc",
              "version:desc",
              "date:asc",
              "date:desc",
              "releaseDate:asc",
              "releaseDate:desc",
              "created:asc",
              "created:desc",
              "type:asc",
              "type:desc",
              "warnings:asc",
              "warnings:desc",
              "violations:asc",
              "violations:desc",
              "status:asc",
              "status:desc",
              "vulnCount:asc",
              "vulnCount:desc",
              "policy:asc",
              "policy:desc",
              "supplier:asc",
              "supplier:desc",
              "license:asc",
              "license:desc",
              "source:asc",
              "source:desc"
            ]
        - name: offset
          description: |
            The number of items to skip before returning results.
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          description: |
            The maximum number of items to return.
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: editStatus
          description: |
            Optional filter controlling edited status; use `edited`, `unedited`, or omit for any.
          in: query
          required: false
          schema:
            type: string
            enum: ["any", "edited", "unedited"]
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductComponentV0"
        "400":
          description: Invalid projectVersionId format or version is not a Product
        "404":
          description: Version not found or feature not enabled
  /public/v0/project-versions/{projectVersionId}/dependencies:
    get:
      description: Get the list of project dependencies for the version specified by the projectVersionId
      tags: [ projects ]
      operationId: getProjectDependenciesV0
      parameters:
        - name: projectVersionId
          description: The project version's unique identifier.
          in: path
          required: true
          schema:
            type: string
        - name: filter
          description: |
            Filter applied to the dependencies to be returned.
            The supported filter attributes are:
            - `dependencyId` - the ID of the dependency project
            - `dependencyName` - the name of the dependency project
            - `dependencyVersion` - the version of the dependency project
            - `relationshipType` - the type of SPDX dependency relationship
            - `carryForward` - whether the dependency should be carried forward to new versions
            - `createdAt` - the UTC formatted time the dependency was created, e.g. `2025-02-25T14:23:00`
            - `createdBy` - the dependency creator's email, e.g. `dev@awesome.com`
            - `components` - number of components in the dependency project version
            - `findings` - number of findings in the dependency project version
            - `violations` - number of policy violations in the dependency project version
            - `warnings` - number of policy warnings in the dependency project version
            - See the Filtering section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: string
        - name: sort
          description: |
            Sort ordering applied to the dependencies to be returned.
            The allowed sort values are specified in this parameter's enumeration.
            See the Sorting section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: string
            enum: [
              "createdAt:asc",
              "createdAt:desc",
              "createdBy:asc",
              "createdBy:desc",
