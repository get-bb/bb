    ComponentDependencyTreeV0Response:
      type: object
      description: "Response containing dependency tree nodes for navigation."
      properties:
        dependencies:
          type: array
          description: "List of dependency nodes at the requested level of the tree."
          items:
            $ref: "#/components/schemas/ComponentDependencyNodeV0"
        hasMore:
          type: boolean
          description: |
            Indicates whether there are more items available beyond the current page.
            When true, the client can request the next page by incrementing the offset.
            This enables infinite scroll functionality in the UI.
          example: true
    ComponentDependencyNodeV0:
      type: object
      description: |
        A node in the component dependency tree with violation and warning counts.
        
        Counts are provided at two levels:
        - Direct counts: The violations/warnings associated only with this node's VersionComponent.
        - Subtree counts: The total violations/warnings for all nodes in the subtree rooted at this
          node, including the node itself. This is useful for understanding the aggregate risk of a
          dependency and all its transitive dependencies.
      properties:
        name:
          type: string
          description: "The component name from GlobalComponent."
          example: "org.apache.logging.log4j/log4j-core"
        version:
          type: string
          nullable: true
          description: "The component version from GlobalComponent. May be null if version is unknown."
          example: "2.17.2"
        profCompId:
          type: string
          nullable: true
          description: "The ProfileComponent ID for navigating to this node's children."
          example: "123456789"
        versionComponentId:
          type: string
          nullable: true
          description: "The VersionComponent ID for opening component details in the UI."
          example: "987654321"
        children:
          $ref: "#/components/schemas/ComponentDependencyChildrenCountV0"
        directViolations:
          type: integer
          description: |
            The count of violations associated with this node's VersionComponent only.
            Does not include violations from child dependencies.
          example: 2
        directWarnings:
          type: integer
          description: |
            The count of warnings associated with this node's VersionComponent only.
            Does not include warnings from child dependencies.
          example: 5
        subtreeViolations:
          type: integer
          description: |
            The total count of violations for all nodes in the subtree rooted at this node,
            including the node itself. This represents the aggregate violation count for this
            dependency and all its transitive dependencies.
          example: 10
        subtreeWarnings:
          type: integer
          description: |
            The total count of warnings for all nodes in the subtree rooted at this node,
            including the node itself. This represents the aggregate warning count for this
            dependency and all its transitive dependencies.
          example: 25
        subtreeViolationComponentsCount:
          type: integer
          description: |
            The count of components with violations > 0 in the subtree rooted at this node.
            This counts the number of distinct components that have at least one violation,
            rather than summing the total violations.
          example: 3
        subtreeWarningOnlyComponentsCount:
          type: integer
          description: |
            The count of components with warnings > 0 but no violations in the subtree rooted
            at this node. This counts components where violations == 0 AND warnings > 0.
          example: 5
    ComponentDependencyChildrenCountV0:
      type: object
      description: "Count of children for a dependency node."
      properties:
        count:
          type: integer
          description: "The number of child dependencies for this node."
          example: 3
    ComponentDependencyNodeSummariesV0Response:
      type: object
      description: "Response containing vulnerability summaries for requested ProfileComponent IDs."
      properties:
        summaries:
          type: object
          description: |
            Map from ProfileComponent ID (as string) to its vulnerability summary.
            Keys are the profCompId values from the request.
          additionalProperties:
            $ref: "#/components/schemas/ComponentDependencyNodeSummaryV0"
    ComponentDependencyNodeSummaryV0:
      type: object
      description: "Vulnerability summary for a single node including direct and subtree counts."
      properties:
        directViolations:
