        releaseType:
          description: Specifies the new version's release type.
          type: string
          enum: ["RELEASE", "PRE-RELEASE"]
          example: release
        lifecycles:
          type: array
          items:
            $ref: '#/components/schemas/LifecycleV0'
      required:
        - version
        - releaseType
    FindingV0:
      type: object
      description: Finding for a software component.
      properties:
        component:
          $ref: '#/components/schemas/ComponentRef'
        cwes:
          type: array
          items:
            type: string
          description: List of Common Weakness Enumeration (CWE) identifiers that describe the type of vulnerability.
          example:
            - "CWE-770"
        description:
          type: string
          nullable: true
          description: >
            Human-readable description of the vulnerability. When available, this is populated from the CycloneDX
            vulnerability details (cdx.detail). For legacy scans that do not include CDX data, this falls back to
            the stored description in VersionFindingDetails. May be empty or null if no description is available.
            Only populated when includeAdditionalDetails=true.
        detected:
          type: string
          format: date-time
          description: Timestamp when the finding was detected.
          example: "2025-02-25T14:23:00Z"
        epssPercentile:
          type: number
          nullable: true
          description: >
            Percentile score from the Exploit Prediction Scoring System (EPSS). This value may be null if data is unavailable.
          example: null
        epssScore:
          type: number
          nullable: true
          description: >
            EPSS score indicating the likelihood of exploitation for the vulnerability. May be null if not provided.
          example: null
        epssWeightedRisk:
          type: number
          format: float
          nullable: true
          description: >-
            EPSS-weighted risk score on a 0-10 scale.
            Computed as ROUND((risk * 0.1) * epssPercentile, 1).
            Falls back to CVSS base score when EPSS data is unavailable.
        epssWeightedSeverity:
          type: string
          nullable: true
          description: >-
            Severity band derived from the EPSS-weighted risk score.
          enum:
            - CRITICAL
            - HIGH
            - MEDIUM
            - LOW
            - UNKNOWN
        exploitMaturity:
          type: string
          nullable: true
          description: >
            Maturity level of known exploits for this CVE, sourced from SIP as max_exploit_maturity. Examples: "poc", "weaponized".
        cveReferences:
          type: array
          items:
            type: string
            format: uri
          nullable: true
          description: >
            List of reference URLs associated with the CVE (advisories, exploits, etc.).
        comments:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
                description: The comment text
              author:
                type: string
                description: Username of the comment author
              date:
                type: string
                format: date-time
                description: Timestamp when the comment was created
            required:
              - text
              - author
              - date
          nullable: true
          description: >
            List of comments associated with the finding. Only populated when includeComments=true.
          example:
            - text: "Investigating this vulnerability"
              author: "J. Smith"
              date: "2025-10-06T12:48:30.123Z"
        reason:
          type: string
          nullable: true
          description: >
            VEX status reason explaining the status change. Always included in the response.
          example: "Resolved after code review"
        dataSources:
          type: array
          items:
            type: string
          nullable: true
          description: >
            Array showing finding origin path. First element is original source 
            (any ScanType value like CYCLONEDX, SPDX, BLACKDUCK_API, SNYK, or 
            SIP_ENRICHMENT/FS_ENRICHMENT). If propagated, ends with PROPAGATED.
          example: ["BLACKDUCK_API", "PROPAGATED"]
        originalDataSource:
          type: string
          nullable: true
          description: >
            The original source where this finding was first discovered.
            This is the first element of the dataSources array.
          example: "BLACKDUCK_API"
        propagated:
          type: boolean
          description: >
            Indicates whether this finding was copied from a previous version.
          example: false
        exploitInfo:
          type: array
          items:
            type: string
          description: List exploit attributes associated with the finding.
          example: []
        findingId:
          type: string
          description: > 
            Common finding identifier that depends on the type of finding, for an example a CVE identifier.
          example: "CVE-2022-22950"
        id:
          type: string
          description: Unique finding identifier.
          example: "123456789012345678"
        inKev:
          type: boolean
          description: >
            Indicates whether the finding is part of the Known Exploited Vulnerabilities (KEV) list.
          example: false
        inVcKev:
          type: boolean
          description: >
            Indicates whether the finding is included in a specific vulnerability collection (VC KEV).
          example: false
        location:
          type: string
          description: >
            Short identifier or location reference for the component associated with the vulnerability.
          example: "spring-expression"
        risk:
          type: number
          description: >
            Numerical risk score assigned to the vulnerability.
          example: 65
        severity:
          type: string
          description: >
            Qualitative severity level of the finding.
            The list of severities are: "critical", "high", "medium", "low", "none", "info"
          example: "medium"
        status:
          type: string
          nullable: true
          description: VEX state assigned to finding.
          enum: [ "NOT_AFFECTED", "FALSE_POSITIVE", "IN_TRIAGE", "RESOLVED_WITH_PEDIGREE", "RESOLVED", "EXPLOITABLE" ]
          example: "EXPLOITABLE"
        justification:
          type: string
          nullable: true
          description: Justification for the status change.
          enum: [ "CODE_NOT_PRESENT", "CODE_NOT_REACHABLE", "REQUIRES_CONFIGURATION", "REQUIRES_DEPENDENCY", "REQUIRES_ENVIRONMENT",
              "PROTECTED_BY_COMPILER", "PROTECTED_AT_RUNTIME", "PROTECTED_AT_PERIMETER", "PROTECTED_BY_MITIGATING_CONTROL" ]
          example: "CODE_NOT_REACHABLE"
        response:
          type: string
          nullable: true
          description: The response action taken for the finding.
          enum: [ "CAN_NOT_FIX", "WILL_NOT_FIX", "UPDATE", "ROLLBACK", "WORKAROUND_AVAILABLE" ]
          example: "UPDATE"
        title:
          type: string
          description: The finding's descriptive title.
          example: "CVE-2022-22950 - org.springframework/spring-expression@4.1.6.RELEASE"
        type:
          type: string
          description: Type of the vulnerability (e.g., "cve").
        tracker:
          $ref: "#/components/schemas/TrackerInfo"
          nullable: true
          description: Tracker integration information for this finding. Only present when tracker workspace is enabled.
          example: "cve"
        violations:
          type: integer
          description: Count of policy violations related to the finding.
          example: 0
        warnings:
          type: integer
          description: Count of policy warnings associated with the finding.
          example: 2
        vulnInDataset:
          type: boolean
          nullable: true
          description: Indicates whether the vulnerability is present in the dataset.
          example: true
        reachabilityScore:
          type: number
          description: |
            A unitless prioritization score that indicates the relative importance of addressing this vulnerability.
            The score can be positive, negative, or zero, where:
            - Positive values indicate higher priority vulnerabilities that should be addressed sooner
            - Negative values indicate lower priority vulnerabilities that can be addressed later
            - Zero indicates neutral priority
            The score is calculated based on various factors such as code reachability, exploitability, and impact.
          example: 0.75
        attackVector:
          type: string
          description: The attack vector associated with the vulnerability, if available. Examples include "NETWORK", "ADJACENT", "LOCAL", "PHYSICAL".
          example: "NETWORK"
        factors:
          type: array
          description: List of factors that contributed to the reachability score.
          items:
            type: object
            properties:
              entity_type:
                type: string
                description: Type of the entity being analyzed (e.g. vuln_func, kernel_module, vuln_id)
                example: "vuln_func"
              entity_name:
                type: string
                description: Name of the relevant entity (e.g. vuln_func_1)
                example: "vuln_func_1"
              summary:
                type: string
                description: Short summary of the factor
                example: "Function is directly called from main"
              details:
                type: object
                description: Free-form dictionary with key/values that help provide more context
                additionalProperties: true
                example: {
                  "call_depth": 1,
                  "call_type": "direct",
                  "source_file": "main.c"
                }
              score_change:
                type: number
                description: Positive, negative, or zero value that this factor contributes to the overall score
                example: 0.5
            required:
              - entity_type
              - entity_name
              - summary
              - score_change
          example: [
            {
              "entity_type": "vuln_func",
              "entity_name": "vuln_func_1",
              "summary": "Function is directly called from main",
              "details": {
                "call_depth": 1,
                "call_type": "direct",
                "source_file": "main.c"
              },
              "score_change": 0.5
            },
            {
              "entity_type": "kernel_module",
              "entity_name": "module_1",
              "summary": "Module is loaded at runtime",
              "details": {
                "load_type": "dynamic",
                "dependencies": ["core"]
              },
              "score_change": 0.25
            }
          ]
        remediation:
          type: string
          nullable: true
          description: >
            Remediation guidance for the vulnerability. This field contains recommended actions
            to address the vulnerability, sourced from BDCR (Black Duck Component Report) or
            other security analysis tools. May be null if no remediation guidance is available.
          example: "Upgrade to version 2.0.0 or later"
        mitigation:
          type: string
          nullable: true
          description: >
            Mitigation or workaround information for the vulnerability. This field contains
            temporary measures that can reduce risk without fully remediating the vulnerability,
            sourced from BDCR or other security analysis tools. May be null if no mitigation
            is available.
          example: "Disable the affected feature until a patch is available"
        advisories:
          type: array
          nullable: true
          description: >
            List of advisory references associated with the vulnerability. Each advisory contains
            a title and URL linking to more information. This includes BDSA (Black Duck Security
            Advisory) references and other external advisories.
          items:
            type: object
            properties:
              title:
                type: string
                description: Title or identifier of the advisory (e.g., BDSA-2023-1234)
                example: "BDSA-2023-1234"
              url:
                type: string
                format: uri
                description: URL to the full advisory details
                example: "https://www.blackducksoftware.com/advisory/BDSA-2023-1234"
            required:
              - title
              - url
          example:
            - title: "BDSA-2023-1234"
              url: "https://www.blackducksoftware.com/advisory/BDSA-2023-1234"
        project:
          $ref: '#/components/schemas/ProjectRef'
        projectVersion:
          $ref: '#/components/schemas/VersionRef'
      required:
        - component
        - cwes
        - detected
        - findingId
        - id
        - inKev
        - inVcKev
        - location
        - risk
        - severity
        - title
        - type
        - violations
        - warnings
        - status
        - project
        - projectVersion
    JsonErrorResponse:
      type: object
      description: "Represents a standard error response returned by the API."
      properties:
        errors:
          type: array
          description: "A list of errors encountered during the request."
          items:
            type: object
            description: "An individual error entry containing details about the issue encountered."
            properties:
              error:
                type: string
                description: "A descriptive message explaining the error that occurred."
              instanceLocation:
                type: string
                description: "The specific location in the instance where the error occurred, if applicable."
                default: ""
              keywordLocation:
                type: string
                description: "The specific schema keyword or rule that was violated, if applicable."
                default: ""
        valid:
          type: boolean
          description: "Indicates whether the request was valid. Typically 'false' in an error response."
          default: false
          example: false
      required:
        - valid
    StpRelayErrorResponse:
      type: object
      description: >-
        Error response for the firmware filesystem endpoints. A superset of JsonErrorResponse
        (same errors[]/valid fields, so a generic error parser still works) with an added
        machine-readable `code` discriminator, so a caller can tell the distinct 4xx conditions
        apart without parsing the human-readable message. Exactly one entry is present in
        `errors`; its `error` field is the human-readable message corresponding to `code`.
      properties:
        code:
          type: string
          description: >-
            Machine-readable error discriminator. Values:
            INVALID_PROJECT_VERSION_ID (400 — projectVersionId is not a valid id),
            INVALID_SCAN_ID (400 — the scanId override is not a valid id),
            INVALID_FILE_HASH (400 — hash is not a valid SHA-256),
            PROJECT_VERSION_NOT_FOUND (404 — no such project version, or not visible to the caller),
            SCAN_NOT_FOUND (404 — a scanId was supplied but no such scan exists for this version),
            NO_FILESYSTEM_SCAN (404 — the version has no completed binary scan with an unpacked filesystem),
            PATH_NOT_FOUND (404 — tree: the requested path does not exist in the filesystem),
            FILE_NOT_FOUND (404 — file: no file with the given hash exists in the filesystem),
            STP_UPSTREAM_ERROR (502 — the upstream STP service errored or was unreachable).
          enum:
            - INVALID_PROJECT_VERSION_ID
            - INVALID_SCAN_ID
            - INVALID_FILE_HASH
            - PROJECT_VERSION_NOT_FOUND
            - SCAN_NOT_FOUND
            - NO_FILESYSTEM_SCAN
            - PATH_NOT_FOUND
            - FILE_NOT_FOUND
            - STP_UPSTREAM_ERROR
          example: NO_FILESYSTEM_SCAN
        errors:
          type: array
          description: "The error(s) encountered (exactly one for these endpoints)."
          items:
            type: object
            description: "An individual error entry containing details about the issue encountered."
            properties:
              error:
                type: string
                description: "A descriptive, human-readable message explaining the error that occurred."
              instanceLocation:
                type: string
                description: "The specific location in the instance where the error occurred, if applicable."
                default: ""
              keywordLocation:
                type: string
                description: "The specific schema keyword or rule that was violated, if applicable."
                default: ""
        valid:
          type: boolean
          description: "Indicates whether the request was valid. Always false in an error response."
          default: false
          example: false
      required:
        - code
        - valid
    FilesystemTreeNode:
      type: object
      description: >-
        A node in the unpacked firmware filesystem tree, relayed verbatim from STP. Recursive via
        `children`. The /filesystem/tree response is a single root node. `additionalProperties` is
        true: STP may add fields, and consumers should ignore unknown ones.
      additionalProperties: true
      properties:
        file_path:
          type: string
          description: Full path of the node within the firmware filesystem.
          example: "/usr/bin/hello"
        file_hash:
          type: string
          nullable: true
          description: SHA-256 content hash. Null for nodes without content (directories, symlinks).
        mime_type:
          type: string
          nullable: true
          description: MIME type of the file. Null for nodes without one (e.g. directories).
        has_children:
          type: boolean
          description: >-
            True if this node has children and can be expanded. Children are only included in
            `children` when within the requested `depth`.
        children:
          type: array
          description: Child nodes, included only within the requested depth.
          items:
            $ref: "#/components/schemas/FilesystemTreeNode"
        errors:
          type: array
          description: Processing errors applicable to this node (included when error info is requested).
          items:
            type: object
            additionalProperties: true
      required:
        - file_path
        - has_children
    FileOverviewV0:
      type: object
      description: >-
        Per-file overview metadata returned by /filesystem/overview, relayed verbatim from STP:
        size, type, all hash digests, binary security features, and any processing errors.
        `additionalProperties` is true: STP may add fields; consumers should ignore unknown ones.
      additionalProperties: true
      properties:
        file_hash:
          type: string
          description: SHA-256 content hash of the file (the hash this overview was requested for).
        mime_type:
          type: string
          nullable: true
          description: MIME type of the file. Null for nodes without one (e.g. directories).
        full_type:
          type: string
          nullable: true
          description: 'Full type string (e.g. the file(1)/ELF description).'
          example: "ELF 64-bit LSB pie executable, x86-64, ... dynamically linked, ... stripped"
        file_size:
          type: integer
          format: int64
          description: Size of the file in bytes.
        hashes:
          type: array
          description: All computed digests of the file.
          items:
            type: object
            properties:
              alg:
                type: string
                description: Hash algorithm (e.g. md5, sha1, sha256, sha512).
              value:
                type: string
            required:
              - alg
              - value
        security_features:
          type: array
          description: >-
            Binary hardening features and whether each is enabled (CRA Annex I §1.3 code-execution
            mitigations). Empty for non-binary files. A feature not listed has an uncertain status.
          items:
            type: object
            properties:
              name:
                type: string
                description: 'Feature name, e.g. stackguard, dep (NX), aslr, relro-full, pic (PIE).'
              enabled:
                type: boolean
            required:
              - name
              - enabled
        machine:
          type: string
          nullable: true
          description: CPU architecture. Null for non-binary files.
          example: "AMD x86-64"
        errors:
          type: array
          description: Processing errors related to the file, if any.
          items:
            type: object
            additionalProperties: true
      required:
        - file_hash
        - file_size
        - hashes
        - security_features
    # ---- security_assessment pass-through response schemas (relayed verbatim from STP) ----
    SecAssessConfigSummary:
      type: object
      description: "Summary of a parsed configuration file."
      properties:
        file_hash: { type: string }
        file_paths: { type: array, items: { type: string } }
        augeas_module: { type: string, description: "The Augeas lens that parsed the file (e.g. Sshd, Pam, Systemd)." }
    SecAssessConfigDetails:
      type: object
      description: "Full parsed config for one file. Map values may be null when a file has no parsed data."
      properties:
        file_paths: { type: array, items: { type: string } }
        augeas_module: { type: string }
        parsed_config: { type: object, additionalProperties: true, description: "Augeas-parsed tree; structure varies by config type." }
    SecAssessBinaryInfo:
      type: object
      description: "Per-binary rz-bin info (hardening: NX/PIE/RELRO/canary live in `data`; field names follow rz-bin)."
      properties:
        file_paths: { type: array, items: { type: string } }
        data: { type: object, additionalProperties: true }
    SecAssessBinarySymbols:
      type: object
      description: "Imported or exported symbol names for one binary."
      properties:
        file_paths: { type: array, items: { type: string } }
        imports: { type: array, items: { type: string } }
        exports: { type: array, items: { type: string } }
    SecAssessDependencyEdge:
      type: object
      properties:
        file_path: { type: string }
        file_hash: { type: string }
        library_name: { type: string, nullable: true }
        resolved_functions: { type: array, items: { type: string } }
    SecAssessDependencyResult:
      type: object
      description: "Libraries that the given binary loads (ELF load graph)."
      properties:
        file_path: { type: string }
        file_hash: { type: string }
        declared_libs: { type: array, items: { type: string } }
        dependencies: { type: array, items: { $ref: "#/components/schemas/SecAssessDependencyEdge" } }
        has_more: { type: boolean }
    SecAssessDependentResult:
      type: object
      description: "Binaries that load the given file (reverse ELF load graph)."
      properties:
        file_path: { type: string }
        file_hash: { type: string }
        dependents: { type: array, items: { $ref: "#/components/schemas/SecAssessDependencyEdge" } }
        has_more: { type: boolean }
    SecAssessCallgraphEdge:
      type: object
      properties:
        function_name: { type: string }
        source_file_path: { type: string }
        source_file_hash: { type: string }
        target_file_path: { type: string }
        target_file_hash: { type: string }
        call_type: { type: string, enum: [ direct, cross_binary, unresolved ] }
    SecAssessCallerResult:
      type: object
      properties:
        target_function: { type: string }
        callers: { type: array, items: { $ref: "#/components/schemas/SecAssessCallgraphEdge" } }
        has_more: { type: boolean }
    SecAssessCalleeResult:
      type: object
      properties:
        source_function: { type: string }
        callees: { type: array, items: { $ref: "#/components/schemas/SecAssessCallgraphEdge" } }
        has_more: { type: boolean }
    SecAssessServiceSummary:
