  /public/v0/projects/{projectId}/updates:
    get:
      summary: Get project updates configuration
      description: |
        Retrieves a project's update settings.

        Projects inherit from the organization by default (source: "organization").
        When inheriting, the `enabled` field reflects the organization's current setting.
        If the project has been explicitly configured, source will be "project".
      tags: [ projectUpdates ]
      operationId: getProjectUpdatesConfigV0
      parameters:
        - name: projectId
          description: The project's unique identifier.
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUpdatesConfigV0Response"
              examples:
                inheriting:
                  summary: Project inheriting from organization
                  value:
                    enabled: true
                    scope: "latest"
                    source: "organization"
                overridden:
                  summary: Project with its own override
                  value:
                    enabled: false
                    scope: "latest"
                    source: "project"
        "401":
          description: Unauthorized - not authenticated
        "403":
          description: Forbidden - insufficient permissions (requires VIEW_UPDATES_CONFIGURATION or VIEW_PROJECT_UPDATES)
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
    put:
      summary: Update project updates configuration
      description: |
        Updates a project's update settings.

        Set `inherit: true` to revert the project to inheriting from the organization
        (any project-specific override is removed).
        Set `inherit: false` with an `enabled` value to create a project-specific override.

        Changes are audited in the audit trail.
      tags: [ projectUpdates ]
      operationId: updateProjectUpdatesConfigV0
      parameters:
        - name: projectId
          description: The project's unique identifier.
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: |
          Project vulnerability updates configuration update.
          When `inherit` is `true`, the project reverts to inheriting from the organization
          and `enabled`/`scope` are ignored.
          When `inherit` is `false`, `enabled` is required.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectUpdatesConfigV0Request"
            examples:
              inherit:
                summary: Revert to organization inheritance
                value:
                  inherit: true
              override:
                summary: Override with project-specific settings
                value:
                  inherit: false
                  enabled: true
                  scope: "latest"
      responses:
        "200":
          description: Configuration was successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUpdatesConfigV0Response"
              examples:
                inherited:
                  summary: After reverting to organization inheritance
                  value:
                    enabled: true
                    scope: "latest"
                    source: "organization"
                overridden:
                  summary: After setting a project override
                  value:
                    enabled: false
                    scope: "latest"
                    source: "project"
        "400":
          description: Invalid request body (e.g. `inherit` is `false` but `enabled` is missing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "401":
          description: Unauthorized - not authenticated
        "403":
          description: Forbidden - insufficient permissions (requires EDIT_UPDATES_CONFIGURATION or EDIT_PROJECT_UPDATES)
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/admin/products/{projectId}/recompute-rollups:
    post:
      description: >-
        Recompute rollup counts for all versions of a given Product project.
        Finds all version IDs for the specified project and reconciles each one.
        Requires global admin permissions (VIEW_ANY_PROJECT).
      tags: ['admin']
      operationId: recomputeRollupsV0
      parameters:
        - name: projectId
          in: path
          required: true
          description: The project ID whose rollup counts should be recomputed
          schema:
            type: integer
            format: int64
          example: 12373781892331
      responses:
        "200":
          description: Rollup recomputation completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecomputeRollupsResponse"
        "401":
          description: Unauthorized access
        "403":
          description: Forbidden — requires VIEW_ANY_PROJECT permission
  /public/v0/admin/products/recompute-all-rollups:
    post:
      description: >-
        Recompute rollup counts for all versions across all projects.
        Runs the same two-pass reconciliation as the nightly scheduler:
        bulk fix for zero-dependency versions, then per-version CTE for
        versions with dependencies.
        Requires global admin permissions (VIEW_ANY_PROJECT).
      tags: ['admin']
      operationId: recomputeAllRollupsV0
      responses:
        "200":
          description: Full rollup recomputation completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecomputeAllRollupsResponse"
        "401":
          description: Unauthorized access
        "403":
          description: Forbidden — requires VIEW_ANY_PROJECT permission
components:
  schemas:
    UsedByProjectV0:
      type: object
      description: A project that uses a given version as a dependency.
      properties:
        id:
          type: string
          description: The project's unique identifier.
        name:
          type: string
          description: The project name.
      required:
        - id
        - name
    AuditEventV0:
      type: object
      description: An audit event. Common fields are always present; event-specific fields vary by `type`.
      properties:
        user:
          description: Username who triggered the event
          oneOf:
            - type: string
            - $ref: '#/components/schemas/ValueStringV0'
          example: "alice"
        time:
          description: Event timestamp (UTC)
          oneOf:
            - type: string
              format: date-time
            - $ref: '#/components/schemas/ValueDateTimeV0'
          example: "2025-02-25T14:23:00Z"
        type:
          description: Event type name
          oneOf:
            - type: string
            - $ref: '#/components/schemas/ValueStringV0'
          example: "LoginEvent"
        comment:
          type: string
          description: Optional event comment
        username:
          type: string
          description: Present for login events
        application:
          $ref: '#/components/schemas/AuditApplicationRefV0'
        appVersion:
          $ref: '#/components/schemas/AuditAppVersionRefV0'
        component:
          $ref: '#/components/schemas/AuditComponentRefV0'
        data:
          type: object
          description: Event-specific payload for some events
          additionalProperties: true
        components:
          type: array
          description: Present for some notification events; impacted app + component pairs
          items:
            type: object
            properties:
              application:
                $ref: '#/components/schemas/AuditApplicationRefV0'
              component:
                $ref: '#/components/schemas/AuditComponentRefV0'
    AuditApplicationRefV0:
      type: object
      description: Full application reference used in project-related audit events
      properties:
        id:
          type: string
          description: "Application identifier (string representation of large integer)"
          example: "2345678901234567890"
        name:
          type: string
          description: Project name
          example: "Payments Service"
        description:
          type: string
          description: Project description
        type:
          type: string
          example: "application"
        createdBy:
          type: string
          description: Username who created the project
        created:
          type: string
          format: date-time
        version:
          type: integer
          example: 1
    AuditAppVersionRefV0:
      type: object
      description: Minimal application version reference used in version-related audit events
      properties:
        hash:
          type: string
          description: Project identifier
        name:
          type: string
          description: Project name
        environment:
          type: string
          description: Project environment
    AuditComponentRefV0:
      type: object
      description: Minimal component reference used in audit events
      properties:
        arch:
          type: string
          description: Ecosystem or package type
          example: "maven"
        group:
          type: string
          description: Component group/namespace
          example: "org.springframework"
        artifact:
          type: string
          description: Component artifact/name
          example: "spring-core"
        version:
          type: string
          description: Component version
          example: "5.3.20"
        id:
          type: string
          description: Component identifier
          example: "5678901234567890123"
    ValueStringV0:
      type: object
      description: Wrapper for string values (compatibility)
      properties:
        value:
          type: string
    ValueDateTimeV0:
      type: object
      description: Wrapper for date-time values (compatibility)
      properties:
        value:
          type: string
          format: date-time
    ComplianceWorkflowStatusRequest:
      type: object
      properties:
        workflowId:
          type: string
          description: ID of the compliance workflow
        status:
          type: string
          description: Status of the compliance workflow
        suppliers:
          type: array
          items:
            type: object
            properties:
              externalId:
                type: string
                description: ID of the supplier from an external source
              status:
                type: string
                description: Status of the supplier's analysis
    VersionComponentsResponseV0:
      type: object
      properties:
        offset:
          type: integer
          description: Offset of the first item in the current page.
        limit:
          type: integer
          description: Maximum number of items per page.
        total:
          type: integer
          description: Total number of items available.
        items:
          type: array
          items:
            $ref: '#/components/schemas/VersionComponentListEntry'
    VersionComponentListEntry:
      type: object
      properties:
        id:
          type: string
        gcId:
          type: string
        name:
          type: string
        version:
          type: string
        type:
          type: string
        supplier:
          type: string
        licenses:
          type: string
        releaseDate:
          type: string
        licenseDetails:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              spdx:
                type: string
              license:
                type: string
              comment:
                type: string
              licensePolicyLabel:
                type: string
              policy:
                type: string
              copyleftFamily:
                type: string
              url:
                type: string
        findings:
          type: integer
        warnings:
          type: integer
        violations:
          type: integer
        severityCounts:
          type: object
          additionalProperties:
            type: integer
        source:
          type: array
          items:
            type: string
        status:
          type: string
          nullable: true
          description: The component's status.
          enum: [ "NEEDS_REVIEW", "IN_REVIEW", "CONFIRMED", "FALSE_POSITIVE", "UNKNOWN" ]
          example: "NEEDS_REVIEW"
        statusComment:
          type: string
          nullable: true
          description: Optional comment about the component's status.
          example: "Component is confirmed to be safe"
        edited:
          type: boolean
          description: Indicates if the component has user overrides applied.
        lastModifiedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last user override applied to the component.
        lastModifiedBy:
          type: string
          nullable: true
          description: Username of the user who last modified the component.
    VersionDetailsV0:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        relativeRiskScore:
          type: number
          format: double
        testStatuses:
          type: array
          items:
            type: string
        uniqueTestTypes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
        project:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            description:
              type: string
        branch:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            type:
              type: string
