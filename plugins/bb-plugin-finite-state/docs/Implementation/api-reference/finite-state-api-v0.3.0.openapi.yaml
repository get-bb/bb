openapi: 3.0.3
info:
  title: Finite State Customer API
  description: |
    Finite State REST API for accessing and managing platform and product data.
    
    This API provides robust querying capabilities for operations that return data from large collections. 
    To enable flexible and efficient access to data, the API supports filtering, sorting, and pagination 
    using standard query parameters. 
    
    These features help clients tailor queries to return only the relevant data, 
    in the desired order, and in manageable amounts.
    
    ### Filtering
    
    Data can be filtered using the `filter` query parameter, which supports expressions in 
    [RSQL (RESTful Service Query Language)](https://github.com/jirutka/rsql-parser/blob/master/README.adoc). 

    - Filters support the following operators:
      - `==`, `!=`: equality and inequality
      - `>`, `<`, `>=`, `<=`: numeric, enumerated, and date comparisons
      - `=in=`, `=out=`: tests for matching a value from a comma-separated set of values grouped in parentheses
      - `=like=`: provides case-sensitive wildcard pattern matching on string data types using the `*` wildcard character.
        To use a literal `*` in the matching pattern, precede it with the `\\` character, e.g. `\\*`.
        To use a literal `\\` in the matching pattern, precede it with another `\\` character, e.g. `\\\\`.
      - `=ilike=`: performs the same pattern matching on string data types as the `=like=` operator,
        except it performs case-insensitive pattern matching.
      - `=nlike=`: negates `=like=` (case-sensitive NOT LIKE)
      - `=nilike=`: negates `=ilike=` (case-insensitive NOT LIKE)
      - Logical operators: `and`, `or`, and grouping via parentheses
    - The filter query parameter takes a string of expressions combined using RSQL syntax.
    - Filter expressions can be provided using either FIQL-style syntax or the more readable RSQL format.
    - Filtering is case-sensitive, except where otherwise specified, and attribute type-aware.
    The supported filter attributes are specified in each applicable operation's descriptions.
    
    **Examples:**      
    ```
    /api/public/v0/findings?filter=risk>50
    /api/public/v0/findings?filter=findingId==CVE-2018-11776 or (risk>50 and severity=in=(HIGH,MEDIUM))
    /api/public/v0/findings?filter=detected<2025-02-25T14:23:00
    /api/public/v0/findings?filter=severity>MEDIUM or inKev==true
    /api/public/v0/findings?filter=component=in=(struts-core,spring-web) and (severity>HIGH or inKev==true)
    /api/public/v0/findings?filter=component=like=spring*
    /api/public/v0/findings?filter=component=like=spring*boot and findingId=like=CVE-2025-*
    /api/public/v0/findings?filter=component=ilike=Spring*Boot
    /api/public/v0/findings?filter=component=nilike=Spring*Boot
    /api/public/v0/findings?filter=title=ilike=*calloc*
    ```
    
    ### Sorting

    Sorting is controlled using the `sort` query parameter. 
    The value consists of an attribute name, followed by 
    a sort direction (`asc` for ascending or `desc` for descending), separated by a colon, all lowercase.
    Multiple sort fields can be specified as comma-separated segments to define primary and secondary sort order.
    The supported sort attributes are specified per operation.
    
    **Examples:**
    ```
    /api/public/v0/findings?sort=severity:asc
    /api/public/v0/findings?sort=detected:desc
    /api/public/v0/projects?sort=lastScan:asc,created:desc
    ```
    
    ### Pagination

    Pagination allows clients to control the size and offset of result sets, helping improve performance and usability when working with large datasets.

    - `limit`: Specifies the maximum number of records to return.
    - `offset`: Specifies the number of records to skip before beginning to return results.
    - Default and maximum values for `limit` may be enforced per endpoint to protect API performance.
    - Pagination is typically used together with filtering and sorting to create precise and performant queries.
    
    **Examples:**
    ```
    /api/public/v0/findings?limit=100&offset=200
    /api/public/v0/findings?filter=severity>MEDIUM&sort=detected:desc&limit=50
    ```
    
    These mechanisms work together to enable flexible, precise data queries across endpoints that support collection retrieval.

  version: 0.3.0
servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: "/api"
security:
  - ApiKeyAuth: [ ]
paths:
  /public/v0/compliance/workflows/status:
    post:
      description: Update compliance workflow status
      tags: [ compliance ]
      operationId: updateComplianceWorkflowStatusV0
      requestBody:
        required: true
        description: Compliance workflow status details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplianceWorkflowStatusRequest'
      responses:
        "200":
          description: successful operation
        "400":
          description: This request failed to validate against this specification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/components:
    get:
      description: Get a list of components
      tags: [ components ]
      operationId: getComponentsV0
      parameters:
        - name: filter
          description: |
            Filter applied to the components to be returned.
            The supported filter attributes are:
            - `project` - the unique ID of the project to which the component belongs, e.g. 2345678901234567891
            - `projectVersion` - the unique ID of the project version to which the component belongs, e.g. 3456789012345678912
            - `created` - the UTC formatted time the component was created, e.g. `2025-02-25T14:23:00`
            - `type` - the component's type, e.g. library, application, firmware, etc.
            - `warnings` - number of policy warnings associated with the component
            - `violations` - number of policy violations associated with the component
            - `name` - the component name, e.g. `name==log4j`
            - `version` - the component version, e.g. `version==1.2.17`. Use `version==null` to return components without a version and `version!=null` to return only components with a version value.
            - `status` - the component's status, e.g. NEEDS_REVIEW, IN_REVIEW, CONFIRMED, FALSE_POSITIVE, UNKNOWN
            - `severity` - filter by vulnerability severity derived from highest risk score; allowed values: CRITICAL, HIGH, MEDIUM, LOW (e.g., `severity=in=(CRITICAL,HIGH)`)
            - `source` - filter by component origin source membership (e.g., `source==cyclonedx`)
            - `license` - filter by license expression or `NO_LICENSE` (e.g., `license==NO_LICENSE`, `license==MIT`)
            - `componentPolicy` - filter by component age policy, values: WARNING, VIOLATION (company policy thresholds)
            - `licensePolicy` - filter by license policy state, values: WARNING, VIOLATION
            - `ntia` - filter by NTIA compliance (boolean); true for NTIA-compliant components
            - `isEol` - filter by end-of-life status based on global component EOL date (e.g., `isEol==true`)
            - `edited` - filter components with user overrides; `edited==true` returns edited components, `edited==false` returns unedited
            - See the Filtering section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: string
        - name: excluded
          description: |
            If true, returns excluded components. If false, returns non-excluded components.
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: sort
          description: |
            Sort ordering applied to the components to be returned.
            The allowed sort values are specified in this parameter's enumeration.
            See the Sorting section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: string
            enum: [
              "name:asc",
              "name:desc",
              "version:asc",
              "version:desc",
              "date:asc",
              "date:desc",
              "releaseDate:asc",
              "releaseDate:desc",
              "created:asc",
              "created:desc",
              "type:asc",
              "type:desc",
              "warnings:asc",
              "warnings:desc",
              "violations:asc",
              "violations:desc",
              "status:asc",
              "status:desc",
              "vulnCount:asc",
              "vulnCount:desc",
              "policy:asc",
              "policy:desc",
              "supplier:asc",
              "supplier:desc",
              "license:asc",
              "license:desc",
              "source:asc",
              "source:desc"
            ]
        - name: offset
          description: |
            The number of components to skip before returning results.
            See the Pagination section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          description: |
            The maximum number of components to return.
            See the Pagination section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: editStatus
          description: |
            Optional filter controlling edited status; use `edited`, `unedited`, or omit for any.
          in: query
          required: false
          schema:
            type: string
            enum: ["any", "edited", "unedited"]
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComponentV0"
              examples:
                sample:
                  summary: Example components list
                  value:
                    - id: "1234567890123456789"
                      gcId: "2345678901234567891"
                      name: "org.apache.logging.log4j/log4j-core"
                      version: "2.17.2"
                      type: "library"
                      supplier: "maven"
                      created: "2025-02-25T14:23:00Z"
                      releaseDate: "2023-01-01T00:00:00Z"
                      project:
                        id: "9876543210987654321"
                        name: "Payments Service"
                      branch:
                        id: "3"
                        name: "main"
                      projectVersion:
                        id: "abcdef0123456789"
                        version: "1.2.3"
                        created: "2025-02-24T10:00:00Z"
                      declaredLicenses: "Apache-2.0"
                      concludedLicenses: "Apache-2.0"
                      declaredLicenseDetails: []
                      concludedLicenseDetails: []
                      findings: 1
                      warnings: 0
                      violations: 0
                      severityCounts: { HIGH: 1 }
                      source: [ "SBOM" ]
                      confidence: 0.95
                      projectModule: false
                      origin: [ "SBOM" ]
                      bomRef: "pkg:maven/org.apache.logging.log4j/log4j-core@2.17.2"
                      excluded: false
                      includeInFutureVersions: true
                      status: "NEEDS_REVIEW"
                      statusComment: null
        "400":
          description: This request failed to validate against this specification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        '404':
          description: The request's path is not valid
  /public/v0/components/{projectVersionId}/{componentId}/status:
    put:
      description: Update the status of a component
      tags: [ components ]
      operationId: updateComponentStatusV0
      parameters:
        - name: projectVersionId
          description: The project version's unique identifier.
          in: path
          required: true
          schema:
            type: string
        - name: componentId
          description: The component's unique identifier.
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: Component status update details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateComponentStatusV0Request'
      responses:
        "204":
          description: Component status was successfully updated
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/components/search:
    get:
      summary: Search for components across projects
      description: |
        Searches for components by name and version across all projects the user has access to.
        Returns an array of matching components with their project and latest version information.

        The version field supports wildcard matching:
        - Use "*" to match any version
        - Use "*" within the string for wildcard matching (e.g., "2.*" matches all 2.x versions)
      operationId: searchComponentsV0
      tags: [ components ]
      parameters:
        - name: name
          in: query
          description: The component name to search for. Supports partial matching.
          required: true
          schema:
            type: string
            minLength: 1
          example: "spring-boot"
        - name: version
          in: query
          description: |
            The component version to search for. Supports partial matching and wildcard characters.
            - Use "*" to match any version
            - Use "*" within the string for wildcard matching (e.g., "2.*" matches "2.0", "2.1", "2.7.0", etc.)
          required: false
          schema:
            type: string
          example: "2.7.0"
        - name: offset
          in: query
          description: The number of items to skip before starting to collect the result set
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: The maximum number of items to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: sort
          in: query
          description: Sort order for results (attribute:direction format, e.g., "componentName:asc")
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Search completed successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComponentSearchV0Response'
              example:
                - componentName: "spring-boot-starter-web"
                  componentVersion: "2.7.0"
                  project:
                    projectId: "9876543210987654321"
                    projectName: "My Application"
                    latestMatchingProjectVersionId: "1234567890123456789"
                    projectVersionName: "v2.1.0"
                - componentName: "spring-boot-starter-data-jpa"
                  componentVersion: "2.7.0"
                  project:
                    projectId: "1111222233334444555"
                    projectName: "Another Project"
                    latestMatchingProjectVersionId: "9876543210987654321"
                    projectVersionName: "main"
        "400":
          description: Bad request - invalid search parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonErrorResponse'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient permissions
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonErrorResponse'
  /public/v0/findings:
    get:
      description: Get a list of findings
      tags: [ findings ]
      operationId: getFindingsV0
      parameters:
        - name: filter
          description: |
            Filter applied to the findings to be returned.
            The supported filter attributes are:
            - `attackVector` - the attack vector associated with the vulnerability - `NETWORK`, `ADJACENT`, `LOCAL`, `PHYSICAL`
            - `component` - the component name without a group qualification, e.g. `struts-core`
            - `detected` - filter by detected time. Use standard comparisons (`>`, `>=`, `<`, `<=`, `==`, `!=`). For ranges use `detected>=START;detected<=END` with UTC ISO-8601 timestamps, e.g. `2025-02-25T14:23:00`
            - `findingId` - the vulnerability's common identifier, e.g. `CVE-2018-11776`
            - `inKev` - `true` or `false`
            - `risk` - risk score `0`-`100`
            - `score` - alias for `risk`. Supports `>`, `>=`, `<`, `<=`, `==`, `!=`, or token syntax like `>>50`, `<e60`, `ee75`
            - `severity` - enumerated severity - `CRITICAL`, `HIGH`, `MEDIUM`, `LOW`, `NONE`, `INFO`
            - `policy` - `warnings` or `violations`
            - `affected` - the version component ID (component instance id within the version)
            - `title` - case-insensitive text match against the rendered finding title for SAST findings and against the finding ID for CVE findings, e.g. `title=ilike=*calloc*`
            - `vulnInDataset` - `true` or `false`
            - `reachabilityScore` - unitless prioritization score that can be positive, negative, or zero, where positive values indicate higher priority vulnerabilities
            - `status` - the VEX state assigned to the finding (e.g., `NOT_AFFECTED`, `FALSE_POSITIVE`, `IN_TRIAGE`, `RESOLVED_WITH_PEDIGREE`, `RESOLVED`, `EXPLOITABLE`, `NO_STATUS`)            
            - `exploit` - exploit facets (e.g., `weaponized`). Special value `NO_KNOWN_EXPLOITS` filters for findings without any exploit information.
            - `category` - category name (e.g., `CREDENTIALS`, `CONFIG_ISSUES`, `CRYPTO_MATERIAL`, `SAST_ANALYSIS`, `CVE`)
            - `project` - the unique ID of the project to which the finding's component belongs, e.g. 2345678901234567891
            - `projectVersion` - the unique ID of the project version to which the finding's component belongs, e.g. 3456789012345678912
            - `epssWeightedRisk` - EPSS-weighted risk score on a 0-10 scale. Supports range comparisons, e.g. `epssWeightedRisk>=7.0`
            - `epssWeightedSeverity` - severity band derived from the EPSS-weighted risk score - `CRITICAL`, `HIGH`, `MEDIUM`, `LOW`, `UNKNOWN`. Supports range comparisons, e.g. `epssWeightedSeverity=ge=HIGH`
            - See the Filtering section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: string
        - name: type
          description: |
            Restrict results to a specific finding type.
            - `cve`: Only CVE findings (NTIA compliant)
            - `sast`: Binary/SAST findings (non-NTIA, non-third-party)
            - `thirdparty`: Third-party findings
            - `all`: No restriction
          in: query
          required: false
          schema:
            type: string
            enum: [ "cve", "sast", "thirdparty", "all" ]
        - name: sort
          description: |
            Sort ordering applied to the findings to be returned.
            The allowed sort values are specified in this parameter's enumeration.
            See the Sorting section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: string
            enum: [
              "detected:asc",
              "detected:desc",
              "severity:asc",
              "severity:desc",
              "cveId:asc",
              "cveId:desc",
              "policy:asc",
              "policy:desc",
              "risk:asc",
              "risk:desc",
              "componentId:asc",
              "componentId:desc",
              "created:asc",
              "created:desc",
              "status:asc",
              "status:desc",
              "reachabilityScore:asc",
              "reachabilityScore:desc",
              "epssWeightedRisk:asc",
              "epssWeightedRisk:desc",
              "epssWeightedSeverity:asc",
              "epssWeightedSeverity:desc"
            ]
        - name: archived
          description: |
            Specified whether archived findings should be returned. 
            A finding is archived if it has been deleted or its associated component has been deleted.
            Archived findings are returned when the value is true.
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: excluded
          description: |
            Controls whether findings from excluded components should be returned.
            - `false` (default): Returns findings from non-excluded components only
            - `true`: Returns findings from excluded components only
            - If omitted, defaults to false (non-excluded components)
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: offset
          description: |
            The number of findings to skip before returning results.
            See the Pagination section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          description: |
            The maximum number of findings to return.
            See the Pagination section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: includeComments
          description: |
            Whether to include finding comments in the response.
            When true, the `comments` field will be populated.
            When false or omitted, this field will be null to avoid extra processing.
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: includeAdditionalDetails
          description: |
            Whether to include additional details in the response.
            When true, the `description` field will be populated with SAST and CVE finding descriptions.
            When false or omitted, this field will be null to avoid extra processing.
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: latestOnly
          description: |
            When `true` and the request is not scoped to a single `projectVersion` in `filter`,
            restricts results to the latest application version per project (by `created` time),
            which can be significantly faster for large tenants. When `false` or omitted (default),
            findings from every accessible non-deleted version are included.
            Ignored when `filter` contains exactly one `projectVersion==...` clause (that path is already version-scoped).
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FindingV0"
        "400":
          description: This request failed to validate against this specification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        '404':
          description: The request's path is not valid.
  /public/v0/findings/{projectVersionId}/{findingId}/status:
    put:
      description: Update the VEX status of a finding
      tags: [ findings ]
      operationId: updateFindingStatusV0
      parameters:
        - name: projectVersionId
          description: The project version's unique identifier.
          in: path
          required: true
          schema:
            type: string
        - name: findingId
          description: The finding's unique identifier.
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: Finding status update details. See UpdateFindingStatusV0Request for valid values.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFindingStatusV0Request'
      responses:
        "204":
          description: Finding status was successfully updated
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/findings/{projectVersionId}/{findingId}/status/clear:
    put:
      description: Clear the VEX status of a finding (remove justification, state, response, and reason)
      tags: [ findings ]
      operationId: clearFindingStatusV0
      parameters:
        - name: projectVersionId
          description: The project version's unique identifier.
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: findingId
          description: The finding's unique identifier.
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Finding status was successfully cleared
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/findings/{projectVersionId}/status/clear/bulk:
    put:
      description: Clear the VEX status of multiple findings in bulk (remove justification, state, response, and reason)
      tags: [ findings ]
      operationId: bulkClearFindingStatusV0
      parameters:
        - name: projectVersionId
          description: The project version's unique identifier.
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: Bulk clear request with finding IDs
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkClearFindingStatusV0Request'
      responses:
        "204":
          description: Finding statuses were successfully cleared
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/findings/{projectVersionId}/status/set/bulk:
    put:
      description: >
        Apply VEX status to multiple findings in one call, each with its own status / justification /
        response / reason (heterogeneous). Best-effort per finding: verdicts for findings that exist in
        this project version are applied, and any finding id that is not found is skipped and reported
        in `results` so the caller can retry just those — a single bad id does not roll back the rest
        (mirrors the bulk-clear endpoint). Malformed ids and invalid enum values are rejected up front
        with a 400 by request validation, so they never partially apply. The 200 response body carries
        an overall `status` ("success", "partial_success", or "failure"), a `summary` of counts, and a
        per-finding `results` array (one entry per requested finding). Consumes a single rate-limit token
        regardless of how many findings are in the batch.
      tags: [ findings ]
      operationId: bulkSetFindingStatusV0
      parameters:
        - name: projectVersionId
          description: The project version's unique identifier.
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: Per-finding VEX verdicts to apply.
