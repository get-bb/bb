            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          description: "Authentication is required for this endpoint."
        "403":
          description: "Not authorized"

  /public/v0/cves:
    get:
      description: Get a list of CVEs aggregated by CVE ID, including affected components and projects
      tags: [ cves ]
      operationId: getAggregatedCvesV0
      parameters:
        - name: filter
          description: |
            Filter applied to the CVEs to be returned.
            The supported filter attributes are:
            - `cveId` - the vulnerability's common identifier, e.g. `CVE-2018-11776`
            - `component` - the component version ID, e.g. `345678901234567890`
            - `project` - the project ID to which the component belongs, e.g. `2345678901234567891`
            - `severity` - enumerated severity - `CRITICAL`, `HIGH`, `MEDIUM`, `LOW`, `NONE`, `INFO`
            - `risk` - risk score `0`-`100`
            - `detectionDate` - the UTC formatted time the CVE was detected, e.g. `2025-02-25T14:23:00`
            - `exploit` - exploit intelligence attribute. Allowed values: `kev`, `vcKev`, `weaponized`, `poc`, `threatActors`, `ransomware`, `botnets`, `commercial`, `reported`, `NO_KNOWN_EXPLOITS`
            - See the Filtering section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: string
        - name: sort
          description: |
            Sort ordering applied to the CVEs to be returned.
            The allowed sort values are:
            - `cveId:asc` or `cveId:desc` - sort by CVE identifier
            - `severity:asc` or `severity:desc` - sort by severity level
            - `detectionDate:asc` or `detectionDate:desc` - sort by detection time
            - `risk:asc` or `risk:desc` - sort by risk score
            See the Sorting section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: string
            enum: [
              "cveId:asc",
              "cveId:desc",
              "severity:asc",
              "severity:desc",
              "detectionDate:asc",
              "detectionDate:desc",
              "risk:asc",
              "risk:desc"
            ]
        - name: archived
          description: |
            Specified whether archived findings should be included in the aggregation. 
            A finding is archived if it has been deleted or its associated component has been deleted.
            Archived findings are included when the value is true.
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: offset
          description: |
            The number of CVEs to skip before returning results.
            See the Pagination section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          description: |
            The maximum number of CVEs to return.
            See the Pagination section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: successful operation
          headers:
            X-Total-Count:
              description: The total number of CVEs that match the filter criteria
              schema:
                type: integer
                format: int64
            X-Offset:
              description: The number of CVEs skipped in this response
              schema:
                type: integer
                format: int64
            X-Limit:
              description: The maximum number of CVEs returned in this response
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AggregatedCveV0"
        "400":
          description: This request failed to validate against this specification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        '404':
          description: The request's path is not valid.

  /public/v0/cves/updates:
    get:
      description: |
        Get a list of CVEs that have been updated or added since the original scan
      tags: [ cves ]
      operationId: getUpdatedCvesV0
      parameters:
        - name: updateType
          in: query
          description: |
            Filter CVE updates by type. Allowed values:
            - cve_added
            - cve_retracted
            - severity_update
            - exploit_update
          required: false
          schema:
            type: string
            enum:
              - cve_added
              - cve_retracted
              - severity_update
              - exploit_update
        - name: startDate
          description: |
            The lower bound (exclusive) of the date range to filter by.
          in: query
          required: true
          schema:
            type: string
          example: "2024-03-15T14:30:00Z"
        - name: endDate
          description: |
            The upper bound (inclusive) of the date range to filter by.
          in: query
          required: true
          schema:
            type: string
          example: "2024-03-15T14:30:00Z"
        - name: projectVersionId
          description: restrict the scope of the query to the given project version id
          in: query
          required: false
          schema:
            type: string
        - name: folderId
          description: restrict the scope of the query to the given folder id
          in: query
          required: false
          schema:
            type: string
        - name: offset
          description: |
            The number of CVEs to skip before returning results.
            See the Pagination section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          description: |
            The maximum number of CVEs to return.
            See the Pagination section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: successful operation
          headers:
            X-Total-Count:
              description: The total number of CVEs that match the filter criteria
              schema:
                type: integer
                format: int64
            X-Offset:
              description: The number of CVEs skipped in this response
              schema:
                type: integer
                format: int64
            X-Limit:
              description: The maximum number of CVEs returned in this response
              schema:
                type: integer
