        actions:
          type: array
          description: List of actions the user can perform on this folder
          items:
            type: string
          example: ["VIEW_FOLDER", "EDIT_FOLDER", "DELETE_FOLDER"]
    CreateFolderV0Request:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '^(?!\s*$).+'
          description: Name of the folder
          example: "Medical Products"
        description:
          type: string
          description: Description of the folder
          example: "Projects for medical device products"
        parentFolderId:
          type: string
          description: Unique ID of the parent folder
          example: "9876543210987654321"
    UpdateFolderV0Request:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          pattern: '^(?!\s*$).+'
          description: Updated name of the folder
          example: "Medical Products"
        description:
          type: string
          description: Updated description of the folder
          example: "Projects for medical device products"
        parentFolderId:
          type: string
          description: Unique ID of the parent folder
          example: "9876543210987654321"
    FolderRef:
      type: object
      description: Reference to a folder
      properties:
        id:
          type: string
          description: The folder's unique identifier
          example: "1234567890123456789"
        name:
          type: string
          description: Name of the folder
          example: "Medical Products"
    FolderUserV0:
      type: object
      properties:
        folderId:
          type: string
          description: "A folder id"
        userId:
          type: string
          description: "A user id"
          example: "john.dow"
        email:
          type: string
          description: "The email of the user"
          example: "john.doe@finitestate.io"
        roles:
          type: array
          description: "The list of folder roles for a given user and folder"
          items:
            type: string
          example: [ "Folder Admin" ]
    FolderGroupV0:
      type: object
      properties:
        folderId:
          type: string
          description: "A folder id"
        groupId:
          type: string
          description: "A group id"
        name:
          type: string
          description: "the name of the group"
          example: "Engineering"
        description:
          type: string
          description: "the description of the group"
          example: "A team for engineers"
        memberCount:
          type: integer
          description: "the number of team members"
          example: 5
        roles:
          type: array
          description: "The list of folder roles for a given group and folder"
          items:
            type: string
          example: [ "Folder Admin" ]
    TrackerPingRequest:
      type: object
      description: Request payload for testing tracker connectivity. If not provided, uses database configuration.
      properties:
        workspace_url:
          type: string
          description: Tracker server URL
          example: "https://your-domain.atlassian.net"
        username:
          type: string
          description: Username for authentication
          example: "user@example.com"
        api_key:
          type: string
          description: API key for authentication
          example: "your-api-token"
        project_key:
          type: string
          description: Project key (optional)
          example: "PROJ"
        name:
          type: string
          description: Project name (optional)
          example: "My Project"
    TrackerPingResponse:
      type: object
      description: Response containing ping status and list of available projects
      required:
        - status
        - projects
      properties:
        status:
          type: integer
          format: int32
          description: Ping status code (0 for success, -3 for unknown host, 500 for other errors)
          example: 0
        projects:
          type: array
          description: List of available projects from the tracker
          items:
            type: object
            description: Information about a project in the tracker system
            required:
              - key
              - name
            properties:
              key:
                type: string
                description: Project key
                example: "PROJ"
              name:
                type: string
                description: Project name
                example: "My Project"
              default:
                type: boolean
                description: Whether this is the default project
                example: true
              ticketTypes:
                type: array
                description: List of available ticket types for this project
                items:
                  type: string
                example: ["Task", "Bug", "Story"]
    TrackerTicketStatusUpdateRequest:
      type: object
      description: Request payload for updating tracker ticket status
      required:
        - status
      properties:
        status:
          type: string
          description: The new status for the ticket
          example: "In Progress"
    TrackerTicketStatusUpdateResponse:
      type: object
      description: Response after updating tracker ticket status
      properties:
        success:
          type: boolean
          description: Whether the status update was successful
          example: true
        ticketId:
          type: string
          description: The ticket ID or key that was updated
          example: "PROJ-123"
        status:
          type: string
          description: The new status that was set
          example: "In Progress"
    TrackerTicketRequest:
      type: object
      description: Request payload for creating tracker tickets
      properties:
        components:
          type: array
          description: List of version component IDs for this ticket
          items:
            type: string
          example: ["1234567890123456789", "9876543210987654321"]
        findings:
          type: array
          description: List of global finding IDs for this ticket
          items:
            type: string
          example: ["CVE-2023-1234", "CVE-2023-5678"]
        ticket_name:
          type: string
          description: Custom name for the ticket
          example: "Fix security vulnerabilities in components"
        ticket_summary:
          type: string
          description: Custom summary for the ticket
          example: "Multiple vulnerabilities detected that require immediate remediation"
        priority:
          type: string
          description: Priority level for the ticket
          example: "High"
        project_name:
          type: string
          description: Name of the tracker project
          example: "Security Fixes"
        project_key:
          type: string
          description: Key of the tracker project
          example: "SEC"
        type:
          type: string
          description: Type of the ticket
          example: "Task"
        mode:
          type: string
          enum: [ONE_PER_COMPONENT, ONE_FOR_ALL_COMPONENTS, ONE_FOR_ALL_FINDINGS, ONE_PER_FINDING, SINGLE_FINDING,
                 SINGLE_COMPONENT]
          x-enum-name: Mode
          description: |
            Ticket creation mode:
            - ONE_PER_COMPONENT: Create one ticket for each component
            - ONE_FOR_ALL_COMPONENTS: Create one ticket for all components
            - ONE_FOR_ALL_FINDINGS: Create one ticket for all findings
            - ONE_PER_FINDING: Create one ticket for each finding
            - SINGLE_FINDING: Create a single ticket for a single finding
            - SINGLE_COMPONENT: Create a single ticket for a single component
          example: "ONE_PER_COMPONENT"
    TicketPreviewEntry:
      type: object
      description: Entry containing ticket preview information for selected findings
      properties:
        type:
          type: string
          description: Jira issue type for this ticket
          example: "story"
        project_id:
          type: string
          description: The project ID associated with this ticket
          example: "12345"
        components:
          type: array
          description: List of global component hash IDs associated with this ticket
          items:
            type: integer
            format: int64
          example: [1234567890123456789, 9876543210987654321]
        findings:
          type: array
          description: List of findings with their associated data
          items:
            type: object
            properties:
              id:
                type: string
                description: The finding ID (e.g., CVE-2023-1234)
                example: "CVE-2023-1234"
              severity:
                type: string
                description: The severity level of the finding
                example: "HIGH"
              score:
                type: integer
                description: The CVSS score (integer format)
                example: 75
        tracker_ticket_name:
          type: string
          description: Generated ticket name for the tracker
          example: "Fix 3 vulnerabilities across 2 components"
        tracker_ticket_summary:
          type: string
          description: Generated ticket summary for the tracker
          example: "Multiple vulnerabilities detected:\n\n- CVE-2023-1234 (HIGH)\n- CVE-2023-5678 (MEDIUM)\n\nThese vulnerabilities require immediate remediation."
        tracker_projects_metadata:
          type: object
          description: Metadata for tracker configuration including type, priorities, and projects
    FsscanUpdateResponse:
      type: object
      description: Response when a scanner update is available
      required:
        - update_available
        - version
        - sha256
        - signature
        - download_url
      properties:
        update_available:
          type: boolean
          example: true
        version:
          type: string
          description: Latest available version
          example: "v2.2.0"
        sha256:
          type: string
          description: SHA-256 hash of the binary (hex-encoded)
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        signature:
          type: string
          description: Base64-encoded Ed25519 signature over the SHA-256 hash
          example: "dGVzdC1zaWduYXR1cmU="
        download_url:
          type: string
          description: Short-lived presigned S3 download URL
          example: "https://s3.amazonaws.com/bucket/scanner-releases/v2.2.0/fs-scan_linux_amd64?..."
    FsscanErrorResponse:
      type: object
      description: Simple error payload returned by the fs-scan update endpoints.
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: "invalid JSON body"
    UpdatesConfigV0Response:
      type: object
      description: |
        Organization-level vulnerability updates configuration.
      required:
        - updateEnabled
        - updateScope
      properties:
        updateEnabled:
          type: boolean
          description: Whether the nightly update process is globally enabled for this organization
          example: true
        updateScope:
          type: string
          description: |
            The scope of nightly updates.
            GLOBAL means all projects inherit the organization setting.
            PER_PROJECT means each project controls independently.
          enum:
            - "GLOBAL"
            - "PER_PROJECT"
          example: "GLOBAL"
    UpdateUpdatesConfigV0Request:
      type: object
      description: Request to update the organization's vulnerability updates configuration.
      required:
        - updateEnabled
        - updateScope
      properties:
        updateEnabled:
          type: boolean
          description: Whether to globally enable the nightly update process
          example: true
        updateScope:
          type: string
          description: |
            The scope of nightly updates.
            GLOBAL means all projects inherit the organization setting.
            PER_PROJECT means each project controls independently.
          enum:
            - "GLOBAL"
            - "PER_PROJECT"
          example: "GLOBAL"
    ScoringConfigV0Response:
      type: object
      description: |
        Organization-level EPSS-weighted scoring configuration.
        Controls whether the UI displays EPSS-weighted scoring columns.
      required:
        - epssWeightedScoringEnabled
      properties:
        epssWeightedScoringEnabled:
          type: boolean
          description: Whether EPSS-weighted scoring columns are enabled for this organization
          default: false
          example: false
    UpdateScoringConfigV0Request:
      type: object
      description: Request to update the organization's EPSS-weighted scoring configuration.
      required:
        - epssWeightedScoringEnabled
      properties:
        epssWeightedScoringEnabled:
          type: boolean
          description: Whether to enable EPSS-weighted scoring columns
          example: true
    ProjectUpdatesConfigV0Response:
      type: object
      description: |
        Project-level vulnerability updates configuration.
        Includes a `source` field indicating whether the setting is inherited from the organization
        or overridden at the project level.
      required:
        - enabled
        - scope
        - source
      properties:
        enabled:
          type: boolean
          description: Whether nightly vulnerability updates are enabled for this project
          example: true
        scope:
          type: string
          description: The scope of updates. Always "latest" for MVP.
          enum:
            - "latest"
          example: "latest"
        source:
          type: string
          description: |
            Where the settings come from.
            "organization" if inheriting from the organization's configuration.
            "project" if overridden with project-specific settings.
          enum:
            - "organization"
            - "project"
          example: "organization"
    UpdateProjectUpdatesConfigV0Request:
      type: object
      description: |
        Request to update a project's vulnerability updates configuration.
        When `inherit` is `true`, the project reverts to inheriting from the organization
        and any `enabled`/`scope` values are ignored.
        When `inherit` is `false`, `enabled` is required to set the project-specific override.
      required:
        - inherit
      properties:
        inherit:
          type: boolean
          description: |
            If `true`, the project inherits from the organization setting (removes any project override).
            If `false`, the project uses project-specific settings and `enabled` is required.
          example: false
        enabled:
          type: boolean
          description: |
            Whether to enable nightly vulnerability updates for this project.
            Required when `inherit` is `false`. Ignored when `inherit` is `true`.
          example: true
        scope:
          type: string
          description: |
            The scope of updates. Always "latest" for MVP.
            Ignored when `inherit` is `true`.
          enum:
            - "latest"
          example: "latest"
    ProductComponentV0:
      type: object
      description: |
        A row in the Product Component View. Can be either a Component row or a Project dependency row,
        distinguished by the `objectType` field. Component rows carry the full set of fields from
        ComponentV0; Project rows leave component-specific fields null.
      properties:
        objectType:
          type: string
          description: Discriminator for the row type.
          enum: [ "Component", "Project" ]
        relation:
          type: string
          description: Whether this row comes from a direct or indirect dependency.
          enum: [ "Direct", "Indirect" ]
        dependencyPath:
          type: string
          description: |
            The traversal path from the root Product to this row's containing version,
            formatted as "ProjectName/VersionName > ProjectName/VersionName > ...".
          example: "MyProduct/v1.0 > LibA/v2.0 > LibB/v3.0"
        accessible:
          type: boolean
          description: Whether the current user has access to view this project version (Project rows only).
          nullable: true
        componentCount:
          type: integer
          description: Number of components (Project rows only).
          nullable: true
        policyStatus:
          type: string
          description: Policy status (Project rows only).
          nullable: true
        projectCreatedAt:
          type: string
          format: date-time
          description: Project version creation timestamp (Project rows only).
          nullable: true
        projectCreatedBy:
          type: string
          description: Project version creator username (Project rows only).
          nullable: true
        id:
          type: string
          description: The component's unique identifier (Component rows) or project version ID (Project rows).
          example: 1234567890123456789
        gcId:
          type: string
          description: Global component identifier representing the canonical version of the component.
          nullable: true
          example: 2345678901234567891
        name:
          type: string
          description: The component's name (Component rows) or project name (Project rows).
          example: "libgcc"
        created:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the component was created (Component rows only).
          example: "2025-02-25T14:23:00Z"
        releaseDate:
          type: string
          format: date-time
          nullable: true
          description: The upstream component's original release date, when known (Component rows only).
          example: "2023-01-01T00:00:00Z"
        project:
          $ref: "#/components/schemas/ProjectRef"
          nullable: true
        branch:
          $ref: "#/components/schemas/BranchRef"
          nullable: true
        projectVersion:
          $ref: "#/components/schemas/VersionRef"
          nullable: true
        version:
          type: string
          description: The component's version number (Component rows) or project version name (Project rows).
          example: "4.1.6.RELEASE"
        type:
          type: string
          nullable: true
          description: Category of the component, e.g. library, application, firmware, etc.
          example: "library"
        supplier:
          type: string
          nullable: true
          description: Supplier or originator of the component.
          example: "alpine"
        declaredLicenses:
          type: string
          nullable: true
          description: SPDX license identifier(s) summarizing licensing of the component.
          example: "GPL-2.0-only"
        concludedLicenses:
          type: string
          nullable: true
          description: SPDX license identifier(s) summarizing licensing of the component.
          example: "GPL-2.0-only"
        declaredLicenseDetails:
          type: array
          nullable: true
          description: The component's declared license(s) details.
          items:
            $ref: '#/components/schemas/LicenseDetail'
        concludedLicenseDetails:
          type: array
          nullable: true
          description: The component's concluded license(s) details.
          items:
            $ref: '#/components/schemas/LicenseDetail'
        findings:
          type: integer
          description: Count of findings associated with the component.
          example: 2
        warnings:
          type: integer
          description: Number of policy warnings triggered by the component.
          example: 0
        violations:
          type: integer
          description: Number of policy violations triggered by the component.
          example: 1
        severityCounts:
          type: object
          nullable: true
          additionalProperties:
            type: integer
          description: Mapping of issue severities to counts (e.g. CRITICAL, HIGH). Severities with count 0 are omitted.
          example: { HIGH: 1 }
        source:
          type: array
          nullable: true
          description: Origins or methods through which the component was introduced.
          items:
            type: string
          example: [ "UPLOAD" ]
        confidence:
          type: number
          format: double
          nullable: true
          description: Confidence level of the component's identification.
          example: 0.95
        projectModule:
          type: boolean
          nullable: true
          description: Indicates if the component is a project module.
          example: false
        origin:
          type: array
          nullable: true
          description: Set of strings representing the origin of the component.
          items:
            type: string
          example: ["UPLOAD"]
        bomRef:
          type: string
          nullable: true
          description: Reference to the Bill of Materials (BOM).
          example: "pkg:maven/org.springframework/spring-core@5.3.20"
        excluded:
          type: boolean
          nullable: true
          description: Indicates if the component is excluded.
          example: false
        includeInFutureVersions:
          type: boolean
          nullable: true
          description: Indicates if the component should be included in future versions.
          example: false
        status:
          type: string
          nullable: true
          description: The component's status.
          enum: [ "NEEDS_REVIEW", "IN_REVIEW", "CONFIRMED", "FALSE_POSITIVE", "UNKNOWN" ]
          example: "NEEDS_REVIEW"
        statusComment:
          type: string
          nullable: true
          description: Optional comment about the component's status.
          example: "Component is confirmed to be safe"
        edited:
          type: boolean
          nullable: true
          description: Indicates if the component has user overrides applied.
        lastModifiedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last user override applied to the component.
        lastModifiedBy:
          type: string
          nullable: true
          description: Username of the user who last modified the component.
        replaced:
          $ref: "#/components/schemas/ReplacedComponent"
          nullable: true
          description: Information about the component that was replaced by this component. Only present when this component has replacementStatus of REPLACING.
        tracker:
          $ref: "#/components/schemas/TrackerInfo"
          nullable: true
          description: Tracker integration information for this component. Only present when tracker workspace is enabled.
    RecomputeRollupsResponse:
      type: object
      description: Summary of rollup recomputation for a single project.
      properties:
        processed:
          type: integer
          description: Number of versions processed
          example: 12
        discrepanciesFixed:
          type: integer
          description: Number of versions where rollup discrepancies were corrected
          example: 3
      required:
        - processed
        - discrepanciesFixed
    RecomputeAllRollupsResponse:
      type: object
      description: Summary of rollup recomputation across all projects.
      properties:
        zeroDepsFixed:
          type: integer
          description: Number of zero-dependency versions bulk-fixed
          example: 5
        withDepsProcessed:
          type: integer
          description: Number of versions with dependencies that were processed
          example: 42
        discrepanciesFixed:
          type: integer
          description: Number of versions where rollup discrepancies were corrected
          example: 7
        errors:
          type: integer
          description: Number of errors encountered during recomputation
          example: 0
      required:
        - zeroDepsFixed
        - withDepsProcessed
        - discrepanciesFixed
        - errors
    ScanUploadRequestV0:
      type: object
      description: Request body for creating a scan job and obtaining direct S3 upload details.
      properties:
        filename:
          type: string
          description: The name of the file being uploaded.
          pattern: "^[a-zA-Z0-9. -_()]{1,60}$"
          example: "firmware-v2.1.bin"
        types:
          type: array
          description: |
            The scan type or types to perform. Use the same type values accepted by the existing
            scan upload endpoints, such as `sca`, `sast`, `config`, `python`, `spdx`,
            `sbom_import`, or supported third-party scan types.
          items:
            type: string
          minItems: 1
        multipartUpload:
          type: boolean
          description: |
            When `true`, create a multipart S3 upload for large files. The response will contain
            an `s3UploadId` instead of a single `uploadUrl`.
          default: false
      required:
        - filename
        - types
    ScanUploadV0:
      type: object
      description: Response containing the scan ID and direct upload details.
      properties:
        scanId:
          type: string
          description: The unique ID of the created scan job. Use this to start processing after upload.
          example: "9876543210123456789"
        multipartUpload:
          type: boolean
          description: Whether this scan was created for multipart upload.
          example: false
        uploadUrl:
          type: string
          description: |
            A presigned S3 URL for single-part uploads. PUT the file to this URL with
            Content-Type application/octet-stream. This field is omitted for multipart uploads.
          example: "https://s3.us-east-1.amazonaws.com/bucket/path?X-Amz-Signature=..."
        s3UploadId:
          type: string
          description: |
            The S3 multipart upload ID. Use this with the multipart upload endpoints to upload
            parts and complete the upload. This field is omitted for single-part uploads.
          example: "2~2L4M7Y9R4S8T6U0W1X3Z5"
      required:
        - scanId
        - multipartUpload
    ScanUploadPartUrlV0:
      type: object
      description: Response containing the presigned URL for a multipart upload part.
      properties:
        uploadUrl:
          type: string
          description: A presigned S3 URL for the requested multipart upload part.
          example: "https://s3.us-east-1.amazonaws.com/bucket/path?partNumber=1&X-Amz-Signature=..."
      required:
        - uploadUrl
    CompleteMultipartUploadRequestV0:
      type: object
      description: Request body for completing a multipart upload.
      properties:
        eTags:
          type: object
          description: |
            Map of uploaded part numbers to their S3 ETag values. Object keys must be stringified
            positive integers such as `"1"` or `"2"`.
          additionalProperties:
            type: string
      required:
        - eTags
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      description: |
        User API token required for authentication.
      in: header
      name: X-Authorization
