        "400": { description: "`code`: INVALID_PROJECT_VERSION_ID / INVALID_SCAN_ID.", content: { application/json: { schema: { $ref: "#/components/schemas/StpRelayErrorResponse" } } } }
        "502": { description: "`code`: STP_UPSTREAM_ERROR.", content: { application/json: { schema: { $ref: "#/components/schemas/StpRelayErrorResponse" } } } }
