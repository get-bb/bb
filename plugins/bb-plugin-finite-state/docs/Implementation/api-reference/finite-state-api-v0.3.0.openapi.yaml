          description: "The count of violations associated with this node's VersionComponent only."
          example: 2
        directWarnings:
          type: integer
          description: "The count of warnings associated with this node's VersionComponent only."
          example: 5
        subtreeViolations:
          type: integer
          description: "The total count of violations for all nodes in the subtree rooted at this node."
          example: 10
        subtreeWarnings:
          type: integer
          description: "The total count of warnings for all nodes in the subtree rooted at this node."
          example: 25
        subtreeViolationComponentsCount:
          type: integer
          description: "The count of components with violations > 0 in the subtree."
          example: 3
        subtreeWarningOnlyComponentsCount:
          type: integer
          description: "The count of components with warnings > 0 but no violations in the subtree."
          example: 5
        childrenCount:
          type: integer
          description: "The number of child dependencies for this node."
          example: 3
