        properties:
          architecture: { type: string, description: "Friendly architecture name, e.g. 'ARM aarch64', 'AMD x86-64', 'ARM Cortex-M', or 'Unknown'." }
          count: { type: integer, description: "Number of binaries/blobs with this architecture." }
    SecAssessArchitectureBreakdownResponse:
      type: array
      description: "Per-architecture breakdown rows with decoder/ISA detail across the firmware's analyzed binaries and detected executable blobs."
      items:
        type: object
        additionalProperties: true
        properties:
          architecture_name: { type: string, nullable: true, description: "Friendly architecture name." }
          header_code: { type: string, nullable: true, description: "Object-header architecture code (e.g. ELF/PE machine identifier)." }
          em_code: { type: string, nullable: true, description: "ELF e_machine code." }
          instruction_set: { type: string, nullable: true, description: "Decoder instruction set." }
          isa_variant: { type: string, nullable: true, description: "ISA variant/sub-architecture." }
          word_size: { type: integer, nullable: true, description: "Native word size in bits." }
          instruction_bits: { type: integer, nullable: true, description: "Instruction width in bits." }
          endian: { type: string, nullable: true, description: "Byte order, e.g. 'little' or 'big'." }
          format: { type: string, description: "Container format, e.g. 'elf', 'pe', 'raw'." }
          source: { type: string, description: "Provenance/confidence: 'elf_header', 'pe_header', or 'blob_heuristic'." }
          count: { type: integer, description: "Number of binaries/blobs matching this breakdown row." }
    SecAssessBinaryFileDetailsResponse:
      type: object
      additionalProperties: true
      description: "Rich per-file drilldown for a single binary (relayed verbatim from STP)."
      properties:
        file_hash: { type: string, description: "SHA-256 of the binary." }
        imports: { type: array, items: { type: string }, description: "Imported (dynamic) function names." }
        exports: { type: array, items: { type: string }, description: "Exported symbol names." }
        symbols: { type: array, items: { type: string }, description: "Symbol-table names." }
        library_dependencies: { type: array, items: { type: string }, description: "Library dependencies (e.g. DT_NEEDED names)." }
        functions: { type: array, items: { type: string }, description: "Identified function names (BINARY_SAST; may be empty if no SAST scan ran)." }
        unidentified_functions: { type: array, items: { type: string }, description: "Unidentified function names, e.g. 'FUN_...' (BINARY_SAST; may be empty)." }
    SecAssessBinaryImportMatchResponse:
      type: array
      description: "Binaries that import the searched symbol(s), one entry per matching binary (relayed verbatim from STP)."
      items:
        type: object
        additionalProperties: true
        properties:
          file_hash: { type: string, description: "SHA-256 of the matching binary." }
          file_paths: { type: array, items: { type: string }, description: "All firmware paths where this binary exists." }
          matched_imports: { type: array, items: { type: string }, description: "Searched import names this binary actually imports." }
    SecAssessBinaryExportMatchResponse:
      type: array
      description: "Binaries that export the searched symbol(s), one entry per matching binary (relayed verbatim from STP)."
      items:
        type: object
        additionalProperties: true
        properties:
          file_hash: { type: string, description: "SHA-256 of the matching binary." }
          file_paths: { type: array, items: { type: string }, description: "All firmware paths where this binary exists." }
          matched_exports: { type: array, items: { type: string }, description: "Searched export names this binary actually exports." }
    UpdateFindingStatusV0Request:
      type: object
      required:
        - status
      description: Request to update the status of a finding.
      properties:
        status:
          type: string
          description: The new status to set for the finding.
          enum: [ "NOT_AFFECTED", "FALSE_POSITIVE", "IN_TRIAGE", "RESOLVED_WITH_PEDIGREE", "RESOLVED", "EXPLOITABLE" ]
          example: "RESOLVED"
        justification:
          type: string
          description: Justification for the status change.
          enum: [ "CODE_NOT_PRESENT", "CODE_NOT_REACHABLE", "REQUIRES_CONFIGURATION", "REQUIRES_DEPENDENCY", "REQUIRES_ENVIRONMENT",
              "PROTECTED_BY_COMPILER", "PROTECTED_AT_RUNTIME", "PROTECTED_AT_PERIMETER", "PROTECTED_BY_MITIGATING_CONTROL" ]
          example: "CODE_NOT_REACHABLE"
        response:
          type: string
          description: The response action taken for the finding.
          enum: [ "CAN_NOT_FIX", "WILL_NOT_FIX", "UPDATE", "ROLLBACK", "WORKAROUND_AVAILABLE" ]
          example: "UPDATE"
        reason:
          type: string
          description: Optional comment explaining the status change.
          example: "Resolved after code review"
    BulkClearFindingStatusV0Request:
      type: object
      required:
        - findingIds
      description: Request to clear the status of multiple findings in bulk.
      properties:
        findingIds:
          type: array
          description: List of finding IDs to clear status for. IDs are passed as strings to preserve precision for large int64 values.
          items:
            type: string
            pattern: '^-?[0-9]+$'
          minItems: 1
          example: ["12345", "67890", "11223"]
    BulkSetFindingStatusV0Request:
      type: object
      required:
        - findings
      description: Request to apply a VEX status to multiple findings in bulk, each with its own verdict.
      properties:
        findings:
          type: array
          description: >
            Per-finding VEX verdicts. Applied best-effort; the response reports one result per item.
            An empty array is accepted and is a no-op (200 with empty results).
            Larger sets should be split across multiple requests.
          maxItems: 5000
          items:
            $ref: '#/components/schemas/BulkSetFindingStatusV0Item'
    BulkSetFindingStatusV0Item:
      type: object
      required:
        - findingId
        - status
      description: A single finding's VEX verdict.
      properties:
        findingId:
          type: string
          description: Finding ID, as a string to preserve precision for large int64 values.
          pattern: '^-?[0-9]+$'
          example: "12345"
        status:
          type: string
          description: The status to set for the finding.
          enum: [ "NOT_AFFECTED", "FALSE_POSITIVE", "IN_TRIAGE", "RESOLVED_WITH_PEDIGREE", "RESOLVED", "EXPLOITABLE" ]
          example: "RESOLVED"
        justification:
          type: string
          description: Justification for the status.
          enum: [ "CODE_NOT_PRESENT", "CODE_NOT_REACHABLE", "REQUIRES_CONFIGURATION", "REQUIRES_DEPENDENCY", "REQUIRES_ENVIRONMENT",
              "PROTECTED_BY_COMPILER", "PROTECTED_AT_RUNTIME", "PROTECTED_AT_PERIMETER", "PROTECTED_BY_MITIGATING_CONTROL" ]
          example: "CODE_NOT_REACHABLE"
        response:
          type: string
          description: The response action for the finding.
          enum: [ "CAN_NOT_FIX", "WILL_NOT_FIX", "UPDATE", "ROLLBACK", "WORKAROUND_AVAILABLE" ]
          example: "WILL_NOT_FIX"
        reason:
          type: string
          description: Optional comment explaining the verdict.
          example: "Not reachable in our configuration"
    BulkSetFindingStatusV0Response:
      type: object
      required:
        - status
        - summary
        - results
      description: >
        Outcome of a bulk set-status operation (best-effort per finding). `results` carries one entry
        per requested finding (successes and failures), so a caller can retry just the failures.
      properties:
        status:
          type: string
          description: >
            Overall outcome. "success" = every verdict applied; "partial_success" = some applied and
            some findings not found; "failure" = nothing applied (every id was not found). An empty
            request is "success".
          enum: [ "success", "partial_success", "failure" ]
        summary:
          $ref: '#/components/schemas/BulkSetFindingStatusV0Summary'
        results:
          type: array
          description: One entry per requested finding, in request order.
          items:
            $ref: '#/components/schemas/BulkSetFindingStatusV0Result'
    BulkSetFindingStatusV0Summary:
      type: object
      required:
        - total
        - succeeded
        - failed
      description: Per-bucket counts for the batch.
      properties:
        total:
          type: integer
          description: Number of findings in the request.
        succeeded:
          type: integer
          description: Number of findings whose status was applied.
        failed:
          type: integer
          description: Number of findings that were not found and so were skipped.
    BulkSetFindingStatusV0Result:
      type: object
      required:
        - findingId
        - success
      description: The outcome for a single requested finding.
      properties:
        findingId:
          type: string
          description: The requested finding ID.
        success:
          type: boolean
          description: Whether the verdict was applied to this finding.
        status:
          type: string
          nullable: true
          description: The VEX status that was applied (null when the finding was not found).
        error:
          type: string
          nullable: true
          description: Human-readable reason this finding was not updated (null on success).
    UpdateComponentStatusV0Request:
      type: object
      description: Request to update the status of a component.
      properties:
        status:
          type: string
          nullable: true
          description: The new status to set for the component. Set to null to clear the status.
          enum: [ "NEEDS_REVIEW", "IN_REVIEW", "CONFIRMED", "FALSE_POSITIVE", "UNKNOWN" ]
          example: "NEEDS_REVIEW"
        statusComment:
          type: string
          nullable: true
          description: Optional comment explaining the status change.
          example: "Component is confirmed to be safe"
        applyToAllInstances:
          type: boolean
          description: If true, applies the status update to all instances of this component within the project version.
          default: false
          example: false
    LicenseDetail:
      type: object
      description: Describes a specific license identified for a component.
      properties:
        id:
          type: string
          description: The license's unique identifier.
          example: 26
        license:
          type: string
          description: Full name of the license.
          example: "GNU General Public License v2.0"
        spdx:
          type: string
          description: SPDX identifier for the license.
          example: "GPL-2.0-only"
        policy:
          type: string
          description: Policy status associated with the license (e.g. WARNING, VIOLATION).
          example: "VIOLATION"
        url:
          type: string
          description: URL for additional information about the license.
          example: "https://tldrlegal.com/license/gnu-general-public-license-v2"
        copyleftFamily:
          type: string
          description: Is this license a copyleft license
          example: "PERMISSIVE"
        comment:
          type: string
          description: Optional comment associated with the license detail.
        licensePolicyLabel:
          type: string
          description: Optional organization-defined license policy label.
          example: "copyleft-blocker"
    ProductActivationV0:
      type: object
      description: A Finite State activation license document.
      properties:
        id:
          type: string
          description: "A unique identifier for this product activation, as provided by Finite State."
        version:
          type: string
          description: "The version identifier of this product activation.  Set to the string '0' for this object."
        payload:
          type: string
          description: "The payload of this product activation.  Treat this as an opaque string."
        signature:
          type: string
          description: "A digital signature attesting to the validity of the product activation.  Treat this as an opaque string."
        key_id:
          type: string
          description: "The key identifier used to sign this product activation.  Treat this as an opaque string."
      required:
        - id
        - version
        - payload
        - signature
        - key_id
    ProductActivationEntitlementsV0:
      type: object
      description: A Finite State activation entitlement.  This may be a string, a boolean, or limits.
      additionalProperties:
        oneOf:
          - $ref: '#/components/schemas/ProductActivationEntitlementStringV0'
          - $ref: '#/components/schemas/ProductActivationEntitlementBooleanV0'
          - $ref: '#/components/schemas/ProductActivationEntitlementNumericLimitsV0'
    ProductActivationEntitlementStringV0:
      type: object
      description: A string value for a single Finite State activation entitlement.
      properties:
        string_value:
          type: string
    ProductActivationEntitlementBooleanV0:
      type: object
      description: A boolean value for a single Finite State activation entitlement.
      properties:
        boolean_value:
          type: boolean
    ProductActivationEntitlementNumericLimitsV0:
      type: object
      description: Numeric limits for a single Finite State activation entitlement.
      properties:
        contracted_limit:
          description: "The contracted limit on this entitlement (null if there is no contracted limit)"
          oneOf:
            - type: "null"
            - type: "number"
        warning_threshold:
          description: |
            The warning threshold for this entitlement.
            When reached or exceeded, a warning will be presented.
            Null for no warning threshold.
          oneOf:
            - type: "null"
            - type: "number"
        enforcement_threshold:
          description: |
            The enforcement threshold for this entitlement.
            When reached or exceeded, the customer will be considered to be in violation of their license; denial of activities may continue.
            Null for no enforcement threshold.
          oneOf:
            - type: "null"
            - type: "number"
      required:
        - contracted_limit
        - warning_threshold
        - enforcement_threshold
    ProductActivationConditionV0:
      type: object
      description: "The current condition of a product activation."
      properties:
        condition:
          description: "The current state of this product activation."
          type: string
          enum:
            - active
            - inactive
            - grace_period
        entitlements_at_warning_threshold:
          $ref: '#/components/schemas/ProductActivationEntitlementsV0'
        entitlements_at_enforcement_threshold:
          $ref: '#/components/schemas/ProductActivationEntitlementsV0'
      required:
        - state
        - entitlements_at_warning_threshold
        - entitlements_at_enforcement_threshold
    ProjectV0:
      type: object
      description: A development project
      properties:
        id:
          type: string
          description: The project's unique identifier.
          example: 1234567890123456789
        name:
          type: string
          description: Name of the project.
          example: "Amazing product 1"
        description:
          type: string
          description: Description of the project.
          example: "Amazing product 1 firmware"
        created:
          type: string
          format: date-time
          description: Timestamp when the project was created (UTC)
          example: "2025-02-20T14:23:00Z"
        type:
          type: string
          description: Type of the project (e.g., application, library, etc.).
          example: "application"
        createdBy:
          type: string
          description: Identifies the project creator.
          example: "superstar@awesomeco.io"
        defaultBranch:
          $ref: "#/components/schemas/BranchV0"
        priorities:
          type: array
          items:
            $ref: '#/components/schemas/MergePriority'
        flagConflicts:
          type: boolean
        softwareIdentifiers:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SoftwareIdentifiersV0"
        folder:
          $ref: "#/components/schemas/FolderRef"
        isProduct:
          type: boolean
          description: "Whether this project is classified as a Product. Products show transitive dependency rollup counts."
        includeFilesInSbom:
          type: boolean
          description: "Whether SPDX SBOM exports for this project include file components by default."
        dependencyCount:
          type: integer
          description: "Number of direct dependency project versions. Only present when product classification is enabled."
        usedByCount:
          type: integer
          description: "Number of distinct non-deleted dependent project versions. Not RBAC-narrowed. Display-only — sorting and filtering not supported. Only present when product classification is enabled."
        actions:
          type: array
          description: List of actions the user can perform on this project
          items:
            type: string
          example: ["VIEW_PROJECT", "EDIT_PROJECT", "DELETE_PROJECT"]
    ScanRecordV0:
      type: object
      description: Summary of the most recent scan for a project version
      properties:
        id:
          type: string
          description: Scan identifier
          example: "1234567890"
        type:
          type: string
          description: Scan type
          example: "SBOM_IMPORT"
        status:
          type: string
          description: Scan status
          example: "COMPLETED"
        fsanId:
          type: string
          nullable: true
          description: Finite State Analysis ID
        orgId:
          type: string
          nullable: true
          description: Organization ID associated with the scan
        completed:
          type: string
          format: date-time
          nullable: true
          description: Completion timestamp (UTC)
        bssMessage:
          type: string
          nullable: true
          description: Backend scan service message
        created:
          type: string
          format: date-time
          description: Creation timestamp (UTC)
        mechanism:
          type: string
          description: Scan mechanism
          example: "INTERNAL"
        initiatedBy:
          type: string
          description: Username who initiated the scan
    SoftwareIdentifiersV0:
      type: object
      description: Software identifiers for a project
      properties:
        cpes:
          type: array
          description: Common Platform Enumeration (CPE) identifiers
          items:
            type: string
          example: ["cpe:2.3:a:example:product:1.0.0:*:*:*:*:*:*:*"]
        purls:
          type: array
          description: Package URL (PURL) identifiers
          items:
            type: string
          maxItems: 1
          example: ["pkg:maven/org.springframework/spring-core@5.3.20"]
        swidTags:
          type: array
          description: Software Identification (SWID) tags
          items:
            type: string
          example: ["urn:example:software:product:1.0.0"]
        udis:
          type: array
          description: Universal Device Identifiers (UDIs)
          items:
            type: string
          example: ["udi:example:device:12345"]
        upcs:
          type: array
          description: Universal Product Codes (UPCs)
          items:
            type: string
          example: ["123456789012"]
        gtins:
          type: array
          description: Global Trade Item Numbers (GTINs)
          items:
            type: string
          example: ["1234567890123"]
        gmns:
          type: array
          description: Global Model Numbers (GMNs)
          items:
            type: string
          example: ["GMN123456"]
        generic:
          type: array
          description: Generic identifiers
          items:
            type: string
          example: ["generic:example:product:1.0.0"]
    ProjectRef:
      type: object
      description: Reduced set of key project data.
      properties:
        id:
          type: string
          description: The project's unique identifier.
          example: 2345678901234567891
        name:
          type: string
          description: Name of the project.
          example: "Test Project 2"
    SbomCdx:
      type: string
      description: SBOM content in a CycloneDX format.
      format: binary
    SbomSpdx:
      type: object
      description: SBOM content in a SPDX format.
      additionalProperties:
        type: object
    ScanV0:
      type: object
      description: A scan instance
      properties:
        id:
          type: string
          description: The unique identifier of the scan
        type:
          type: string
          description: The type of scan performed
        status:
          type: string
          enum: [INITIAL, PENDING_UPLOAD, UPLOAD_FAILED, COMPLETED, ERROR, STARTED, NOT_APPLICABLE]
          description: The current status of the scan
        fsanId:
          type: string
          description: The Finite State Analysis ID
        orgId:
          type: string
          description: The organization ID
        completed:
          type: string
          format: date-time
          description: The timestamp when the scan was completed
        errorMessage:
          type: string
          nullable: true
          description: Additional message or details about the scan
        created:
          type: string
          format: date-time
          description: The timestamp when the scan was created
        project:
          $ref: "#/components/schemas/ProjectRef"
        branch:
          $ref: "#/components/schemas/BranchRef"
        projectVersion:
          $ref: "#/components/schemas/VersionRef"
    UnpackPotentialIssueV0:
      type: object
      description: A potential issue encountered during unpacking with associated filepath context and recommendations
      properties:
        relevantFilepaths:
          type: array
          items:
            type: string
          maxItems: 50
          description: List of filepaths relevant to this potential unpacking issue. Empty if no specific filepaths are relevant.
          example: ["/data/config.zip", "/lib/firmware/module.bin"]
        description:
          type: string
          maxLength: 256
          description: Brief description of the potential unpacking issue
          example: "Encrypted archive could not be unpacked"
        recommendation:
          type: string
          maxLength: 256
          description: Actionable recommendation for the user to investigate or resolve the issue
          example: "Provide decryption key or password-protected archive credentials"
    UnpackEvaluationReportV0:
      type: object
      description: AI-generated unpack evaluation report containing quality assessment and recommendations
      properties:
        unpackingScore:
          type: integer
          minimum: 1
          maximum: 100
          description: Score from 1-100 representing how well the unpacking process performed. 100 indicates all content extracted correctly with no concerns. 1 indicates nothing unpacked correctly and downstream analysis is unreliable.
          example: 85
        shortSummary:
          type: string
          maxLength: 128
          description: A brief one-sentence summary of the unpack quality suitable for display in a UI
          example: "Binary unpacking was successful with minor issues detected in 2 archive files."
        summary:
          type: string
          maxLength: 512
          description: A detailed summary of the unpack process, highlighting key findings and overall quality
          example: "The binary analysis completed successfully. All major file formats were properly unpacked..."
        potentialIssues:
          type: array
          items:
            $ref: "#/components/schemas/UnpackPotentialIssueV0"
          maxItems: 10
          description: List of potential issues with filepaths, descriptions, and recommendations
    UnpackEvaluationResponseV0:
      type: object
      description: Response containing the AI-generated unpack evaluation for a scan
      properties:
        fsanId:
          type: string
          description: The Finite State Analysis ID associated with this evaluation
          example: "abc123-def456-ghi789"
        scanId:
          type: string
          description: The STP scan ID that produced this evaluation
          example: "scan-001-xyz"
        report:
          $ref: "#/components/schemas/UnpackEvaluationReportV0"
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the evaluation was created (ISO-8601 format)
          example: "2024-03-15T14:30:00Z"
    UserV0:
      type: object
      required: ["id", "userId", "email", "authenticationMethod", "status", "created"]
      properties:
        id:
          type: string
          description: "The server-assigned, opaque primary key of this user."
          example: "1701"
        userId:
          type: string
          description: "The (immutable once created, unique to the customer) user identifier."
          example: "aaron.aaronson"
        email:
          type: string
          description: "The email address of the user."
          example: "aaron.aaronson@hello.example"
        firstName:
          type: string
          description: "The first name of the user, if it's available."
          example: "Aaron"
        lastName:
          type: string
          description: "The last name of the user, if it's available."
          example: "Aaronson"
        eulaAccepted:
          type: boolean
          description: "Indicates whether the user has accepted the End User License Agreement (EULA)."
          example: true
        eulaAcceptedAt:
          type: string
          format: date-time
          description: "The timestamp when the user accepted the EULA."
          example: "2023-08-15T14:30:00Z"
        authenticationMethod:
          type: string
          description: |
            The name of the identity provider backing this user information.
            If this is set to `finite-state`, the user is managed by the Finite State IdP.
        created:
          type: string
          format: date-time
          description: "The time this user was created as defined by RFC 3309, section 5.6"
          example: "2024-05-14T17:32:28Z"
        lastLoginTimestamp:
          type: string
          format: date-time
          nullable: true
          description: "The last login timestamp of this user as defined by RFC 3309, section 5.6, if it is available."
          example: "2017-07-21T17:32:28Z"
        status:
          type: string
          enum: ["ENABLED", "DISABLED", "PASSWORD_RESET_REQUIRED"]
          description: "The current status of this user."
        orgRoles:
          type: array
          description: "The list of organization roles assigned to the user"
          items:
            type: string
          example: [ "Global admin" ]
    VersionV0:
      type: object
      description: A version of a project's branch the provides the version's scan results.
      properties:
        id:
          type: string
          description: The version's unique identifier.
          example: 3456789012345678913
        name:
          type: string
          description: Name of the version.
          example: "2-25 Scan 1"
        created:
          type: string
          format: date-time
          description: Timestamp when the version was created.
          example: "2025-02-27T01:32:10Z"
        components:
          type: integer
          description: Number of software components detected in this version.
          example: 0
        findings:
          type: integer
          description: Number of software findings detected in this version.
          example: 0
        violations:
          type: integer
          description: Number of policy violations identified in this version.
          example: 0
        warnings:
          type: integer
          description: Number of policy warnings identified in this version.
          example: 0
        project:
          $ref: "#/components/schemas/ProjectRef"
        branch:
          $ref: "#/components/schemas/BranchRef"
        latestScan:
          $ref: "#/components/schemas/ScanRecordV0"
    VersionRef:
      type: object
      description: Reduced set of key version data.
      properties:
        id:
          type: string
          description: The version's unique identifier.
          example: 3456789012345678913
        version:
          type: string
          description: Name of the version.
          example: "2-25 Scan 1"
        created:
          type: string
          format: date-time
          description: Timestamp when the version was created.
          example: "2025-02-27T01:32:10Z"
        updated:
          type: string
          format: date-time
          description: Timestamp when the version was last updated.
          example: "2025-02-27T14:23:00Z"
    AffectedComponentRef:
      type: object
      description: Affected component by a CVE
      properties:
        id:
          type: string
          description: Unique identifier for the software component.
          example: "345678901234567890"
        projectId:
          type: string
          description: Unique identifier for the component's project.
          example: "3456789012345678913"
        projectVersionId:
          type: string
          description: Unique identifier for the component's project version.
          example: "3456789012345678913"
        name:
          type: string
          description: >
            Name of the component, typically including group/artifact identifiers.
          example: "org.springframework/spring-expression"
        vcId:
          type: string
          description: Unique identifier for the version component.
          example: "456789012345678901"
        version:
          type: string
          description: The component's version number.
          example: "4.1.6.RELEASE"
        licenses:
          type: string
          description: SPDX license identifier(s) summarizing licensing of the component.
          example: "GPL-2.0-only"
      required:
        - projectId
        - projectVersionId
        - name
        - vcId
        - version
    ProjectLatestVersionV0:
      type: object
      description: Summary of a project and its latest version for the project's default branch
      properties:
        id:
          type: string
