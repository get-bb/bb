  /public/v0/scans/sbom:
    post:
      summary: Upload a CycloneDX or SPDX SBOM to a specified version.
        Used for testing only.
      operationId: uploadSbomFile
      tags: [ scans ]
      parameters:
        - name: type
          description: |
            SBOM scans that are supported
          in: query
          required: true
          schema:
            type: string
            enum: ["cdx", "spdx"]
        - name: filename
          description: The name of the uploaded file
          in: query
          required: true
          schema:
            type: string
            pattern: "^[a-zA-Z0-9. -_()]{1,60}$"
        - name: projectVersionId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: scanType
          in: query
          required: false
          description: |
            Classifies the uploaded SBOM.
            - sbom_import: Treat the SBOM as a generic SBOM import.
            - source_sca: Treat a CycloneDX SBOM as source code scan results so the scan is recorded as `SOURCE_SCA`.
          schema:
            type: string
            default: "sbom_import"
            enum: ["sbom_import", "source_sca"]
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: SPDX SBOM upload accepted and queued through the standard upload pipeline.
        '204':
          description: CycloneDX SBOM accepted and queued through direct ingestion.
        '402':
          description: Product activation entitlement check failed for the requested scan type.
        '400':
          description: Invalid request
        '401':
          description: Unauthorized access.
        '403':
          description: Forbidden access.
        '404':
          description: "Project version not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/scans/upload:
    post:
      summary: Create a scan and get direct S3 upload details.
      description: |
        Creates a scan job and returns either:
        - a single presigned S3 URL for direct upload, or
        - a multipart S3 upload ID for large uploads.

        Usage flow:
        1. Call this endpoint with scan metadata to get upload details.
        2. If `multipartUpload` is `false`, PUT the file directly to the returned `uploadUrl`.
        3. If `multipartUpload` is `true`, call the multipart part URL endpoint for each part,
           upload each part, then call the multipart complete endpoint.
        4. Call `POST /public/v0/scans/{scanId}/start` to begin processing.
      tags: [ scans ]
      operationId: createScanUpload
      parameters:
        - name: projectVersionId
          description: The unique ID of the project version to associate the scan with.
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanUploadRequestV0"
      responses:
        "200":
          description: |
            Scan created successfully. For single-part uploads, use `uploadUrl`.
            For multipart uploads, use `s3UploadId` with the multipart upload endpoints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanUploadV0"
        "400":
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "404":
          description: The project version specified by projectVersionId was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "500":
          description: Internal error generating upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/scans/{scanId}/multipart/{s3UploadId}/{partNumber}/url:
    get:
      summary: Get a presigned URL for a multipart upload part.
      description: |
        Returns a presigned S3 URL for uploading one part of a multipart upload that was created via
        `POST /public/v0/scans/upload` with `multipartUpload` set to `true`.
      tags: [ scans ]
      operationId: getScanUploadPartUrl
      parameters:
        - name: scanId
          description: The scan ID returned by the upload endpoint.
          in: path
          required: true
          schema:
            type: string
        - name: s3UploadId
          description: The multipart S3 upload ID returned by the upload endpoint.
          in: path
          required: true
          schema:
            type: string
        - name: partNumber
          description: The multipart part number to upload. Must be a positive integer (1–10000).
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 10000
      responses:
        "200":
          description: Presigned URL returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanUploadPartUrlV0"
        "400":
          description: Invalid scanId or partNumber format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "403":
          description: The user does not have permission to access this scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "404":
          description: The scan or multipart upload was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "409":
          description: The scan was not created for multipart upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "500":
          description: Internal error generating the multipart upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/scans/{scanId}/multipart/{s3UploadId}/complete:
    post:
      summary: Complete a multipart upload after all parts are uploaded.
      description: |
        Completes a multipart S3 upload that was created via `POST /public/v0/scans/upload`
        with `multipartUpload` set to `true`. Call this after all parts have been uploaded
        and their ETags have been collected.
      tags: [ scans ]
      operationId: completeScanMultipartUpload
      parameters:
        - name: scanId
          description: The scan ID returned by the upload endpoint.
          in: path
          required: true
          schema:
            type: string
        - name: s3UploadId
          description: The multipart S3 upload ID returned by the upload endpoint.
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteMultipartUploadRequestV0"
      responses:
        "200":
          description: Multipart upload completed successfully.
        "400":
          description: Invalid request body or scanId format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "403":
          description: The user does not have permission to access this scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "404":
          description: The scan or multipart upload was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "409":
          description: The scan was not created for multipart upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/scans/{scanId}/start:
    post:
      summary: Start processing a scan after the file has been uploaded to S3.
      description: |
        Triggers scan processing for a scan that was previously created via
        `POST /public/v0/scans/upload`. Call this after the file has been
        successfully uploaded to the presigned S3 URL, or after a multipart
        upload has been completed.
      tags: [ scans ]
      operationId: startScanProcessing
      parameters:
        - name: scanId
          description: The scan ID returned by the upload endpoint.
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scan processing has been started.
        "400":
          description: Invalid scanId format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "404":
          description: The scan with the given ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/scans/{scanId}/files:
    get:
      summary: Download a file from STP by SHA-256 hash
      description: |
        Downloads a file from Finite State's SCA (Software Composition Analysis) scan.
        The file is identified by its SHA-256 hash provided via the filter parameter.
        
        Note: This endpoint only works for SCA scan types. Other scan types (SAST, CONFIG, etc.) 
        do not have downloadable files available through this endpoint.
      tags: [ scans ]
      operationId: downloadScanFile
      parameters:
        - name: scanId
          description: |
            The unique ID of the scan. This is the `id` field returned by the `/public/v0/scans` endpoint.
          in: path
          required: true
          schema:
            type: string
        - name: filter
          description: |
            Filter to specify which file to download.
            The supported filter attribute is:
            - `hash` - the SHA-256 hash of the file, e.g. filter=hash=="a1b2c3d4e5f6..."
            - See the Filtering section in this specification's description for more information.
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File successfully retrieved
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid request parameters or filter format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        '401':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        '403':
          description: User does not have permission to access this scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        '404':
          description: Scan or file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/scans/{scanId}/unpack-evaluation:
    get:
      summary: Get AI-generated unpack evaluation report for a scan
      description: |
        Returns the AI-generated unpack evaluation report for the specified scan.
        The evaluation includes a quality score, summary, potential issues, and recommendations 
        to improve analysis quality.
        
        This endpoint is only available for binary SCA scans that have completed processing.
        Legacy scans that predate this feature will return a 404 status.
      tags: [ scans ]
      operationId: getUnpackEvaluationV0
      parameters:
        - name: scanId
          description: |
            The unique ID of the scan. This is the `id` field returned by the `/public/v0/scans` endpoint.
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unpack evaluation report successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnpackEvaluationResponseV0'
        '400':
          description: Invalid scanId format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        '401':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        '403':
          description: User does not have permission to access this scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        '404':
          description: Scan not found or unpack evaluation not available for this scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/api-tokens:
    get:
      description: "Retrieves all API tokens for the active user."
      tags: [ apiTokens ]
      parameters:
        - name: filter
          description: |
            Filter applied to the findings to be returned.
            The supported filter attributes are:
            - `name` - the API token name, e.g. `my-token`
            - See the Filtering section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: string
        - name: sort
          description: |
            Sort ordering applied to the findings to be returned.
            The allowed sort values are specified in this parameter's enumeration.
            See the Sorting section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: string
            enum: [ "name:asc", "name:desc", "createdTimestamp:asc", "createdTimestamp:desc", "createdBy:asc", "createdBy:desc" ]
        - name: offset
          description: |
            The number of findings to skip before returning results.
            See the Pagination section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          description: |
            The maximum number of findings to return.
            See the Pagination section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: "The list of API tokens for the active user."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiToken"
        "400":
          description: "Invalid request parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
    post:
      description: "Creates an API token for the active user."
      tags: [ apiTokens ]
      responses:
        "201":
          description: "The API token was successfully created.  Body follows."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiToken"
        "400":
          description: "A validation error occurred while checking the given API token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
      requestBody:
        description: "The API token to create."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiToken"
  /public/v0/api-tokens/{api-token-id}:
