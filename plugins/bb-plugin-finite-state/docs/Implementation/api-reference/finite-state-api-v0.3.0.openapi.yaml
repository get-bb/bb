          required: false
          schema: { type: integer, default: 0, minimum: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 500, minimum: 1, maximum: 10000 }
        - name: scanId
          description: >-
            Optional. Address a specific scan of this project version instead of the default (latest
            successful binary scan). The firmware (fsan) is resolved from that scan.
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Config-file summaries (relayed verbatim from STP).
