  /public/v0/projects:
    get:
      description: Get the list of projects
      tags: [ projects ]
      operationId: getProjectsV0
      parameters:
        - name: filter
          description: |
            Filter applied to the projects to be returned.
            The supported filter attributes are:
            - `created` - the UTC formatted time the project was created, e.g. `2025-02-25T14:23:00`
            - `createdBy` - the project creators username, e.g. `dev@awseome.com`
            - `name` - name assigned to the project - e.g. `Awesome Product 1`
            - `type` - the type of project - e.g. `application` 
            - `components` - count of components for the default branch latest version (supports `==`, `>`, `>=`, `<`, `<=`)
            - `findings` - count of findings (vulnerabilities) for the default branch latest version (supports `==`, `>`, `>=`, `<`, `<=`)
            - `violations` - count of policy violations for the default branch latest version (supports `==`, `>`, `>=`, `<`, `<=`)
            - `warnings` - count of policy warnings for the default branch latest version (supports `==`, `>`, `>=`, `<`, `<=`)
            - `lastScanCreated` - timestamp of the most recent scan creation (UTC, supports `==`, `>`, `>=`, `<`, `<=`)
            - `lastScanCompleted` - timestamp of the most recent scan completion (UTC, supports `==`, `>`, `>=`, `<`, `<=`)

            Examples:
            - `components>=2 and components<=10`
            - `findings>0`
            - `lastScanCompleted>=2025-01-01T00:00:00Z and lastScanCompleted<=2025-12-31T23:59:59Z`
            - See the Filtering section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: string
        - name: sort
          description: |
            Sort ordering applied to the projects to be returned.
            Supports comma-separated multi-field sort, e.g. `lastScan:asc,created:desc`.
            Each segment uses the format `field:direction` where direction is `asc` or `desc`.
            Supported fields: `created`, `createdBy`, `name`, `type`, `components`,
            `findings`, `policy`, `lastScan`, `dependencyCount`.
            See the Sorting section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: string
        - name: archived
          description: |
            Specified whether archived projects should be returned. 
            A project is archived if it has been deleted.
            Archived projects are returned when the value is true.
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: offset
          description: |
            The number of projects to skip before returning results.
            See the Pagination section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          description: |
            The maximum number of projects to return.
            See the Pagination section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectV0"
        "400":
          description: This request failed to validate against this specification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        '404':
          description: The request's path is not valid.
    post:
      description: Create a new project
      tags: [ projects ]
      operationId: createProjectV0
      requestBody:
        required: true
        description: Project creation details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectV0Request"
      responses:
        "200":
          description: Project was successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectV0"
          links:
            GetProject:
              operationId: getProjectV0
              parameters:
