        crypto_id: { type: string }
        file_hash: { type: string }
        file_paths: { type: array, items: { type: string } }
        material_type: { type: string }
        algorithm: { type: string, nullable: true }
        key_size: { type: integer, nullable: true }
        private_key: { type: boolean }
        issuer_cn: { type: string, nullable: true }
        subject_cn: { type: string, nullable: true }
