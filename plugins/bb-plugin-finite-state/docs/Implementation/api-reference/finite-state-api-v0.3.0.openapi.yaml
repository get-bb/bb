                projectVersionId: '$response.body#/id'
        "400":
          description: This request failed to validate against this specification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        '404':
          description: The request's branchId is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
      requestBody:
        description: New version request document
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVersionRequest'
  /public/v0/projects/versions/{projectVersionId}/filesystem/tree:
    get:
      description: |
        Navigate the unpacked firmware filesystem for a project version (metadata only:
        path, content hash, type, child links). Backed by the STP file-tree. Requires
        findings-read access to the project version; the firmware (fsan) and org are
        resolved server-side from the version's scan, never supplied by the caller.
      tags: [ filesystem ]
      operationId: getFilesystemTree
      parameters:
        - name: projectVersionId
          description: The project version whose firmware filesystem to navigate.
          in: path
          required: true
          schema:
            type: string
        - name: path
          description: Filesystem path to expand. Defaults to the root "/".
          in: query
          required: false
          schema:
            type: string
            default: "/"
        - name: depth
          description: Number of levels to expand (1-8).
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 8
        - name: scanId
          description: >-
            Optional. Address a specific scan of this project version instead of the default
            (the latest successful binary scan with an unpacked filesystem). Accepts a scan id
            belonging to this project version; the firmware (fsan) is resolved from that scan.
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The filesystem tree below the given path (a single root node with nested children).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesystemTreeNode"
        "404":
          description: >-
            Resource not found. The `code` field distinguishes the cause:
            PROJECT_VERSION_NOT_FOUND (no such project version), SCAN_NOT_FOUND (a scanId was
            supplied but no such scan exists for this version), NO_FILESYSTEM_SCAN (the version
            has no completed binary scan with an unpacked filesystem), or PATH_NOT_FOUND (the
            requested path does not exist in the filesystem).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StpRelayErrorResponse"
        "403":
          description: >-
            The caller lacks findings-read access to this project version
            (RequiredPermissionsInterceptor rejects unauthorized callers).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "400":
          description: >-
            Bad request. The `code` field distinguishes the cause: INVALID_PROJECT_VERSION_ID
            or INVALID_SCAN_ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StpRelayErrorResponse"
  /public/v0/projects/versions/{projectVersionId}/filesystem/file:
    get:
      description: |
        Download the raw bytes of a single file from the unpacked firmware filesystem of a
        project version, addressed by its SHA-256 content hash (from the filesystem tree).
        The response is streamed (not buffered) to support large files. The firmware (fsan)
        and org are resolved server-side from the version's scan, never supplied by the caller.

        Raw-byte download requires an admin (the org-level VIEW_ANY_PROJECT_FILE action) — a higher
        bar than the metadata `/tree` endpoint (findings-read). Non-admin callers receive 403.
      tags: [ filesystem ]
      operationId: getFilesystemFile
      parameters:
        - name: projectVersionId
          description: The project version whose firmware file to download.
          in: path
          required: true
          schema:
            type: string
        - name: hash
          description: SHA-256 content hash of the file to download (the file_hash from the tree).
          in: query
          required: true
          schema:
            type: string
        - name: scanId
          description: >-
            Optional. Address a specific scan of this project version instead of the default
            (the latest successful binary scan with an unpacked filesystem). Accepts a scan id
            belonging to this project version; the firmware (fsan) is resolved from that scan.
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The raw file bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: >-
            Resource not found. The `code` field distinguishes the cause:
            PROJECT_VERSION_NOT_FOUND (no such project version), SCAN_NOT_FOUND (a scanId was
            supplied but no such scan exists for this version), NO_FILESYSTEM_SCAN (the version
            has no completed binary scan with an unpacked filesystem), or FILE_NOT_FOUND (no
            file with the given hash exists in the filesystem).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StpRelayErrorResponse"
        "403":
          description: >-
            The caller is not authorized to download raw files. Raw-byte download requires the
            org-level VIEW_ANY_PROJECT_FILE action (admin); the metadata /tree endpoint does not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "400":
          description: >-
            Bad request. The `code` field distinguishes the cause: INVALID_PROJECT_VERSION_ID,
            INVALID_SCAN_ID, or INVALID_FILE_HASH. (A missing/empty required `hash` is rejected by
            the request validator with a generic 400 — no `code`.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StpRelayErrorResponse"
  /public/v0/projects/versions/{projectVersionId}/filesystem/overview:
    get:
      description: |
        Per-file overview metadata for a single file in the unpacked firmware filesystem,
        addressed by its SHA-256 content hash: size, MIME/full type, all hash digests
        (md5/sha1/sha256/…), CPU architecture, binary security features (NX/PIE/RELRO/ASLR/…),
        and any processing errors. Metadata only (no file bytes) — findings-read, like /tree.
        The firmware (fsan) and org are resolved server-side, never supplied by the caller.
      tags: [ filesystem ]
      operationId: getFilesystemOverview
      parameters:
        - name: projectVersionId
          description: The project version whose firmware file to describe.
          in: path
          required: true
          schema:
            type: string
        - name: hash
          description: SHA-256 content hash of the file (the file_hash from the tree).
          in: query
          required: true
          schema:
            type: string
        - name: scanId
          description: >-
            Optional. Address a specific scan of this project version instead of the default
            (the latest successful binary scan with an unpacked filesystem).
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The file overview (size, type, hashes, security features, errors).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileOverviewV0"
        "404":
          description: >-
            Resource not found. The `code` field distinguishes the cause:
            PROJECT_VERSION_NOT_FOUND, SCAN_NOT_FOUND, NO_FILESYSTEM_SCAN, or FILE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StpRelayErrorResponse"
        "403":
          description: >-
            The caller lacks findings-read access to this project version
            (RequiredPermissionsInterceptor rejects unauthorized callers).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "400":
          description: >-
            Bad request. The `code` field distinguishes the cause: INVALID_PROJECT_VERSION_ID
            or INVALID_SCAN_ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StpRelayErrorResponse"
  /public/v0/projects/versions/{projectVersionId}/filesystem/content:
    get:
      description: |
        Read a bounded chunk of a single file's RAW BYTES from the unpacked firmware filesystem,
        addressed by SHA-256 content hash — for ranged reads of large files without downloading
        the whole thing. Returns up to `maxBytes` (capped at 131072 = 128 KiB) starting at `offset`.

        Like the full download (/file), this returns raw bytes and therefore requires an admin
        (the org-level VIEW_ANY_PROJECT_FILE action); non-admin callers receive 403. The firmware
        (fsan) and org are resolved server-side, never supplied by the caller.
      tags: [ filesystem ]
      operationId: getFilesystemContent
      parameters:
        - name: projectVersionId
          description: The project version whose firmware file to read.
          in: path
          required: true
          schema:
            type: string
        - name: hash
          description: SHA-256 content hash of the file (the file_hash from the tree).
          in: query
          required: true
          schema:
            type: string
        - name: offset
          description: Byte offset to start reading from.
          in: query
          required: false
          schema:
            type: integer
            format: int64
            default: 0
            minimum: 0
        - name: maxBytes
          description: Maximum number of bytes to return (capped at 131072 = 128 KiB).
          in: query
          required: false
          schema:
            type: integer
            default: 4096
            minimum: 1
            maximum: 131072
        - name: scanId
          description: >-
            Optional. Address a specific scan of this project version instead of the default
            (the latest successful binary scan with an unpacked filesystem).
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The requested chunk of raw file bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: >-
            Resource not found. The `code` field distinguishes the cause:
            PROJECT_VERSION_NOT_FOUND, SCAN_NOT_FOUND, NO_FILESYSTEM_SCAN, or FILE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StpRelayErrorResponse"
        "403":
          description: >-
            The caller is not authorized to read raw file bytes. Ranged content (like download)
            requires the org-level VIEW_ANY_PROJECT_FILE action (admin).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "400":
          description: >-
            Bad request. The `code` field distinguishes the cause: INVALID_PROJECT_VERSION_ID,
            INVALID_SCAN_ID, or INVALID_FILE_HASH. (A missing `hash` or out-of-range offset/maxBytes
            is rejected by the request validator with a generic 400 — no `code`.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StpRelayErrorResponse"
  /public/v0/projects/versions/{projectVersionId}/security-assessment/configs/list:
    get:
      description: |
        List the parsed configuration files (Augeas) discovered in a project version's firmware —
        metadata only (file hash, paths, Augeas module). Use /security-assessment/configs/details
