  /public/v0/api-tokens/bulk-delete:
    post:
      description: "Bulk deletes API tokens by IDs. Only tokens visible to the user will be deleted. Tokens that are not visible to the user will be silently skipped."
      tags: [ apiTokens ]
      operationId: bulkDeleteApiTokens
      requestBody:
        description: "Array of API token ID strings to delete."
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              example: [ "1", "2", "3" ]
      responses:
        "204":
          description: "The bulk delete operation was accepted. Only tokens visible to the user were deleted."
        "400":
          description: "A validation error occurred. Either the request body is empty or contains invalid token ID format."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/users/{id}:
    get:
      summary: "Gets a user by their user ID."
      operationId: "getUserById"
      tags: [ users ]
      parameters:
        - name: id
          description: "The primary key of the user."
          in: path
          required: true
          schema:
            type: string
        - name: enrich
          description: |
            Level of Keycloak enrichment. 'basic' skips lastLogin and IDP lookups (fast).
            'full' (default) includes all fields including lastLogin and IDP (slower).
          in: query
          required: false
          schema:
            type: string
            enum: [basic, full]
            default: full
      responses:
        "200":
          description: "The user with the given ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserV0"
        "400":
          description: Invalid projectVersionId format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "401":
          description: "Authentication is required for this endpoint."
        "404":
          description: "A user with the given user ID could not be found."
    put:
      operationId: "updateUserById"
      tags: [ users ]
      parameters:
        - name: id
          description: "The primary key of the user."
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: "Details of the user to be updated."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserV0'
      responses:
        "200":
          description: "The user has been updated successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserV0"
        "400":
          description: "Invalid request data."
        "401":
          description: "Authentication is required for this endpoint."
        "404":
          description: "Resource not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
    delete:
      summary: "Deletes a user with the given ID."
      operationId: "deleteUserById"
      tags: [ users ]
      parameters:
        - name: id
          description: "The primary key of the user."
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "The user with the given ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserV0"
        "400":
          description: "Invalid request parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "401":
          description: "Authentication is required for this endpoint."
        "404":
          description: "A user with the given user ID could not be found."
  /public/v0/users/:
    get:
      summary: "Gets a list of users"
      operationId: "getUsers"
      tags: [ users ]
      parameters:
        - name: filter
          description: |
            Filter applied to the users to be returned.
            The supported filter attributes are:
            - `username` - username of the user
            - `email` - email address of the user
            - See the Filtering section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: string
        - name: sort
          description: |
            Sort ordering applied to the components to be returned.
            The allowed sort values are specified in this parameter's enumeration.
            See the Sorting section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: string
            default: "username:asc"
            enum: [
              "username:asc",
              "username:desc",
              "email:asc",
              "email:desc",
              "created:asc",
              "created:desc",
              ""
            ]
        - name: offset
          description: |
            The number of components to skip before returning results.
            See the Pagination section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          description: |
            The maximum number of components to return.
            See the Pagination section in this specification's description for more information.
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: enrich
          description: |
            Level of Keycloak enrichment. 'basic' returns id/email/name only (fast).
            'full' includes lastLogin, IDP, status (slower).
          in: query
          required: false
          schema:
            type: string
            enum: [basic, full]
            default: full
      responses:
        '200':
          description: A list of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserV0'
        "401":
          description: "Authentication is required for this endpoint."
    post:
      summary: "Adds a new user."
      operationId: "addUser"
      tags: [ users ]
      requestBody:
        required: true
        description: "Details of the user to be created."
        content:
          application/json:
            schema:
              type: object
              required: [ "userId", "email" ]
              properties:
                userId:
                  type: string
                  description: "The (immutable once created, unique to the customer) user identifier."
                  example: "john.doe"
                email:
                  type: string
                  description: "The email address of the user."
                  example: "john.doe@example.com"
                firstName:
                  type: string
                  description: "The first name of the user."
                  example: "John"
                lastName:
                  type: string
                  description: "The last name of the user."
                  example: "Doe"
                orgRoles:
                  type: array
                  description: "The list of organization roles assigned to the user"
                  items:
                    type: string
                  example: [ "super_user" ]
      responses:
        "200":
          description: "The user has been created successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserV0"
          links:
            GetUser:
              operationId: getUserById
              parameters:
                id: '$response.body#/id'
            UpdateUser:
              operationId: updateUserById
              parameters:
                id: '$response.body#/id'
            DeleteUser:
              operationId: deleteUserById
              parameters:
                id: '$response.body#/id'
        "400":
          description: "Invalid request data."
        "401":
          description: "Authentication is required for this endpoint."
        "409":
          description: "A user with the same user ID already exists."
  /public/v0/users/{id}/password-reset:
