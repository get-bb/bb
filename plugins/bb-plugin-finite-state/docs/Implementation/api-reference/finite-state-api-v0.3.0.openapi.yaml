  /public/v0/fsscan/update-check:
    get:
      description: |
        Check whether a newer version of a signed binary product (fs-scan or
        fs-cli) is available for the given platform. Called by the client on
        startup.
      tags: [ fsscan ]
      operationId: checkForFsscanUpdate
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: string
          description: Current client version (e.g. "v2.1.0")
          example: "v2.1.0"
        - name: os
          in: query
          required: true
          schema:
            type: string
            enum: [ linux, darwin, windows ]
          description: Runtime operating system
          example: "darwin"
        - name: arch
          in: query
          required: true
          schema:
            type: string
            enum: [ amd64, arm64 ]
          description: Runtime CPU architecture
          example: "arm64"
        - name: product
          in: query
          required: false
          schema:
            type: string
            enum: [ fs-scan, fs-cli ]
            default: fs-scan
          description: |
            Signed binary product to check for updates. Selects which S3 release
            prefix the server reads from. Defaults to `fs-scan` so pre-existing
            fs-scan clients that do not send the parameter continue to receive
            identical behavior (back-compat).
          example: "fs-cli"
      responses:
        "200":
          description: A newer version is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsscanUpdateResponse"
        "204":
          description: Client is already up to date
        "400":
          description: Missing required query parameters, invalid platform values, or invalid product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsscanErrorResponse"
        "401":
          description: Unauthorized access
        "500":
          description: Failed to generate a download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsscanErrorResponse"
        "503":
          description: Update check temporarily unavailable (S3 infrastructure error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsscanErrorResponse"
  /public/v0/config/updates:
    get:
      summary: Get organization SIP updates configuration
      description: |
        Retrieves the organization's SIP update settings.
        New organizations have SIP updates enabled by default with scope "latest".
      tags: [ updates ]
      operationId: getOrgUpdatesConfigV0
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatesConfigV0Response"
              example:
                updateEnabled: true
                updateScope: "GLOBAL"
        "401":
          description: Unauthorized - not authenticated
        "403":
          description: Forbidden - insufficient permissions (requires VIEW_UPDATES_CONFIGURATION)
    put:
      summary: Update organization SIP updates configuration
      description: |
        Updates the organization's SIP update settings.
        Changes are audited in the audit trail.
      tags: [ updates ]
      operationId: updateOrgUpdatesConfigV0
      requestBody:
        required: true
        description: Updated SIP updates configuration
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUpdatesConfigV0Request"
      responses:
        "200":
          description: Configuration was successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatesConfigV0Response"
              example:
                updateEnabled: true
                updateScope: "GLOBAL"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "401":
          description: Unauthorized - not authenticated
        "403":
          description: Forbidden - insufficient permissions (requires EDIT_UPDATES_CONFIGURATION)
  /public/v0/config/scoring:
