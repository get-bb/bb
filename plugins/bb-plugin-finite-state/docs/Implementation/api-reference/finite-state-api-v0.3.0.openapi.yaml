        latestMatchingProjectVersionId:
          type: string
          description: The latest matching project version ID.
          example: "1234567890123456789"
        projectVersionName:
          type: string
          description: The name of the latest matching project version.
          example: "v2.1.0"
    ComponentRef:
      type: object
