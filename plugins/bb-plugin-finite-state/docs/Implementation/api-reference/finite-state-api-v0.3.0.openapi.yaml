        "404":
          description: >-
            Not found. `code`: PROJECT_VERSION_NOT_FOUND, SCAN_NOT_FOUND, or NO_FILESYSTEM_SCAN.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StpRelayErrorResponse" }
