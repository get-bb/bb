  /public/v0/component-dependencies/{projectVersionId}/{profCompId}:
    get:
      summary: Navigate the component dependency tree
      description: |
        Returns nodes in the component dependency tree for navigation purposes.
        When compId is 0, returns root components (components that are not children of any dependency).
        When compId is non-zero, returns the children of the component with that ID.
        
        Results are sorted by component name (ascending) and then by component ID (ascending)
        to ensure deterministic ordering across paginated requests.
      tags: [ projects ]
      operationId: getComponentDependencyTreeV0
      parameters:
        - name: projectVersionId
          description: The project version's unique identifier.
          in: path
          required: true
          schema:
            type: string
        - name: profCompId
          description: |
            The ProfileComponent ID to navigate from, or 0 for root components.
            When 0, returns root components that are not children of any dependency.
            When non-zero, returns children of the specified component.
          in: path
          required: true
          schema:
            type: string
        - name: limit
          description: |
            Maximum number of items to return in the response.
            Default is 100. Maximum allowed value is 1000.
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          description: |
            Zero-based index indicating where to start returning results.
            Default is 0 (start from the beginning).
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentDependencyTreeV0Response"
              examples:
                rootNodes:
                  summary: Root components (compId=0)
                  value:
                    dependencies:
                      - name: "org.apache.logging.log4j/log4j-core"
                        version: "2.17.2"
                        compId: "123456789"
                        children:
                          count: 3
                      - name: "com.fasterxml.jackson.core/jackson-databind"
                        version: "2.13.0"
                        compId: "987654321"
                        children:
                          count: 0
        "400":
          description: Invalid request parameters (e.g., non-numeric compId).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "404":
          description: The projectVersionId or compId was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/component-dependencies/{projectVersionId}/node-summaries:
    get:
      summary: Get vulnerability summaries for specific nodes
      description: |
        Returns violation and warning counts for a list of ProfileComponent IDs.
        This endpoint is used to enrich search results with vulnerability data
        without fetching the full tree structure.
        
        The response includes both direct counts (violations/warnings for the node itself)
        and subtree counts (aggregate counts for the node and all its descendants).
      tags: [ projects ]
      operationId: getComponentDependencyNodeSummariesV0
      parameters:
        - name: projectVersionId
          description: The project version's unique identifier.
          in: path
          required: true
          schema:
            type: string
        - name: ids
          description: |
            Comma-separated list of ProfileComponent IDs to get summaries for.
            Maximum 500 IDs per request.
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentDependencyNodeSummariesV0Response"
              examples:
                nodeSummaries:
                  summary: Node summaries with violation counts
                  value:
                    summaries:
                      "123456789":
                        directViolations: 2
                        directWarnings: 5
                        subtreeViolations: 10
                        subtreeWarnings: 25
                        subtreeViolationComponentsCount: 3
                        subtreeWarningOnlyComponentsCount: 5
                        childrenCount: 3
                      "987654321":
                        directViolations: 0
                        directWarnings: 0
                        subtreeViolations: 0
                        subtreeWarnings: 0
                        subtreeViolationComponentsCount: 0
                        subtreeWarningOnlyComponentsCount: 0
                        childrenCount: 0
        "400":
          description: Invalid request parameters (e.g., non-numeric IDs or too many IDs).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "404":
          description: The projectVersionId was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/component-dependencies/{projectVersionId}/search:
    get:
      summary: Search component dependency trees
      description: |
        Searches across all ComponentDependency trees associated with a given projectVersionId
        and returns paths from root to each matching node.
        
        The search matches ProfileComponents where the purlName (p_name column) contains
        the searchText, case-insensitive. Each result is a path represented as an array
        of nodes from the root of the dependency tree to the matching node.
        
        If multiple Profiles exist for the same ApplicationVersion, all are searched.
      tags: [ projects ]
      operationId: searchComponentDependenciesV0
      parameters:
        - name: projectVersionId
          description: The project version's unique identifier.
          in: path
          required: true
          schema:
            type: string
        - name: searchText
          description: |
            The text to search for in component purlName (case-insensitive, partial match).
            Must be at least 3 characters long.
          in: query
          required: true
          schema:
            type: string
            minLength: 3
        - name: limit
          description: |
            Maximum number of paths to return in the response.
            Default and maximum allowed value is 100.
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: offset
          description: |
            Zero-based index indicating where to start returning results.
            Default is 0 (start from the beginning).
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sort
          description: |
            Sort order for search results. Determines how matching nodes are ordered.
            - "az": Sort alphabetically by component name (A-Z)
            - "risk": Sort by risk level (violations descending, then warnings descending, then name)
            Default is "az" (alphabetical).
          in: query
          required: false
          schema:
            type: string
            enum: [az, risk]
            default: az
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentDependencySearchV0Response"
              examples:
                searchResults:
                  summary: Search results with paths
                  value:
                    totalCount: 150
                    paths:
                      - path:
                          - name: "org.springframework/spring-core"
                            version: "5.3.0"
                            profCompId: "111111111"
                          - name: "org.apache.logging.log4j/log4j-core"
                            version: "2.17.2"
                            profCompId: "222222222"
                      - path:
                          - name: "com.fasterxml.jackson/jackson-core"
                            version: "2.13.0"
                            profCompId: "333333333"
                          - name: "org.apache.logging.log4j/log4j-api"
                            version: "2.17.2"
                            profCompId: "444444444"
        "400":
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        "404":
          description: The projectVersionId was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /public/v0/component-dependencies/{projectVersionId}/lookup:
