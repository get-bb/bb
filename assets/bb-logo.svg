    <clipPath id="upper-underlap">
      <path d="M-40-40H243.173L219.168 226.258-40 440Z"/>
    </clipPath>
    <clipPath id="lower-underlap">
      <path d="M221.66 343.061C247.234 321.797 270.309 286.682 279.815 258.612L540-40V440H-40Z"/>
    </clipPath>
    <filter id="seam-blur" x="-45%" y="-45%" width="190%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.1"/>
    </filter>
  </defs>

  <use href="#mark" fill="url(#background-fill)" fill-rule="evenodd"/>

  <g clip-path="url(#mark-clip)">
    <use href="#foreground-lower" fill="url(#foreground-fill)" mask="url(#lower-mask)"/>
    <use href="#foreground-center" fill="url(#foreground-fill)"/>
    <use href="#foreground-upper" fill="url(#foreground-fill)" mask="url(#upper-mask)"/>
  </g>

  <!-- Shadows are cast only onto the surface that passes underneath. -->
  <g clip-path="url(#mark-clip)">
    <g clip-path="url(#upper-underlap)">
      <path d="M240.8 142.2 224.2 207.2" fill="none" stroke="url(#upper-shadow)" stroke-width="8" stroke-linecap="butt" filter="url(#seam-blur)"/>
    </g>
    <g clip-path="url(#lower-underlap)">
      <path d="M228.5 335.5C246 320 263 294 274.5 270.5" fill="none" stroke="url(#lower-shadow)" stroke-width="9" stroke-linecap="butt" filter="url(#seam-blur)"/>
    </g>
  </g>

  <use href="#upper-seam" fill="none" stroke="url(#upper-rim)" stroke-width=".8"/>
  <use href="#lower-seam" fill="none" stroke="url(#lower-rim)" stroke-width=".8"/>
  <use href="#mark" fill="none" stroke="url(#outline)" stroke-width=".8" stroke-linejoin="round" fill-rule="evenodd"/>
