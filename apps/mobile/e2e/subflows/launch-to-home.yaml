# Subflow: cold-start the app (./launch-app.yaml: the dev client against
# Metro, or the embedded Release bundle with `-e BB_E2E_EMBEDDED_BUNDLE=1`),
# add the harness server when the app asks for one (the E2E build resets
# profiles on every launch), and wait for Home. Called from flows under
# ../flows with `runFlow: ../subflows/launch-to-home.yaml`; the caller's env
# supplies METRO_URL and SERVER_URL.
appId: app.getbb.mobile
---
- runFlow: ./launch-app.yaml
- runFlow:
    when:
      visible: "Connect to a bb server"
    commands:
      - tapOn:
          id: "server-url-input"
      - inputText: "${SERVER_URL}"
      - tapOn:
          id: "server-label-input"
      - inputText: "E2E backend"
      # Tapping static text dismisses the keyboard (the screen sets
      # keyboardShouldPersistTaps="handled"); Maestro's hideKeyboard swipe is
      # unreliable on this screen since the bb connect row lengthened it.
      - tapOn: "Server URL"
      - tapOn:
          id: "add-server-submit"
- extendedWaitUntil:
    visible:
      id: "home-thread-list"
    timeout: 30000
