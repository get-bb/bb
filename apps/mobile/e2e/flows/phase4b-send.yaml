# Phase 4b send: add the harness server → open the idle thread named by
# THREAD_TITLE → type "hello" into the follow-up composer → Send → the
# optimistic user row shows at once → the fake provider answers
# "Response to: hello" → the composer is empty and ready again.
#
# Create an idle thread titled "P4b send" first (the seeded "Idle thread" gets
# renamed by other flows), e.g. `POST /api/v1/threads` against the harness;
# the flow's env block names the title (Maestro ignores `-e` overrides of keys
# the flow defines):
#   maestro test e2e/flows/phase4b-send.yaml
appId: app.getbb.mobile
env:
  METRO_URL: "http://127.0.0.1:8082"
  SERVER_URL: "http://127.0.0.1:41999"
  THREAD_TITLE: "P4b send"
---
- runFlow: ../subflows/launch-to-home.yaml
- scrollUntilVisible:
    element: "${THREAD_TITLE}"
    direction: DOWN
    timeout: 60000
- tapOn: "${THREAD_TITLE}"
- extendedWaitUntil:
    visible:
      id: "thread-detail-screen"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "thread-composer-input"
    timeout: 30000
- takeScreenshot: phase4b-send-idle
# The composer is a one-line pill until focused; the execution pills render
# in the expanded card once the thread defaults resolve.
- tapOn:
    id: "thread-composer-input"
- extendedWaitUntil:
    visible:
      id: "thread-execution-controls"
    timeout: 30000
- inputText: "hello"
- takeScreenshot: phase4b-send-typed
- tapOn:
    id: "thread-composer-submit"
# Optimistic user row, then the provider's echo.
- extendedWaitUntil:
    visible: "hello"
    timeout: 10000
- extendedWaitUntil:
    visible: "Response to: hello"
    timeout: 30000
- takeScreenshot: phase4b-send-response
# The draft was cleared: the input reads its placeholder again (the input's
# accessibility label "Prompt" + the placeholder).
- assertVisible: "Prompt Follow up…"
