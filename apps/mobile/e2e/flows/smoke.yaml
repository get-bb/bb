# Phase 0 smoke (kept as diagnostics): the dev-client opens the Metro bundle,
# the runtime spike screen (Settings → Developer, route /dev/spike) renders,
# workspace packages evaluate, and the app can reach the harness backend
# over HTTP and WebSocket.
#
# Run: pnpm --filter @bb/mobile e2e:ios   (Metro on 8082, backend on 41999);
# against a Release build add `-e BB_E2E_EMBEDDED_BUNDLE=1` (see
# ../subflows/launch-app.yaml).
appId: app.getbb.mobile
env:
  METRO_URL: "http://127.0.0.1:8082"
---
- runFlow: ../subflows/launch-app.yaml
# The spike lives under /dev now; deep-link straight to it (a fresh simulator
# confirms the first `bb://` link).
- openLink: "bb://dev/spike"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: ".*Phase 0 spike.*"
    timeout: 30000
- assertVisible:
    id: "check-@bb/domain builtInThemes"
- assertVisible:
    text: "✓ @bb/thread-view fileNameFromPath: c.ts"
- assertVisible:
    text: "✓ crypto.getRandomValues.*"
- tapOn:
    id: "probe-http"
- extendedWaitUntil:
    visible: ".*HTTP ok: serverUrl=.*"
    timeout: 15000
- tapOn:
    id: "raw-ws"
- extendedWaitUntil:
    visible: ".*raw WS open.*"
    timeout: 15000
- tapOn:
    id: "open-realtime"
- extendedWaitUntil:
    visible: "realtime: connected"
    timeout: 15000
# The realtime protocol is invalidation-only: nothing arrives until state
# changes. Reloading server config broadcasts `system: config-changed`.
- tapOn:
    id: "poke-system"
- extendedWaitUntil:
    visible: ".*system changed: config-changed.*"
    timeout: 15000
- extendedWaitUntil:
    visible: ".*raw WS msg.*config-changed.*"
    timeout: 15000
- takeScreenshot: spike-screen
