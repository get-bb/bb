appId: app.getbb.mobile
env:
  SERVER_URL: "http://127.0.0.1:41999"
---
- runFlow: ../subflows/launch-app.yaml
- tapOn:
    id: "server-url-input"
- inputText: "${SERVER_URL}"
- tapOn:
    id: "server-label-input"
- inputText: "E2E backend"
- tapOn: "Server URL"
- tapOn:
    id: "add-server-submit"
- extendedWaitUntil:
    visible: "Turn on notifications"
    timeout: 30000
- tapOn: "Turn on notifications"
- extendedWaitUntil:
    visible: ".*Ask anything.*"
    timeout: 60000
- startRecording: notification-retry
- runScript:
    file: ../scripts/send-notification.js
    env:
      SCENARIO: missing
- extendedWaitUntil:
    visible: "Unavailable thread"
    timeout: 5000
- takeScreenshot: retry-notification
- tapOn:
    text: "Open"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: "Could not open the thread"
    timeout: 5000
- takeScreenshot: retry-error
- extendedWaitUntil:
    notVisible: "Could not open the thread"
    timeout: 6000
- takeScreenshot: retry-available
- assertVisible: "Unavailable thread"
- tapOn:
    text: "Open"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: "Could not open the thread"
    timeout: 5000
- takeScreenshot: retry-error-again
- extendedWaitUntil:
    notVisible: "Could not open the thread"
    timeout: 6000
- assertVisible: "Unavailable thread"
- takeScreenshot: retry-available-again
- stopRecording
- extendedWaitUntil:
    notVisible: "Unavailable thread"
    timeout: 12000
- takeScreenshot: retry-expired
