# Phase 5 bb connect: first run → Add server → "Connect with bb connect" →
# pairing with codes against the self-hosted stub apex →
# enrolled screen (session signed in, account servers listed) → Done → home
# connected through the stub gate (session cookie on fetch + /ws) → the stub
# expires the session → the app re-mints it and opens a thread → the stub revokes
# the machine → "Pair again" → re-pair with a new
# code → home connected again.
#
# Requires, besides Metro with EXPO_PUBLIC_BB_E2E=1 (METRO_URL):
#   pnpm --filter @bb/integration-tests e2e:mobile-backend
#   BB_MOBILE_E2E_SIMULATOR=<udid> pnpm --filter @bb/integration-tests e2e:mobile-connect-stub
# The stub installs its root certificate in the simulator on start; the
# gate is https://stub.localhost:42998 (STUB_URL), the apex https://localhost:42998
# (APEX_URL), the pairing code STUB-PAIR (CODE).
#
# Run: JAVA_HOME=/opt/homebrew/opt/openjdk@17 maestro test e2e/flows/shell-connect.yaml
appId: app.getbb.mobile
env:
  METRO_URL: "http://127.0.0.1:8082"
  APEX_URL: "https://localhost:42998"
  STUB_URL: "https://stub.localhost:42998"
  SERVER_HANDLE: "stub"
  CODE: "STUB-PAIR"
---
- runScript:
    file: ../scripts/connect-stub-control.js
    env:
      STUB_ACTION: "reset"
- runFlow: ../subflows/launch-app.yaml
# First run: Add server offers bb connect above the direct URL form.
- extendedWaitUntil:
    visible: "Connect to a bb server"
    timeout: 30000
- assertVisible:
    id: "add-server-connect"
- takeScreenshot: p5-connect-add-server
- tapOn:
    id: "add-server-connect"
- extendedWaitUntil:
    visible: "Connect to getbb.app"
    timeout: 15000
- takeScreenshot: p5-connect-enroll-form
- tapOn:
    id: "connect-advanced-toggle"
- scrollUntilVisible:
    element:
      id: "connect-apex-input"
    direction: DOWN
- tapOn:
    id: "connect-apex-input"
- inputText: "${APEX_URL}"
- assertVisible:
    id: "connect-apex-input"
    text: "${APEX_URL}"
- scrollUntilVisible:
    element:
      id: "connect-code-input"
    direction: UP
- tapOn:
    id: "connect-code-input"
- inputText: "EXPIRED-CODE"
- tapOn:
    id: "connect-server-input"
- inputText: "${SERVER_HANDLE}"
- assertVisible:
    id: "connect-server-input"
    text: "${SERVER_HANDLE}"
- tapOn:
    id: "Go"
- extendedWaitUntil:
    visible: "Code expired"
    timeout: 20000
- takeScreenshot: p5-connect-expired-code
- scrollUntilVisible:
    element:
      id: "connect-code-input"
    direction: UP
- tapOn:
    id: "connect-code-input"
- eraseText: 12
- inputText: "${CODE}"
- tapOn:
    id: "connect-server-input"
- tapOn:
    id: "Go"
# The first successful connection may raise the one-time push-notification
# prompt over the enrolled screen; decline it.
- extendedWaitUntil:
    visible: ".*(Paired with bb connect|Not now).*"
    timeout: 30000
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- extendedWaitUntil:
    visible: "Paired with bb connect"
    timeout: 30000
- assertVisible: ".*${STUB_URL}.*"
# The connector minted the desktop-session cookie for the new profile.
- extendedWaitUntil:
    visible:
      id: "connect-session-authenticated"
    timeout: 30000
# The account's servers (from the gate, with the machine credential): the
# enrolled one is marked, the other is one tap away.
- extendedWaitUntil:
    visible: "Other stub server"
    timeout: 20000
- assertVisible: ".*This server.*"
- takeScreenshot: p5-connect-enrolled
- tapOn:
    id: "account-server-add-other"
- extendedWaitUntil:
    visible: "Added Other stub server"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "connect-done"
    direction: DOWN
- tapOn:
    id: "connect-done"
# Home through the gate: session cookie on every fetch and on the /ws upgrade.
- extendedWaitUntil:
    visible:
      id: "shell-webview"
    timeout: 30000
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- extendedWaitUntil:
    visible: ".*Ask anything.*"
    timeout: 60000
- takeScreenshot: p5-connect-home
# Servers list: both saved profiles use bb connect.
- runFlow:
    file: ../subflows/open-bb-link.yaml
    env:
      LINK: "bb://settings/servers"
- extendedWaitUntil:
    visible: ".*bb connect, ${STUB_URL}.*"
    timeout: 10000
- assertVisible: ".*Other stub server, bb connect, .*"
- takeScreenshot: p5-connect-servers
- runFlow:
    file: ../subflows/open-bb-link.yaml
    env:
      LINK: "bb://"
- extendedWaitUntil:
    visible:
      id: "shell-webview"
    timeout: 10000
# The gate forgets the session (cookie rejected, sockets closed): the app
# re-mints one with the credential and reconnects without asking the user.
- runScript:
    file: ../scripts/connect-stub-control.js
    env:
      STUB_ACTION: "expire-session"
- runFlow:
    when:
      notVisible: ".*Idle thread.*"
    commands:
      - tapOn: ".*Toggle sidebar.*"
- extendedWaitUntil:
    visible: ".*Idle thread.*"
    timeout: 30000
- tapOn: ".*Idle thread.*"
- extendedWaitUntil:
    visible: ".*Response to: Reply with exactly READY.*"
    timeout: 60000
- runScript:
    file: ../scripts/connect-stub-control.js
    env:
      STUB_ACTION: "assert-session-renewed"
- takeScreenshot: p5-connect-session-renewed
# The credential itself is revoked: the shell offers to pair again.
- runScript:
    file: ../scripts/connect-stub-control.js
    env:
      STUB_ACTION: "revoke-machine"
- extendedWaitUntil:
    visible:
      id: "shell-repair"
    timeout: 60000
- takeScreenshot: p5-connect-auth-required
- tapOn:
    id: "shell-repair"
- extendedWaitUntil:
    visible: "Sign in again to stub"
    timeout: 15000
- tapOn:
    id: "connect-code-input"
- inputText: "${CODE}"
- tapOn: "Pairing code"
- scrollUntilVisible:
    element:
      id: "connect-submit"
    direction: DOWN
- tapOn:
    id: "connect-submit"
- extendedWaitUntil:
    visible: ".*(Paired again|Not now).*"
    timeout: 30000
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- extendedWaitUntil:
    visible: "Paired again"
    timeout: 30000
- takeScreenshot: p5-connect-reauth
- tapOn:
    id: "connect-done"
- extendedWaitUntil:
    visible:
      id: "shell-webview"
    timeout: 60000
- extendedWaitUntil:
    visible: ".*(Ask anything|follow-up).*"
    timeout: 60000
- takeScreenshot: p5-connect-home-again
