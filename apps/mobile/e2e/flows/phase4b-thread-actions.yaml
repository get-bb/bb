# Phase 4b thread actions + context banner: add the harness server → open
# the thread named by THREAD_TITLE (create it first; see README) → header
# title tap opens the rename prompt → rename → the "…" native menu lists
# the thread actions (Copy link toasts) → its git row opens the git sheet
# (when the worktree is dirty) → the context banner's changed-files row
# expands → long-pressing an assistant message opens its action sheet.
#
# iOS: native bar items and menu items have no testID, so the flow taps them
# by accessibility label / text ("Thread actions", "Commit", "Copy link").
# Message actions stay a bottom sheet on both platforms (its rows keep
# `action-sheet-<key>` ids).
#
# Setup (the flow asserts the banner's git row, which needs a dirty
# worktree): create a managed-worktree thread through the API, write a file
# into its worktree, and pass the title:
#   maestro test -e THREAD_TITLE="P4b banner parent" e2e/flows/phase4b-thread-actions.yaml
appId: app.getbb.mobile
env:
  METRO_URL: "http://127.0.0.1:8082"
  SERVER_URL: "http://127.0.0.1:41999"
  THREAD_TITLE: "P4b banner parent"
---
- runFlow: ../subflows/launch-to-home.yaml
- extendedWaitUntil:
    visible: "${THREAD_TITLE}"
    timeout: 30000
- tapOn: "${THREAD_TITLE}"
- extendedWaitUntil:
    visible:
      id: "thread-detail-screen"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "thread-detail-title"
      text: "${THREAD_TITLE}"
    timeout: 30000
# Context chips: the dirty worktree shows the changed-files chip; open its sheet.
- extendedWaitUntil:
    visible:
      id: "thread-chip-changes"
    timeout: 30000
- tapOn:
    id: "thread-chip-changes"
- extendedWaitUntil:
    visible:
      id: "workspace-changes-list"
    timeout: 10000
- assertVisible:
    id: "thread-chip-merge-base"
- takeScreenshot: phase4b-changes-sheet
# Tap the backdrop to close the sheet before the header menu.
- tapOn:
    point: "50%,15%"
- extendedWaitUntil:
    notVisible:
      id: "thread-chip-changes-sheet"
    timeout: 10000
# Git sheet from the "…" menu's first row (the dirty worktree offers Commit).
- tapOn: "Thread actions"
- extendedWaitUntil:
    visible: "Commit"
    timeout: 10000
- tapOn: "Commit"
- extendedWaitUntil:
    visible:
      id: "thread-git-sheet"
    timeout: 10000
- assertVisible:
    id: "thread-git-action-commit"
- takeScreenshot: phase4b-git-sheet
- tapOn:
    point: "50%,15%"
- extendedWaitUntil:
    notVisible:
      id: "thread-git-sheet"
    timeout: 10000
# Rename through the title (the system prompt, pre-filled and focused).
- tapOn:
    id: "thread-detail-title"
- extendedWaitUntil:
    visible: "Rename thread"
    timeout: 10000
- eraseText: 60
- inputText: "${THREAD_TITLE} renamed"
- tapOn: "Rename"
- extendedWaitUntil:
    visible:
      id: "thread-detail-title"
      text: "${THREAD_TITLE} renamed"
    timeout: 15000
# Actions menu: copy link.
- tapOn: "Thread actions"
- extendedWaitUntil:
    visible: "Copy link"
    timeout: 10000
- assertVisible: "Handoff to new thread"
- assertVisible: "Pin"
- assertVisible: "Delete"
- takeScreenshot: phase4b-thread-menu
- tapOn: "Copy link"
- extendedWaitUntil:
    visible: "Link copied"
    timeout: 10000
# Long-press an assistant message: the action sheet offers Copy text + Fork.
- longPressOn:
    id: "conversation-assistant-body"
- extendedWaitUntil:
    visible:
      id: "action-sheet-copy"
    timeout: 10000
- assertVisible:
    id: "action-sheet-fork"
- takeScreenshot: phase4b-message-actions
- tapOn:
    id: "action-sheet-fork"
- extendedWaitUntil:
    visible:
      id: "compose-fork-hint"
    timeout: 30000
- takeScreenshot: phase4b-fork-compose
