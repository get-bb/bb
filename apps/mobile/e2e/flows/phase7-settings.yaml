# Phase 7 settings: Settings home → Experiments (toggle "Edit messages" off —
# it defaults on — persisted server-side: re-open shows it off, the API
# agrees; toggle it back on) → Appearance
# (palette → Nord: the row shows "Nord", the API agrees, the UI re-tints) →
# Machines (the harness host row → detail → rename → the list shows the new
# name) → restore. Resets the server settings it touches at start and end, so
# it is safe on a shared harness backend.
#
# Requires Metro with EXPO_PUBLIC_BB_E2E=1 (first run on every launch) and the
# harness backend on 41999. Run: JAVA_HOME=/opt/homebrew/opt/openjdk@17
# maestro --device <udid> test e2e/flows/phase7-settings.yaml
appId: app.getbb.mobile
env:
  METRO_URL: "http://127.0.0.1:8082"
  SERVER_URL: "http://127.0.0.1:41999"
---
- runScript: ../scripts/phase7-settings-reset.js
- runScript: ../scripts/phase7-machine-name.js
- runFlow: ../subflows/launch-to-home.yaml
# Workspace menu → Settings.
- runFlow: ../subflows/open-settings.yaml
- extendedWaitUntil:
    visible:
      id: "settings-experiments"
    timeout: 10000
- takeScreenshot: p7-settings-home
# Experiments: toggle "Edit messages" off (PUT /settings/experiments). It is
# the one experiment the reset leaves on, so the flow drives it on → off → on.
- tapOn:
    id: "settings-experiments"
- extendedWaitUntil:
    visible:
      id: "experiment-editMessages"
      checked: true
    timeout: 15000
- tapOn:
    id: "experiment-editMessages"
- extendedWaitUntil:
    visible:
      id: "experiment-editMessages"
      checked: false
    timeout: 10000
- takeScreenshot: p7-settings-experiments
# Persisted: leave, come back, still off; and the server says so.
- tapOn:
    id: "BackButton"
- extendedWaitUntil:
    visible:
      id: "settings-experiments"
    timeout: 10000
- tapOn:
    id: "settings-experiments"
- extendedWaitUntil:
    visible:
      id: "experiment-editMessages"
      checked: false
    timeout: 15000
- runScript:
    file: ../scripts/phase7-settings-assert.js
    env:
      EXPECT_EDIT_MESSAGES: "false"
      EXPECT_THEME_ID: "default"
# Toggle it back on through the UI (the reset at the end covers failures).
- tapOn:
    id: "experiment-editMessages"
- extendedWaitUntil:
    visible:
      id: "experiment-editMessages"
      checked: true
    timeout: 10000
- tapOn:
    id: "BackButton"
# Appearance: palette → Nord (PUT /settings/appearance; the app re-tints from
# the refetched /system/config).
- extendedWaitUntil:
    visible:
      id: "settings-appearance"
    timeout: 10000
- tapOn:
    id: "settings-appearance"
- extendedWaitUntil:
    visible:
      id: "appearance-palette"
    timeout: 15000
# The mode control is a native segmented control on iOS (one id for the
# whole control); Android keeps per-option appearance-mode-<value> buttons.
- assertVisible:
    id: "appearance-mode"
- tapOn:
    id: "appearance-palette"
- extendedWaitUntil:
    visible:
      id: "appearance-palette-option-nord"
    timeout: 10000
- tapOn:
    id: "appearance-palette-option-nord"
- extendedWaitUntil:
    visible:
      id: "appearance-palette"
      text: ".*Nord.*"
    timeout: 15000
- runScript:
    file: ../scripts/phase7-settings-assert.js
    env:
      EXPECT_EDIT_MESSAGES: "true"
      EXPECT_THEME_ID: "nord"
- takeScreenshot: p7-settings-appearance-nord
- tapOn:
    id: "BackButton"
# Machines (below the fold): the harness host → detail → rename → list shows
# the new name.
- extendedWaitUntil:
    visible:
      id: "settings-appearance"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "settings-machines"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "settings-machines"
- extendedWaitUntil:
    visible:
      id: "machine-row-${output.hostId}"
    timeout: 15000
- assertVisible: ".*${output.hostName}.*"
- takeScreenshot: p7-settings-machines
- tapOn:
    id: "machine-row-${output.hostId}"
- extendedWaitUntil:
    visible:
      id: "machine-detail-name"
      text: "${output.hostName}"
    timeout: 15000
- assertVisible:
    id: "machine-permission-ceiling"
- assertVisible:
    id: "machine-rename-row"
- extendedWaitUntil:
    visible:
      id: "machine-provider-cli-codex"
    timeout: 30000
- takeScreenshot: p7-settings-machine-detail
- tapOn:
    id: "machine-rename-row"
# iOS renames through the system prompt (Alert.prompt: Cancel / Save, the
# field pre-filled and focused); Android presents the rename sheet
# (machine-rename-input / machine-rename-save).
- extendedWaitUntil:
    visible: "Save"
    timeout: 10000
- eraseText: 80
- inputText: "P7 renamed machine"
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "machine-detail-name"
      text: "P7 renamed machine"
    timeout: 15000
- tapOn:
    id: "BackButton"
- extendedWaitUntil:
    visible: ".*P7 renamed machine.*"
    timeout: 15000
- takeScreenshot: p7-settings-machines-renamed
# Restore the name and the server settings.
- runScript:
    file: ../scripts/phase7-machine-name.js
    env:
      RESTORE_NAME: "${output.hostName}"
- extendedWaitUntil:
    visible: ".*${output.hostName}.*"
    timeout: 15000
- runScript: ../scripts/phase7-settings-reset.js
