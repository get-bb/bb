# Phase 4a conversation + structure rows: the generated "Forked from …" row
# (header with the source-thread chip, collapsed preview, expand → body), and
# the long-press message actions sheet ("Copy text"), and on the Rich thread
# the authored bubble, the assistant markdown and the "Worked for" turn recap.
#
# Requires Metro with EXPO_PUBLIC_BB_E2E=1 and the harness backend (seeds the
# "Rows thread" started on behalf of "Idle thread"; see
# tests/integration/mobile-e2e/backend.ts). Works on a fresh install and on a
# device that already has the server profile.
appId: app.getbb.mobile
env:
  METRO_URL: "http://127.0.0.1:8082"
  SERVER_URL: "http://127.0.0.1:41999"
---
- runFlow: ../subflows/launch-to-home.yaml
# --- Rows thread: a thread started on behalf of "Idle thread" (fork seed
# anchor) → the generated "Forked from <Idle thread>" header, the collapsed
# one-line preview, and the full body after expanding.
- extendedWaitUntil:
    visible: "Rows thread"
    timeout: 30000
- tapOn: "Rows thread"
- extendedWaitUntil:
    visible:
      id: "thread-timeline"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "conversation-generated-header"
    timeout: 30000
- assertVisible: "(?s).*Forked from.*"
- assertVisible:
    id: "conversation-source-thread"
- assertVisible:
    id: "conversation-generated-preview"
- assertVisible: "(?s).*Worker finished: all checks pass\\..*"
- assertVisible: "(?s).*Response to: Worker finished.*"
- assertNotVisible:
    id: "conversation-generated-body"
- takeScreenshot: phase4a-rows-a
# Long-press the assistant message: the actions sheet offers "Copy text".
# (Done here rather than on the Rich thread: that thread ends with a pending
# question whose banner covers the bottom third of the screen, and rows the
# list pre-renders under it still count as "visible" to Maestro.)
- longPressOn: "(?s).*Response to: Worker finished.*"
- extendedWaitUntil:
    visible: "Copy text"
    timeout: 10000
- takeScreenshot: phase4a-rows-d
- tapOn: "Copy text"
- extendedWaitUntil:
    visible: "Copied"
    timeout: 10000
- extendedWaitUntil:
    notVisible: "Copy text"
    timeout: 10000
# Expand through the preview: the full body appears.
- tapOn:
    id: "conversation-generated-preview"
- extendedWaitUntil:
    visible:
      id: "conversation-generated-body"
    timeout: 10000
- assertVisible: "(?s).*The summary is in the next message\\..*"
- takeScreenshot: phase4a-rows-b
# The source-thread chip opens the sender thread.
- tapOn:
    id: "conversation-source-thread"
- extendedWaitUntil:
    visible:
      id: "thread-detail-title"
    timeout: 15000
- assertVisible: "Idle thread"
- back
- extendedWaitUntil:
    visible: "Rows thread"
    timeout: 15000
# --- Rich thread: bubble, assistant markdown, turn recap, long-press copy ---
# Relaunch to land on Home.
- runFlow: ../subflows/launch-to-home.yaml
- extendedWaitUntil:
    visible: "Rich thread"
    timeout: 30000
- tapOn: "Rich thread"
- extendedWaitUntil:
    visible:
      id: "thread-timeline"
    timeout: 30000
# The thread was read before: the list opens at the end, the recap sits above.
- scrollUntilVisible:
    element:
      id: "timeline-turn-completed"
    direction: UP
    timeout: 60000
    speed: 40
    visibilityPercentage: 50
    centerElement: true
- waitForAnimationToEnd
- assertVisible: "(?s).*Worked.*"
- assertVisible: "(?s).*Response to: approve:command echo hi.*"
- takeScreenshot: phase4a-rows-c
