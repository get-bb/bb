# Phase 5 deep links: first run → add the harness server → `bb://threads/<id>`
# opens the seeded "Completed thread" (pass `-e THREAD_ID=<id>`: the
# `threads.completed` id the backend prints on startup, or
# `GET /api/v1/threads`) → the web alias `bb://projects/<p>/threads/<t>`
# (pass `-e PROJECT_ID=<id>`) lands on the same thread → `bb://settings/servers`
# opens the Servers screen with the added server → `bb://settings` opens
# Settings. (The Notifications section and its per-server push row arrive
# with the push-notifications PR; this flow asserts them once they exist.)
#
# Run: pnpm --filter @bb/mobile e2e:ios   (Metro on 8082, backend on 41999)
#      maestro test -e THREAD_ID=thr_xxx -e PROJECT_ID=proj_xxx e2e/flows/phase5-links.yaml
appId: app.getbb.mobile
env:
  METRO_URL: "http://127.0.0.1:8082"
  SERVER_URL: "http://127.0.0.1:41999"
---
- runFlow: ../subflows/launch-to-home.yaml
# Scheme link straight to a thread while the app is warm.
- openLink: "bb://threads/${THREAD_ID}"
- extendedWaitUntil:
    visible:
      id: "thread-detail-header"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "thread-timeline"
    timeout: 30000
- extendedWaitUntil:
    visible: "Hello from the seed"
    timeout: 30000
- takeScreenshot: phase5-link-thread
# Back home, then the web-shaped alias path the SPA serves for the same thread.
- openLink: "bb://"
- extendedWaitUntil:
    visible:
      id: "home-thread-list"
    timeout: 30000
- openLink: "bb://projects/${PROJECT_ID}/threads/${THREAD_ID}"
- extendedWaitUntil:
    visible:
      id: "thread-detail-header"
    timeout: 30000
- extendedWaitUntil:
    visible: "Hello from the seed"
    timeout: 30000
- takeScreenshot: phase5-link-thread-alias
# Settings → Servers by link: the added server is listed.
- openLink: "bb://settings/servers"
- extendedWaitUntil:
    visible:
      id: "servers-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*E2E backend.*"
    timeout: 10000
- takeScreenshot: phase5-link-servers
# Settings root by link.
- openLink: "bb://settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- takeScreenshot: phase5-link-settings
