# Phase 4b user question: open the idle thread named by THREAD_TITLE → send
# "ask_user" (the fake provider asks a native question) → the question
# banner replaces the composer → pick the first option → Submit → the
# banner clears, the composer returns, and the provider finishes the turn
# with "Question answered: …".
#
# Create an idle thread titled "P4b ask user" first (the seeded "Idle thread" gets
# renamed by other flows), e.g. `POST /api/v1/threads` against the harness;
# the flow's env block names the title (Maestro ignores `-e` overrides of keys
# the flow defines):
#   maestro test e2e/flows/phase4b-ask-user.yaml
appId: app.getbb.mobile
env:
  METRO_URL: "http://127.0.0.1:8082"
  SERVER_URL: "http://127.0.0.1:41999"
  THREAD_TITLE: "P4b ask user"
---
- runFlow: ../subflows/launch-to-home.yaml
- scrollUntilVisible:
    element: "${THREAD_TITLE}"
    direction: DOWN
    timeout: 60000
- tapOn: "${THREAD_TITLE}"
- extendedWaitUntil:
    visible:
      id: "thread-composer-input"
    timeout: 30000
# The composer is a pill until focused; the pills render in the expanded card.
- tapOn:
    id: "thread-composer-input"
- extendedWaitUntil:
    visible:
      id: "thread-execution-controls"
    timeout: 30000
- tapOn:
    id: "thread-composer-input"
- inputText: "ask_user"
- tapOn:
    id: "thread-composer-submit"
# The question banner replaces the composer.
- extendedWaitUntil:
    visible:
      id: "pending-interaction-question"
    timeout: 30000
- assertNotVisible:
    id: "thread-composer-input"
- takeScreenshot: phase4b-ask-user-question
- tapOn:
    id: "question-option-0"
- tapOn:
    id: "question-submit"
# Resolved: the composer is back and the turn completes.
- extendedWaitUntil:
    visible:
      id: "thread-composer-input"
    timeout: 30000
- extendedWaitUntil:
    visible: "Question answered:.*"
    timeout: 30000
- takeScreenshot: phase4b-ask-user-answered
