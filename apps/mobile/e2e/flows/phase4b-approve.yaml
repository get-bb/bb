# Phase 4b approval: open the idle thread named by THREAD_TITLE → send
# "approve:command echo hi" (the fake provider blocks on a command
# approval) → the approval banner replaces the composer → Allow once → the
# banner clears and the provider answers "Response to: …". Then send the
# same prompt again → Deny → the provider answers "Denied".
#
# Create an idle thread titled "P4b approve" first (the seeded "Idle thread" gets
# renamed by other flows), e.g. `POST /api/v1/threads` against the harness;
# the flow's env block names the title (Maestro ignores `-e` overrides of keys
# the flow defines):
#   maestro test e2e/flows/phase4b-approve.yaml
appId: app.getbb.mobile
env:
  METRO_URL: "http://127.0.0.1:8082"
  SERVER_URL: "http://127.0.0.1:41999"
  THREAD_TITLE: "P4b approve"
---
- runFlow: ../subflows/launch-to-home.yaml
- scrollUntilVisible:
    element: "${THREAD_TITLE}"
    direction: DOWN
    timeout: 60000
- tapOn: "${THREAD_TITLE}"
- extendedWaitUntil:
    visible:
      id: "thread-composer-input"
    timeout: 30000
# The composer is a pill until focused; the pills render in the expanded card.
- tapOn:
    id: "thread-composer-input"
- extendedWaitUntil:
    visible:
      id: "thread-execution-controls"
    timeout: 30000
# --- Allow once -------------------------------------------------------------
- tapOn:
    id: "thread-composer-input"
- inputText: "approve:command echo hi"
- tapOn:
    id: "thread-composer-submit"
# The approval banner replaces the composer and shows the command.
- extendedWaitUntil:
    visible:
      id: "pending-interaction-approval"
    timeout: 30000
- assertNotVisible:
    id: "thread-composer-input"
- assertVisible: "(?s).*echo hi.*"
- takeScreenshot: phase4b-approve-banner
- tapOn:
    id: "approval-allow_once"
    index: 0
# Resolved: the composer is back and the provider's answer lands.
- extendedWaitUntil:
    visible:
      id: "thread-composer-input"
    timeout: 30000
- extendedWaitUntil:
    visible: "Response to: approve:command echo hi"
    timeout: 30000
- takeScreenshot: phase4b-approve-allowed
# --- Deny ------------------------------------------------------------------------
- tapOn:
    id: "thread-composer-input"
- inputText: "approve:command echo hi"
- tapOn:
    id: "thread-composer-submit"
- extendedWaitUntil:
    visible:
      id: "pending-interaction-approval"
    timeout: 30000
- tapOn:
    id: "approval-deny"
    index: 0
- extendedWaitUntil:
    visible:
      id: "thread-composer-input"
    timeout: 30000
- extendedWaitUntil:
    visible: "Denied"
    timeout: 30000
- takeScreenshot: phase4b-approve-denied
